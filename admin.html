<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>English Playroom Admin</title>
<style>
:root{--ink:#173b35;--muted:#6f7d77;--line:#dfe7e2;--green:#246a57;--pale:#f4f8f5;--gold:#9a7420;--danger:#a4463a}*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.14em;color:#71847d;font-weight:900}h1{margin:4px 0 4px;font-size:30px}.sub{color:var(--muted);font-size:12px}.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #cfdad3;background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn:disabled{opacity:.45;cursor:default}.status{margin-top:16px;padding:11px 13px;border-radius:12px;background:#eef3ef;color:#5f7069;font-size:12px}.status.error{background:#fff0ed;color:#8d4036}.status.ok{background:#eaf6ee;color:#296448}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;border:1px solid #cfdad3;border-radius:12px;padding:10px 12px;background:white}.count{font-size:12px;color:var(--muted);font-weight:800}.users{display:grid;gap:8px}.user{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 11px #173b3507;overflow:hidden}.user.open{border-color:#bfd2c8;box-shadow:0 7px 20px #173b3510}.user-summary{width:100%;appearance:none;border:0;background:#fff;color:inherit;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;cursor:pointer}.user-summary:hover{background:#fafcf9}.user-summary:focus-visible{outline:3px solid #92b8a8;outline-offset:-3px}.identity{min-width:0}.email{font-size:15px;font-weight:900;overflow-wrap:anywhere}.name{font-size:11px;color:var(--muted);margin-top:1px}.summary-meta{font-size:10px;color:var(--muted);white-space:nowrap}.coin{white-space:nowrap;background:#fff7dc;border:1px solid #ead99d;border-radius:999px;padding:6px 9px;font-weight:900;color:#7c5c12}.chev{font-size:15px;color:#7c8c85;transition:transform .18s}.user.open .chev{transform:rotate(180deg)}.user-body{border-top:1px solid #edf1ee;padding:14px 15px 15px;background:#fff}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.app{border:1px solid #e5ebe6;background:#fafcf9;border-radius:12px;padding:9px}.app strong{display:block;font-size:11px}.app .mini{font-size:10px;color:#68756f;margin-top:4px;white-space:pre-line}.grant{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #edf0ed}.grant input{width:110px;border:1px solid #ccd8d1;border-radius:9px;padding:8px 9px}.quick{border:1px solid #d7dfd9;background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer}.details{margin-top:10px}.details summary{cursor:pointer;color:#62706a;font-size:11px;font-weight:800}.raw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.raw pre{margin:0;background:#f5f7f4;border-radius:10px;padding:8px;font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}.empty{padding:32px;text-align:center;color:var(--muted)}
@media(max-width:760px){.wrap{padding:15px}.top{display:block}.auth{justify-content:flex-start;margin-top:12px}.user-summary{grid-template-columns:minmax(0,1fr) auto auto;padding:12px}.summary-meta{display:none}.apps{grid-template-columns:1fr}.raw{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><div class="eyebrow">ENGLISH PLAYROOM</div><h1>管理画面</h1><div class="sub">ユーザー・学習記録・コインを管理します。</div></div>
    <div class="auth"><span id="who" class="sub"></span><button id="login" class="btn primary" type="button">Googleで管理者ログイン</button><button id="logout" class="btn" type="button" hidden>ログアウト</button></div>
  </div>
  <div id="status" class="status">管理者ログインをしてください。</div>
  <div id="panel" hidden>
    <div class="toolbar"><input id="search" class="search" placeholder="メールアドレス・名前で検索"><span id="count" class="count"></span><button id="refresh" class="btn" type="button">↻ 更新</button></div>
    <section id="users" class="users"></section>
  </div>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ",authDomain:"eiken-retry.firebaseapp.com",projectId:"eiken-retry",storageBucket:"eiken-retry.firebasestorage.app",messagingSenderId:"231308672297",appId:"1:231308672297:web:5e8b8ede3a0246c2318b38"};
const API='https://task-quest.onrender.com';
const app=initializeApp(firebaseConfig),auth=getAuth(app),provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});
await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id);let allUsers=[],busy=false,expandedUid='';
const labels={'english-playroom':'ペット / コイン','ateru':'アテル','basic-quest':'Basic Quest','eiken-retry':'リトライノート','eiken-cloze':'英検 空所補充','eiken-title':'英検 タイトル','task-quest':'Task-Quest','eiken-pre2-interview-a':'英検準2級 面接A'};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(text,kind=''){const el=$('status');el.textContent=text;el.className='status'+(kind?' '+kind:'');}
function fmtDate(v){if(!v)return '—';const d=new Date(Number(v)||v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function mini(data={}){const keys=['lastPlayedDate','submissions','correctAnswers','completedStages','attemptedIds','rounds','clearCount','attempts','correct','petLoginDays','retryCoinProgress'];const lines=[];for(const k of keys){if(!(k in data))continue;const v=data[k];lines.push(`${k}: ${Array.isArray(v)?v.length:typeof v==='object'&&v!==null?Object.keys(v).length:v}`);}if(!lines.length){for(const [k,v] of Object.entries(data).slice(0,3))lines.push(`${k}: ${Array.isArray(v)?v.length:typeof v==='object'&&v!==null?'…':v}`);}return lines.slice(0,4).join('\n')||'記録なし';}
async function token(){const u=auth.currentUser;if(!u)throw Error('ログインしてください。');return u.getIdToken();}
async function api(path,opt={}){const idToken=await token();const res=await fetch(API+path,{...opt,headers:{...(opt.headers||{}),'Authorization':`Bearer ${idToken}`,'Content-Type':'application/json'}});let body={};try{body=await res.json();}catch{}if(!res.ok)throw Error(body.error||`管理APIエラー (${res.status})`);return body;}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;setStatus('ユーザー情報を読み込んでいます…');try{const data=await api('/api/admin/users',{method:'GET'});allUsers=data.users||[];if(expandedUid&&!allUsers.some(u=>u.uid===expandedUid))expandedUid='';$('panel').hidden=false;setStatus(`管理者として接続しました。${allUsers.length}人のユーザーを取得しました。`,'ok');render();}catch(e){$('panel').hidden=true;setStatus(e.message,'error');}finally{busy=false;$('refresh').disabled=false;}}
function appCards(apps={}){const order=['ateru','basic-quest','eiken-retry','eiken-cloze','eiken-title','task-quest','eiken-pre2-interview-a'];return order.map(id=>{const d=apps[id];return `<div class="app"><strong>${esc(labels[id]||id)}</strong><div class="mini">${esc(d?mini(d):'記録なし')}</div></div>`;}).join('');}
function rawBlocks(apps={}){return Object.entries(apps).sort(([a],[b])=>a.localeCompare(b)).map(([id,d])=>`<pre><b>${esc(labels[id]||id)}</b>\n${esc(JSON.stringify(d,null,2))}</pre>`).join('')||'<div class="sub">学習記録はまだありません。</div>';}
function userBody(u){return `<div class="user-body"><div class="meta"><span>最終ログイン: ${esc(fmtDate(u.lastLoginAt))}</span><span>登録: ${esc(fmtDate(u.createdAt))}</span><span>記録: ${Object.keys(u.apps||{}).length}教材</span></div><div class="apps">${appCards(u.apps)}</div><div class="grant"><strong>コイン付与</strong><input class="amount" type="number" min="1" max="1000000" step="1" value="10"><button class="quick" data-amount="10">+10</button><button class="quick" data-amount="100">+100</button><button class="quick" data-amount="1000">+1,000</button><button class="quick" data-amount="100000">+100,000</button><button class="btn primary grantBtn" type="button">付与する</button></div><details class="details"><summary>保存されている学習記録を詳しく見る</summary><div class="raw">${rawBlocks(u.apps)}</div></details></div>`;}
function render(){const q=$('search').value.trim().toLowerCase();const list=allUsers.filter(u=>!q||`${u.email||''} ${u.displayName||''}`.toLowerCase().includes(q));$('count').textContent=`${list.length} / ${allUsers.length}人`;$('users').innerHTML=list.map(u=>{const open=u.uid===expandedUid;return `<article class="user${open?' open':''}" data-uid="${esc(u.uid)}"><button class="user-summary" type="button" aria-expanded="${open?'true':'false'}"><div class="identity"><div class="email">${esc(u.email||'(メールなし)')}</div><div class="name">${esc(u.displayName||'名前未設定')}</div></div><div class="summary-meta">最終ログイン ${esc(fmtDate(u.lastLoginAt))}</div><div class="coin">🪙 ${Number(u.coins||0).toLocaleString('ja-JP')}</div><div class="chev" aria-hidden="true">⌄</div></button>${open?userBody(u):''}</article>`;}).join('')||'<div class="empty">該当するユーザーはいません。</div>';
 document.querySelectorAll('.user-summary').forEach(b=>b.onclick=()=>{const uid=b.closest('.user').dataset.uid;expandedUid=expandedUid===uid?'':uid;render();});document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>{const card=b.closest('.user');card.querySelector('.amount').value=b.dataset.amount;});document.querySelectorAll('.grantBtn').forEach(b=>b.onclick=()=>grant(b.closest('.user')));
}
async function grant(card){const uid=card.dataset.uid,amount=Math.floor(Number(card.querySelector('.amount').value));if(!Number.isFinite(amount)||amount<1||amount>1000000){setStatus('付与コインは1〜1,000,000で入力してください。','error');return;}const u=allUsers.find(x=>x.uid===uid);if(!confirm(`${u?.email||'このユーザー'} に ${amount.toLocaleString('ja-JP')}コイン付与しますか？`))return;try{card.querySelector('.grantBtn').disabled=true;const r=await api('/api/admin/coins',{method:'POST',body:JSON.stringify({uid,amount})});setStatus(`${u?.email||'ユーザー'} に ${amount.toLocaleString('ja-JP')}コイン付与しました。現在 ${Number(r.coins||0).toLocaleString('ja-JP')}コインです。`,'ok');await load();}catch(e){setStatus(e.message,'error');}finally{const btn=document.querySelector(`.user[data-uid="${CSS.escape(uid)}"] .grantBtn`);if(btn)btn.disabled=false;}}
$('login').onclick=()=>signInWithPopup(auth,provider).catch(e=>setStatus(e.message,'error'));
$('logout').onclick=()=>signOut(auth);
$('refresh').onclick=load;$('search').oninput=render;
onAuthStateChanged(auth,user=>{if(!user){allUsers=[];expandedUid='';$('panel').hidden=true;$('who').textContent='';$('login').hidden=false;$('logout').hidden=true;setStatus('管理者ログインをしてください。');return;}$('who').textContent=user.email||'';$('login').hidden=true;$('logout').hidden=false;load();});
</script>
</body>
</html>
