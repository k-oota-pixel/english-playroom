<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>もんすたでぃ Admin</title>
<style>
:root{--ink:#173b35;--muted:#6f7d77;--line:#dfe7e2;--green:#246a57;--pale:#f4f8f5;--gold:#9a7420;--danger:#a4463a}*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}.wrap{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.14em;color:#71847d;font-weight:900}h1{margin:4px 0 4px;font-size:30px}.sub{color:var(--muted);font-size:12px}.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid #cfdad3;background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:800;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn:disabled{opacity:.45;cursor:default}.status{margin-top:16px;padding:11px 13px;border-radius:12px;background:#eef3ef;color:#5f7069;font-size:12px}.status.error{background:#fff0ed;color:#8d4036}.status.ok{background:#eaf6ee;color:#296448}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;border:1px solid #cfdad3;border-radius:12px;padding:10px 12px;background:white}.count{font-size:12px;color:var(--muted);font-weight:800}.users{display:grid;gap:8px}.user{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 3px 11px #173b3507;overflow:hidden}.user.open{border-color:#bfd2c8;box-shadow:0 7px 20px #173b3510}.user-summary{width:100%;appearance:none;border:0;background:#fff;color:inherit;padding:13px 15px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;text-align:left;cursor:pointer}.user-summary:hover{background:#fafcf9}.user-summary:focus-visible{outline:3px solid #92b8a8;outline-offset:-3px}.identity{min-width:0}.nickname{font-size:15px;font-weight:900;overflow-wrap:anywhere}.name{font-size:11px;color:var(--muted);margin-top:1px}.summary-meta{font-size:10px;color:var(--muted);white-space:nowrap}.coin{white-space:nowrap;background:#fff7dc;border:1px solid #ead99d;border-radius:999px;padding:6px 9px;font-weight:900;color:#7c5c12}.chev{font-size:15px;color:#7c8c85;transition:transform .18s}.user.open .chev{transform:rotate(180deg)}.user-body{border-top:1px solid #edf1ee;padding:14px 15px 15px;background:#fff}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:10.5px}.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}.app{border:1px solid #e5ebe6;background:#fafcf9;border-radius:12px;padding:9px}.app strong{display:block;font-size:11px}.app .mini{font-size:10px;color:#68756f;margin-top:4px;white-space:pre-line}.grant{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid #edf0ed}.grant input{width:110px;border:1px solid #ccd8d1;border-radius:9px;padding:8px 9px}.quick{border:1px solid #d7dfd9;background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800;cursor:pointer}.details{margin-top:10px}.details summary{cursor:pointer;color:#62706a;font-size:11px;font-weight:800}.raw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.raw pre{margin:0;background:#f5f7f4;border-radius:10px;padding:8px;font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}.empty{padding:32px;text-align:center;color:var(--muted)}
@media(max-width:760px){.wrap{padding:15px}.top{display:block}.auth{justify-content:flex-start;margin-top:12px}.user-summary{grid-template-columns:minmax(0,1fr) auto auto;padding:12px}.summary-meta{display:none}.apps{grid-template-columns:1fr}.raw{grid-template-columns:1fr}h1{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div><div class="eyebrow">もんすたでぃ</div><h1>管理画面 <small class="sub">ver1.5.9</small></h1><div class="sub">ニックネーム・学習記録・コインを管理します。利用者のGmailアドレスは表示しません。</div></div>
    <div class="auth"><span id="who" class="sub"></span><button id="login" class="btn primary" type="button">Googleで管理者ログイン</button><button id="logout" class="btn" type="button" hidden>ログアウト</button></div>
  </div>
  <div id="status" class="status">管理者ログインをしてください。</div>
  <div id="panel" hidden>
    <div class="toolbar"><input id="search" class="search" placeholder="登録者全体のニックネームを検索" autocomplete="off"><span id="count" class="count"></span><button id="refresh" class="btn" type="button">↻ このページを更新</button></div>
    <div id="updated" class="sub"></div><section id="users" class="users"></section><div class="toolbar"><button id="prev" class="btn" type="button" disabled>← 前の10人</button><button id="next" class="btn" type="button" disabled>次の10人 →</button></div>
  </div>
</main>
<script type="module" src="./admin-ui.js?v=1.5.9"></script>
</body>
</html>
