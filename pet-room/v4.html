<!doctype html>
<html lang="ja">
<head>
<script src="../shell-bridge.js?v=4.0.0"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f2">
<title>ペットのおへや｜もんすたでぃ</title>
<link rel="stylesheet" href="room-only.css?v=1.1.0">
</head>
<body>
<main class="page">
  <section class="room-shell" aria-label="ペットのおへや確認用">
    <div class="room" id="room">
      <img id="roomArt" class="room-art" src="https://raw.githubusercontent.com/k-oota-pixel/english-playroom/d745cf531bc1a0c5642f1597b37e08585dff7fe1/pet-room/assets/room-empty.webp" alt="木の床と二面の壁がある、家具を置けるアイソメトリックのおへや">
      <svg class="grid-layer" id="gridLayer" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="load-error" id="loadError" hidden>部屋画像を読み込めませんでした。再読み込みしてください。</div>
    </div>
    <div class="preview-tools">
      <button class="grid-toggle" id="gridToggle" type="button" aria-pressed="false">10×10グリッドを確認</button>
      <span class="preview-note">家具とペットは一度外しています。まず部屋画像と床面の配置座標だけ確認できます。</span>
    </div>
  </section>
</main>
<script type="module" src="room-only.js?v=1.1.0"></script>
</body>
</html>
