<!doctype html>
<html lang="ja">
<head>

<title>ペットのおへや｜もんすたでぃ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf7f2;color:#514946;font-family:system-ui,-apple-system,"Noto Sans JP","Segoe UI",sans-serif}
button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.page{max-width:1080px;margin:0 auto;padding:8px 8px 30px}
.room{position:relative;width:100%;aspect-ratio:1000/748;overflow:hidden;border-radius:16px;background:#f4eee8;border:1px solid #e8ddd5}
.room-base{position:absolute;inset:0;width:100%;height:100%;display:block}
.floor-grid,.grid-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.floor-grid{z-index:1}.grid-layer{z-index:1000;opacity:0;transition:opacity .16s}.room.show-grid .grid-layer,.room.placing .grid-layer{opacity:1}
.floor-line{stroke:#b67f50;stroke-opacity:.22;stroke-width:1.5;fill:none}
.grid-cell{fill:#78b995;fill-opacity:.055;stroke:#2f7358;stroke-opacity:.62;stroke-width:1.35;transition:fill-opacity .12s,stroke-opacity .12s}.grid-cell:nth-child(odd){fill-opacity:.085}
.grid-cell.preview-valid{fill:#55bd7d;fill-opacity:.34;stroke:#267c51;stroke-opacity:1;stroke-width:2.2}.grid-cell.preview-invalid{fill:#e86f6f;fill-opacity:.35;stroke:#a83e3e;stroke-opacity:1;stroke-width:2.2}
.pet-actor{position:absolute;width:clamp(87px,16.5%,168px);aspect-ratio:1;left:50%;top:58%;pointer-events:none;will-change:left,top,transform;transform:translate(-50%,-88%) scale(var(--pet-depth,.88));transform-origin:50% 88%;transition:left var(--move-ms,1800ms) linear,top var(--move-ms,1800ms) linear,transform var(--move-ms,1800ms) linear;filter:drop-shadow(0 5px 5px #6f4b2a20)}
.pet-actor[hidden]{display:none}.pet-facing,.pet-bob,.room-pet-visual{width:100%;height:100%;transform-origin:50% 88%}.pet-facing{transition:transform .18s ease}.pet-actor.face-left .pet-facing{transform:scaleX(-1)}
.room-pet-visual{display:block;background:transparent}.room-pet-visual>svg,.room-pet-visual>img{display:block;width:100%;height:100%;object-fit:contain;overflow:visible;background:transparent}
.pet-actor.moving .room-pet-visual{animation:roomPetSway 1.15s ease-in-out infinite}.pet-actor.hop .pet-bob{animation:roomPetHop .66s cubic-bezier(.22,.78,.3,1) 1}
@keyframes roomPetSway{0%,100%{rotate:-.7deg}50%{rotate:.7deg}}
@keyframes roomPetHop{0%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(2%) scale(1.03,.97)}55%{transform:translateY(-18%) scale(.99,1.03)}78%{transform:translateY(0) scale(1.03,.97)}}
.sofa-actor{position:absolute;width:clamp(142px,27%,286px);left:50%;top:58%;z-index:300;pointer-events:none;transform:translate(-50%,-78%);transform-origin:50% 90%;transition:left .18s ease,top .18s ease,opacity .16s,filter .16s;filter:drop-shadow(0 7px 7px #6b43252f)}
.sofa-actor[hidden]{display:none}.sofa-actor img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}.room.placing .sofa-actor{filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 7px 7px #6b43252f)}
.tools{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap;padding:10px 2px 0}.toggle,.furniture-btn{appearance:none;border:1px solid #d8e2da;background:#fff;color:#416b59;border-radius:999px;padding:10px 14px;font-weight:850;font-size:11px;cursor:pointer;min-height:42px}.toggle[aria-pressed="true"],.furniture-btn.active{background:#eaf5ee;border-color:#9fc4ae}.furniture-btn{border-color:#e5c5cf;color:#96556b;background:#fff9fb}.furniture-btn:disabled{opacity:.5;cursor:default}.note{font-size:10px;color:#8b817c;line-height:1.55;flex:1 1 260px}
.placement-panel{margin:10px auto 0;padding:12px 14px 14px;max-width:360px;border:1px solid #e5d9d1;border-radius:18px;background:#fff;box-shadow:0 9px 28px #654a3820}.placement-panel[hidden]{display:none}.placement-title{text-align:center;font-size:12px;font-weight:900;color:#6d5a52;margin-bottom:8px}.placement-hint{text-align:center;font-size:10px;color:#9b8e87;margin:0 0 8px}
.dpad{display:grid;grid-template-columns:58px 58px 58px;grid-template-rows:52px 52px 52px;gap:5px;justify-content:center;align-items:center}.dpad-btn{width:58px;height:52px;border:1px solid #d9d8d2;border-radius:15px;background:#f8f8f5;color:#655e59;font-size:24px;font-weight:900;box-shadow:0 3px 0 #d8d4ce;cursor:pointer}.dpad-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d8d4ce}.dpad-btn:disabled{opacity:.28;box-shadow:none}.dpad-up{grid-column:2;grid-row:1}.dpad-left{grid-column:1;grid-row:2}.dpad-center{grid-column:2;grid-row:2;width:58px;height:52px;border-radius:15px;background:#f8edf1;display:grid;place-items:center;font-size:25px;border:1px solid #ead3db}.dpad-right{grid-column:3;grid-row:2}.dpad-down{grid-column:2;grid-row:3}.placement-actions{display:grid;grid-template-columns:1fr 1.25fr;gap:8px;margin-top:11px}.placement-action{border:1px solid #ddd5d0;border-radius:13px;min-height:44px;background:#fff;color:#6e635e;font-size:12px;font-weight:850}.placement-action.primary{background:#4f8a6d;color:#fff;border-color:#4f8a6d}.placement-action.primary:disabled{background:#b8c8c0;border-color:#b8c8c0}.placement-action.danger{color:#9b6373;background:#fff8fa;border-color:#ead2da}
@media(max-width:700px){.page{padding:6px 6px 24px}.room{border-radius:13px}.floor-line{stroke-width:1.7}.grid-cell{stroke-width:1.45}.pet-actor{width:clamp(84px,22.5%,117px)}.sofa-actor{width:clamp(126px,37%,185px)}.tools{padding-top:8px}.placement-panel{margin-top:8px}.dpad{grid-template-columns:62px 62px 62px;grid-template-rows:54px 54px 54px}.dpad-btn,.dpad-center{width:62px;height:54px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.pet-actor.moving .room-pet-visual,.pet-actor.hop .pet-bob{animation:none!important}}
</style>

<body>

<polygon points="100,500 500,700 500,718 100,518" fill="url(#fasciaL)"/><polygon points="500,700 900,500 900,518 500,718" fill="url(#fasciaR)"/><path d="M100 500 L500 700 L900 500" fill="none" stroke="#e9bd8e" stroke-width="3" opacity=".75"/>
</svg>

<script>
(()=>{
const GRID=6,FLOOR={top:{x:500,y:300},right:{x:900,y:500},bottom:{x:500,y:700},left:{x:100,y:500}};
const room=document.getElementById('room'),floorGrid=document.getElementById('floorGrid'),grid=document.getElementById('gridLayer'),toggle=document.getElementById('gridToggle');
function point(u,v){const a=FLOOR.top,b=FLOOR.right,c=FLOOR.bottom,d=FLOOR.left,iu=1-u,iv=1-v;return{x:a.x*iu*iv+b.x*u*iv+c.x*u*v+d.x*iu*v,y:a.y*iu*iv+b.y*u*iv+c.y*u*v+d.y*iu*v};}
function corners(x,y){const u0=x/GRID,v0=y/GRID,u1=(x+1)/GRID,v1=(y+1)/GRID;return[point(u0,v0),point(u1,v0),point(u1,v1),point(u0,v1)];}
function addLine(p1,p2){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.classList.add('floor-line');line.setAttribute('x1',p1.x);line.setAttribute('y1',p1.y);line.setAttribute('x2',p2.x);line.setAttribute('y2',p2.y);floorGrid.appendChild(line);}
for(let i=1;i<GRID;i++){const t=i/GRID;addLine(point(t,0),point(t,1));addLine(point(0,t),point(1,t));}
for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.classList.add('grid-cell');p.dataset.x=String(x);p.dataset.y=String(y);p.setAttribute('points',corners(x,y).map(v=>`${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' '));grid.appendChild(p);}
toggle.addEventListener('click',()=>{if(room.classList.contains('placing'))return;const on=!room.classList.contains('show-grid');room.classList.toggle('show-grid',on);toggle.setAttribute('aria-pressed',String(on));toggle.textContent=on?'グリッドを隠す':'6×6グリッドを確認';});
window.MonStudyRoomGrid=Object.freeze({GRID,FLOOR,point,grid,room});
window.MonStudyRoomOccupied=new Set();
window.MonStudyFurnitureEditing=false;
})();
</script>
<script>
(()=>{
const {GRID,point,grid,room}=window.MonStudyRoomGrid;
const occupied=window.MonStudyRoomOccupied;
const sofaActor=document.getElementById('sofaActor'),sofaImage=document.getElementById('sofaImage'),sofaButton=document.getElementById('sofaButton'),panel=document.getElementById('placementPanel'),confirmButton=document.getElementById('confirmFurniture'),cancelButton=document.getElementById('cancelFurniture'),note=document.getElementById('roomNote');
const STORE_KEY='monstudy-pet-room-sofa-v1';
let sofa={x:2,y:2,placed:false},backup=null,gridWasShown=false,assetReady=false;
const key=(x,y)=>`${x},${y}`;
function footprint(s=sofa){return[{x:s.x,y:s.y},{x:s.x+1,y:s.y}];}
function inBounds(c){return c.x>=0&&c.y>=0&&c.x<GRID&&c.y<GRID;}
function clearPreview(){grid.querySelectorAll('.grid-cell').forEach(el=>el.classList.remove('preview-valid','preview-invalid'));}
function validPlacement(){return footprint().every(c=>inBounds(c)&&!occupied.has(key(c.x,c.y)));}
function updateSofaVisual(){
 const p=point((sofa.x+1)/GRID,(sofa.y+.5)/GRID);sofaActor.style.left=`${p.x/10}%`;sofaActor.style.top=`${p.y/7.48}%`;sofaActor.style.zIndex=String(90+Math.round(p.y));sofaActor.hidden=!assetReady||(!sofa.placed&&!window.MonStudyFurnitureEditing);
 if(!window.MonStudyFurnitureEditing)return;
 clearPreview();const ok=validPlacement();for(const c of footprint()){const el=grid.querySelector(`[data-x="${c.x}"][data-y="${c.y}"]`);if(el)el.classList.add(ok?'preview-valid':'preview-invalid');}confirmButton.disabled=!ok;
 document.querySelector('[data-move="left"]').disabled=sofa.x<=0;document.querySelector('[data-move="right"]').disabled=sofa.x>=GRID-2;document.querySelector('[data-move="up"]').disabled=sofa.y<=0;document.querySelector('[data-move="down"]').disabled=sofa.y>=GRID-1;
}
function addOccupancy(s=sofa){if(!s.placed)return;for(const c of footprint(s))occupied.add(key(c.x,c.y));}
function removeOccupancy(s=sofa){for(const c of footprint(s))occupied.delete(key(c.x,c.y));}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({x:sofa.x,y:sofa.y,placed:true}));}catch{}}
function restore(){try{const v=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(v&&Number.isInteger(v.x)&&Number.isInteger(v.y)&&v.x>=0&&v.x<=GRID-2&&v.y>=0&&v.y<GRID){sofa={x:v.x,y:v.y,placed:true};}}catch{}}
async function loadAsset(){
 try{const paths=[0,1,2,3,4].map(i=>`assets/sofa-pink/sofa-${i}.b64?v=1`);const parts=await Promise.all(paths.map(async p=>{const r=await fetch(p,{cache:'force-cache'});if(!r.ok)throw new Error(`sofa asset ${r.status}`);return(await r.text()).trim();}));sofaImage.src=`data:image/webp;base64,${parts.join('')}`;await sofaImage.decode().catch(()=>{});assetReady=true;sofaButton.disabled=false;sofaButton.textContent=sofa.placed?'ソファを移動':'ソファを置く';updateSofaVisual();}
 catch(e){console.error('Sofa asset failed',e);sofaButton.textContent='ソファを読み込めません';note.textContent='ソファ画像の読み込みに失敗しました。';}
}
function startPlacement(){if(!assetReady)return;backup={...sofa};removeOccupancy(sofa);if(!sofa.placed)sofa={x:2,y:2,placed:false};gridWasShown=room.classList.contains('show-grid');window.MonStudyFurnitureEditing=true;room.classList.add('placing');panel.hidden=false;sofaButton.classList.add('active');sofaButton.textContent='ソファを配置中';sofaActor.hidden=false;note.textContent='十字キーで1マスずつ動かして、「ここに置く」で決定できます。';updateSofaVisual();}
function finishPlacement(){clearPreview();window.MonStudyFurnitureEditing=false;room.classList.remove('placing');if(!gridWasShown)room.classList.remove('show-grid');panel.hidden=true;sofaButton.classList.remove('active');sofaButton.textContent=sofa.placed?'ソファを移動':'ソファを置く';note.textContent=sofa.placed?'ソファを置きました。ペットはソファの2マスを避けて歩きます。':'ペットは部屋の中をゆっくりうろうろします。';updateSofaVisual();}
function confirmPlacement(){if(!validPlacement())return;sofa.placed=true;addOccupancy(sofa);save();finishPlacement();}
function cancelPlacement(){removeOccupancy(sofa);sofa=backup||{x:2,y:2,placed:false};addOccupancy(sofa);finishPlacement();}
function move(dir){if(!window.MonStudyFurnitureEditing)return;const next={x:sofa.x,y:sofa.y};if(dir==='left')next.x--;if(dir==='right')next.x++;if(dir==='up')next.y--;if(dir==='down')next.y++;if(next.x<0||next.x>GRID-2||next.y<0||next.y>=GRID)return;sofa.x=next.x;sofa.y=next.y;updateSofaVisual();}
sofaButton.addEventListener('click',startPlacement);panel.addEventListener('click',e=>{const b=e.target.closest('[data-move]');if(b)move(b.dataset.move);});confirmButton.addEventListener('click',confirmPlacement);cancelButton.addEventListener('click',cancelPlacement);
restore();addOccupancy(sofa);loadAsset();window.MonStudyRoomFurniture={get sofa(){return{...sofa};},occupied};
})();
</script>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {getAuth} from '../auth-session.js?v=2.2.1';

const firebaseConfig={apiKey:'AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ',authDomain:'eiken-retry.firebaseapp.com',projectId:'eiken-retry',storageBucket:'eiken-retry.firebasestorage.app',messagingSenderId:'231308672297',appId:'1:231308672297:web:5e8b8ede3a0246c2318b38'};
const actor=document.getElementById('petActor'),visual=document.getElementById('roomPetVisual'),note=document.getElementById('roomNote');
const {GRID,FLOOR,point}=window.MonStudyRoomGrid,occupied=window.MonStudyRoomOccupied;
let cell={x:2,y:3},screenPos=point((2.5)/GRID,(3.5)/GRID),roamToken=0,hopToken=0;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches,sleep=ms=>new Promise(r=>setTimeout(r,ms)),key=(x,y)=>`${x},${y}`;
function sanitizePetSvg(){const svg=visual.querySelector(':scope > svg');if(!svg)return;const shadow=svg.querySelector(':scope > .pet-shadow');if(!shadow)return;while(svg.firstElementChild&&svg.firstElementChild!==shadow)svg.firstElementChild.remove();svg.style.background='transparent';}
new MutationObserver(()=>queueMicrotask(sanitizePetSvg)).observe(visual,{childList:true,subtree:true});
function neighbors(c){return[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:c.x+dx,y:c.y+dy})).filter(n=>n.x>=0&&n.y>=0&&n.x<GRID&&n.y<GRID&&!occupied.has(key(n.x,n.y)));}
function pathTo(start,target){const q=[start],from=new Map([[key(start.x,start.y),null]]);while(q.length){const cur=q.shift();if(cur.x===target.x&&cur.y===target.y)break;for(const n of neighbors(cur)){const k=key(n.x,n.y);if(from.has(k))continue;from.set(k,cur);q.push(n);}}if(!from.has(key(target.x,target.y)))return[];const path=[];let cur=target;while(cur&&!(cur.x===start.x&&cur.y===start.y)){path.push(cur);cur=from.get(key(cur.x,cur.y));}return path.reverse();}
function randomTarget(){const candidates=[];for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const d=Math.abs(x-cell.x)+Math.abs(y-cell.y);if(!occupied.has(key(x,y))&&d>=1&&d<=3)candidates.push({x,y});}return candidates[Math.floor(Math.random()*candidates.length)]||cell;}
function randomPointInCell(c){const inset=.24,span=.52;return point((c.x+inset+Math.random()*span)/GRID,(c.y+inset+Math.random()*span)/GRID);}
function depthScale(p){const d=Math.max(0,Math.min(1,(p.y-FLOOR.top.y)/(FLOOR.bottom.y-FLOOR.top.y)));return .70+d*.34;}
function setActorPoint(p,ms=0,moving=false){if(p.x<screenPos.x-1)actor.classList.add('face-left');else if(p.x>screenPos.x+1)actor.classList.remove('face-left');actor.classList.toggle('moving',moving&&!reduceMotion);actor.style.setProperty('--move-ms',`${ms}ms`);actor.style.left=`${p.x/10}%`;actor.style.top=`${p.y/7.48}%`;actor.style.setProperty('--pet-depth',depthScale(p).toFixed(3));actor.style.zIndex=String(100+Math.round(p.y));screenPos=p;}
async function roam(){const token=++roamToken;if(reduceMotion){setActorPoint(screenPos,0,false);return;}while(token===roamToken){if(document.hidden||window.MonStudyFurnitureEditing){actor.classList.remove('moving');await sleep(450);continue;}const target=randomTarget(),path=pathTo(cell,target);for(const step of path){if(token!==roamToken)break;if(window.MonStudyFurnitureEditing)break;const p=randomPointInCell(step),ms=1450+Math.round(Math.random()*850);setActorPoint(p,ms,true);cell=step;await sleep(ms+80);}actor.classList.remove('moving');await sleep(900+Math.random()*1700);}}
async function occasionalHop(){const token=++hopToken;if(reduceMotion)return;while(token===hopToken){await sleep(10000+Math.random()*15000);if(document.hidden||window.MonStudyFurnitureEditing||actor.hidden||actor.classList.contains('moving'))continue;actor.classList.remove('hop');void actor.offsetWidth;actor.classList.add('hop');await sleep(720);actor.classList.remove('hop');}}
function cachedWallet(user){const list=[];try{list.push(window.EnglishPlayroomWallet);}catch{}try{if(window.parent&&window.parent!==window)list.push(window.parent.EnglishPlayroomWallet);}catch{}return list.find(v=>v?.uid===user.uid&&v?.data)?.data||null;}
async function renderRoomPet(appearance,shop,stage){const {renderPetSVG}=await import('../pet-art.js?v=2.1.25-room-isolated');visual.innerHTML=renderPetSVG(appearance,shop||{},stage,{background:false});sanitizePetSvg();}
async function demoPet(){await renderRoomPet({species:'cat',bodyColor:'cream',eyes:'round',eyeStyle:'round',feature:'classic',pattern:'none',baseBackground:'ivory'}, {}, 'baby');actor.hidden=false;setActorPoint(screenPos,0,false);roam();occasionalHop();}
async function bootPet(){try{const app=getApps().length?getApp():initializeApp(firebaseConfig);enableAppCheck(app);const auth=getAuth(app);await auth.authStateReady();const user=auth.currentUser;if(!user){await demoPet();return;}let data=cachedWallet(user);if(!data){const snap=await getDoc(doc(getFirestore(app),'users',user.uid,'apps','english-playroom'));data=snap.exists()?(snap.data()||{}):{};}if(!data?.petHatched){actor.hidden=true;note.textContent='まだペットがいません。孵化すると、この部屋をうろうろするようになります。';return;}window.EnglishPlayroomWallet={uid:user.uid,data};const stage=data.petAdult===false?'mystery':'baby';await renderRoomPet(data.petAdult===false?null:data.petAppearance,data.petShop||{},stage);actor.hidden=false;setActorPoint(screenPos,0,false);roam();occasionalHop();}catch(error){console.error('Room pet failed to load',error);await demoPet();}}
bootPet();
</script>
