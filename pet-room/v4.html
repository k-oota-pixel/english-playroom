(()=>{const GRID=10,F={top:{x:288,y:132},right:{x:560,y:251},bottom:{x:288,y:381},left:{x:16,y:251}};const room=document.getElementById('room'),grid=document.getElementById('gridLayer'),toggle=document.getElementById('gridToggle');function point(u,v){const a=F.top,b=F.right,c=F.bottom,d=F.left,iu=1-u,iv=1-v;return{x:a.x*iu*iv+b.x*u*iv+c.x*u*v+d.x*iu*v,y:a.y*iu*iv+b.y*u*iv+c.y*u*v+d.y*iu*v}}function corners(x,y){const u0=x/GRID,v0=y/GRID,u1=(x+1)/GRID,v1=(y+1)/GRID;return[point(u0,v0),point(u1,v0),point(u1,v1),point(u0,v1)]}for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.setAttribute('class','grid-cell');p.setAttribute('points',corners(x,y).map(q=>`${q.x.toFixed(1)},${q.y.toFixed(1)}`).join(' '));grid.appendChild(p)}toggle.addEventListener('click',()=>{const on=!room.classList.contains('show-grid');room.classList.toggle('show-grid',on);toggle.setAttribute('aria-pressed',String(on));toggle.textContent=on?'グリッドを隠す':'10×10グリッドを確認'})})();
</script>
