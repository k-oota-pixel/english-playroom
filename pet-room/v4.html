<script>(()=>{const GRID=10,EXPECTED=60700;const FLOOR={top:{x:768,y:314},right:{x:1409,y:606},bottom:{x:768,y:978},left:{x:127,y:606}};const room=document.getElementById('room'),img=document.getElementById('roomArt'),grid=document.getElementById('gridLayer'),toggle=document.getElementById('gridToggle');function point(u,v){const a=FLOOR.top,b=FLOOR.right,c=FLOOR.bottom,d=FLOOR.left,iu=1-u,iv=1-v;return{x:a.x*iu*iv+b.x*u*iv+c.x*u*v+d.x*iu*v,y:a.y*iu*iv+b.y*u*iv+c.y*u*v+d.y*iu*v}}function corners(x,y){const u0=x/GRID,v0=y/GRID,u1=(x+1)/GRID,v1=(y+1)/GRID;return[point(u0,v0),point(u1,v0),point(u1,v1),point(u0,v1)]}for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.classList.add('grid-cell');p.setAttribute('points',corners(x,y).map(v=>`${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' '));grid.appendChild(p)}toggle.addEventListener('click',()=>{const on=!room.classList.contains('show-grid');room.classList.toggle('show-grid',on);toggle.setAttribute('aria-pressed',String(on));toggle.textContent=on?'グリッドを隠す':'10×10グリッドを確認'});img.addEventListener('load',()=>room.classList.add('hq-ready'));async function loadHQ(){try{const names=['00','01','02','03','04','05a','05b','06','07','08'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(`assets/room-v3-${n}.txt?rev=20261029-hq2`,{cache:'force-cache'});if(!r.ok)throw new Error(String(r.status));return(await r.text()).trim()}));const data=parts.join('');if(data.length!==EXPECTED||!data.startsWith('UklGR'))throw new Error(`length:${data.length}`);img.src=`data:image/webp;base64,${data}`}catch(e){console.warn('HQ layer skipped',e)}}loadHQ()})();</script>
