<!doctype html>
<html lang="ja">
<head>
<script src="../shell-bridge.js?v=6.0.4"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf7f2">
<title>ペットのおへや｜もんすたでぃ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:#514946;font-family:system-ui,-apple-system,"Noto Sans JP","Segoe UI",sans-serif}.page{max-width:1080px;margin:0 auto;padding:8px 8px 30px}.room{position:relative;width:100%;aspect-ratio:1280/853;overflow:hidden;border-radius:16px;background:#f2ece5;border:1px solid #e8ddd5}.room-art{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;image-rendering:auto;opacity:0;transition:opacity .18s}.room.image-ready .room-art{opacity:1}.grid-layer{position:absolute;inset:0;width:100%;height:100%;z-index:2;opacity:0;pointer-events:none;transition:opacity .16s}.room.show-grid .grid-layer{opacity:1}.grid-cell{fill:#75b994;fill-opacity:.025;stroke:#377b61;stroke-opacity:.5;stroke-width:1.15}.grid-cell:nth-child(odd){fill-opacity:.055}.state{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#8f8178;font-size:12px;line-height:1.7}.state.error{color:#996f65}.state[hidden]{display:none}.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 2px 0}.toggle{appearance:none;border:1px solid #d8e2da;background:#fff;color:#416b59;border-radius:999px;padding:10px 14px;font-weight:850;font-size:11px;cursor:pointer;min-height:42px}.toggle[aria-pressed="true"]{background:#eaf5ee;border-color:#9fc4ae}.toggle:disabled{opacity:.45;cursor:default}.note{font-size:10px;color:#8b817c;line-height:1.55}@media(max-width:700px){.page{padding:6px 6px 24px}.room{border-radius:13px}.grid-cell{stroke-width:1.35}.tools{padding-top:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="page">
<section aria-label="ペットのおへや確認用">
<div class="room" id="room">
<img id="roomArt" class="room-art" alt="家具を置ける木目のアイソメトリックのおへや">
<svg class="grid-layer" id="gridLayer" viewBox="0 0 1536 1024" preserveAspectRatio="none" aria-hidden="true"></svg>
<div class="state" id="loadState">高画質のおへやを読み込み中…</div>
</div>
<div class="tools"><button class="toggle" id="gridToggle" type="button" aria-pressed="false" disabled>10×10グリッドを確認</button><span class="note">家具・ペットはまだ未実装です。まず部屋画像と10×10床座標を確認します。</span></div>
</section>
</main>
<script>
(()=>{
const GRID=10,EXPECTED=60700;
const FLOOR={top:{x:768,y:314},right:{x:1409,y:606},bottom:{x:768,y:978},left:{x:127,y:606}};
const room=document.getElementById('room'),img=document.getElementById('roomArt'),grid=document.getElementById('gridLayer'),toggle=document.getElementById('gridToggle'),state=document.getElementById('loadState');
function point(u,v){const a=FLOOR.top,b=FLOOR.right,c=FLOOR.bottom,d=FLOOR.left,iu=1-u,iv=1-v;return{x:a.x*iu*iv+b.x*u*iv+c.x*u*v+d.x*iu*v,y:a.y*iu*iv+b.y*u*iv+c.y*u*v+d.y*iu*v}}
function corners(x,y){const u0=x/GRID,v0=y/GRID,u1=(x+1)/GRID,v1=(y+1)/GRID;return[point(u0,v0),point(u1,v0),point(u1,v1),point(u0,v1)]}
for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.classList.add('grid-cell');p.setAttribute('points',corners(x,y).map(v=>`${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' '));grid.appendChild(p)}
toggle.addEventListener('click',()=>{const on=!room.classList.contains('show-grid');room.classList.toggle('show-grid',on);toggle.setAttribute('aria-pressed',String(on));toggle.textContent=on?'グリッドを隠す':'10×10グリッドを確認'});
img.addEventListener('load',()=>{room.classList.add('image-ready');state.hidden=true;toggle.disabled=false});
img.addEventListener('error',()=>fail('部屋画像を表示できませんでした。'));
function fail(msg){state.hidden=false;state.classList.add('error');state.textContent=msg;toggle.disabled=true}
async function loadRoom(){try{const names=['00','01','02','03','04','05a','05b','06','07','08'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(`assets/room-v3-${n}.txt?rev=20261029-hq1`,{cache:'force-cache'});if(!r.ok)throw new Error(String(r.status));return(await r.text()).trim()}));const data=parts.join('');if(data.length!==EXPECTED||!data.startsWith('UklGR'))throw new Error(`length:${data.length}`);img.src=`data:image/webp;base64,${data}`}catch(e){console.error('room image load failed',e);fail('高画質の部屋画像を読み込めませんでした。')}}
loadRoom();
})();
</script>
</body>
</html>
