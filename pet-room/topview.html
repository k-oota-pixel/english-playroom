<style>
*{box-sizing:border-box}body{margin:0;background:#fbf7f2;color:#514946;font-family:system-ui,-apple-system,"Noto Sans JP","Segoe UI",sans-serif}button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.page{max-width:1080px;margin:0 auto;padding:8px 8px 30px}.room{position:relative;width:100%;max-width:760px;margin:0 auto;aspect-ratio:1;overflow:hidden;border-radius:16px;background:#f4eee8;border:1px solid #e8ddd5}.room-base{position:absolute;inset:0;width:100%;height:100%;display:block}.floor-grid,.grid-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.floor-grid{z-index:1}.grid-layer{z-index:1000;opacity:0;transition:opacity .16s}.room.placing .grid-layer{opacity:1}.floor-line{stroke:#b67f50;stroke-opacity:.22;stroke-width:1.5;fill:none}.grid-cell{fill:#78b995;fill-opacity:.055;stroke:#2f7358;stroke-opacity:.62;stroke-width:1.35;transition:fill-opacity .12s,stroke-opacity .12s}.grid-cell:nth-child(odd){fill-opacity:.085}.grid-cell.preview-valid{fill:#55bd7d;fill-opacity:.34;stroke:#267c51;stroke-opacity:1;stroke-width:2.2}.grid-cell.preview-invalid{fill:#e86f6f;fill-opacity:.35;stroke:#a83e3e;stroke-opacity:1;stroke-width:2.2}.pet-actor{position:absolute;width:clamp(58px,12.8%,118px);aspect-ratio:1;left:50%;top:58%;pointer-events:none;will-change:left,top,transform;transform:translate(-50%,-82%) scale(var(--pet-depth,.9));transform-origin:50% 88%;transition:left var(--move-ms,1800ms) linear,top var(--move-ms,1800ms) linear,transform var(--move-ms,1800ms) linear;filter:drop-shadow(0 5px 5px #6f4b2a20)}.pet-actor[hidden]{display:none}.pet-facing,.pet-bob,.room-pet-visual{width:100%;height:100%;transform-origin:50% 88%}.pet-facing{transition:transform .18s ease}.pet-actor.face-left .pet-facing{transform:scaleX(-1)}.room-pet-visual{display:block;background:transparent}.room-pet-visual>svg,.room-pet-visual>img{display:block;width:100%;height:100%;object-fit:contain;overflow:visible;background:transparent}.pet-actor.moving .room-pet-visual{animation:roomPetSway 1.15s ease-in-out infinite}.pet-actor.hop .pet-bob{animation:roomPetHop .66s cubic-bezier(.22,.78,.3,1) 1}@keyframes roomPetSway{0%,100%{rotate:-.7deg}50%{rotate:.7deg}}@keyframes roomPetHop{0%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(2%) scale(1.03,.97)}55%{transform:translateY(-18%) scale(.99,1.03)}78%{transform:translateY(0) scale(1.03,.97)}}.sofa-actor{position:absolute;left:50%;top:58%;z-index:300}.sofa-actor[hidden]{display:none}.sofa-actor img{display:block;width:100%;height:auto}.tools{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:flex-start;gap:8px;flex-wrap:wrap;padding:10px 2px 0}.room-version{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 13px;border:1px solid #ddcbbd;border-radius:999px;background:#fffaf5;color:#69584c;font-size:11px;white-space:nowrap}.room-version-title{font-weight:800}.room-version-number{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8b6a4d;letter-spacing:.02em}.furniture-btn.active{background:#eaf5ee;border-color:#9fc4ae}.furniture-btn{border-color:#e5c5cf;color:#96556b;background:#fff9fb}.furniture-btn:disabled{opacity:.5;cursor:default}.note{font-size:10px;color:#8b817c;line-height:1.55;flex:1 1 260px}@media(max-width:700px){.page{padding:6px 6px 24px}.room{border-radius:13px}.floor-line{stroke-width:1.7}.grid-cell{stroke-width:1.45}.pet-actor{width:clamp(54px,12.8%,106px)}.tools{padding-top:8px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.pet-actor.moving .room-pet-visual,.pet-actor.hop .pet-bob{animation:none!important}}

<div class="room" id="room"><svg class="room-base" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet" role="img" aria-label="真上から見た木の床のペットのおへや"><defs><pattern id="woodPattern" width="128" height="128" patternUnits="userSpaceOnUse"><rect width="128" height="128" fill="#d7b78d"/><path d="M0 0H128M0 63H128M0 127H128M64 0V63M25 63V127" stroke="#ae895f" stroke-width="3" opacity=".36"/><path d="M0 10H128M0 74H128" stroke="#efd8b6" stroke-width="2" opacity=".42"/></pattern></defs><rect width="1000" height="1000" fill="#f5eddc"/><rect x="78" y="78" width="844" height="844" rx="26" fill="#ac855c"/><rect x="96" y="96" width="808" height="808" rx="11" fill="#e8d1af"/><rect x="116" y="116" width="768" height="768" fill="url(#woodPattern)"/><path d="M110 109H890V121H110Z" fill="#f3e0bc"/><path d="M110 879H890V891H110Z" fill="#9d744a"/><path d="M109 115H121V885H109Z" fill="#bf9969"/><path d="M879 115H891V885H879Z" fill="#aa8056"/><rect x="98" y="98" width="804" height="10" fill="#f3e0bc"/><rect x="98" y="98" width="10" height="804" fill="#e9d1a8"/><rect x="98" y="898" width="804" height="11" fill="#987249"/><rect x="897" y="98" width="12" height="811" fill="#9c7953"/></svg><svg class="floor-grid" id="floorGrid" viewBox="0 0 1000 748" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg><div class="sofa-actor" id="sofaActor" hidden><img id="sofaImage" alt=""></div><div class="pet-actor" id="petActor" hidden aria-hidden="true"><div class="pet-facing"><div class="pet-bob"><div class="room-pet-visual" id="roomPetVisual"></div></div></div></div><svg class="grid-layer" id="gridLayer" viewBox="0 0 1000 748" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>

<script>(()=>{const GRID=6,FLOOR={top:{x:500,y:116},right:{x:884,y:500},bottom:{x:500,y:884},left:{x:116,y:500}};const room=document.getElementById('room'),floorGrid=document.getElementById('floorGrid'),grid=document.getElementById('gridLayer');function point(u,v){return{x:116+768*u,y:116+768*v}}function corners(x,y){const u0=x/GRID,v0=y/GRID,u1=(x+1)/GRID,v1=(y+1)/GRID;return[point(u0,v0),point(u1,v0),point(u1,v1),point(u0,v1)]}function addLine(p1,p2){const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.classList.add('floor-line');line.setAttribute('x1',p1.x);line.setAttribute('y1',p1.y);line.setAttribute('x2',p2.x);line.setAttribute('y2',p2.y);floorGrid.appendChild(line)}for(let i=1;i<GRID;i++){const t=i/GRID;addLine(point(t,0),point(t,1));addLine(point(0,t),point(1,t))}for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const p=document.createElementNS('http://www.w3.org/2000/svg','polygon');p.classList.add('grid-cell');p.dataset.x=String(x);p.dataset.y=String(y);p.setAttribute('points',corners(x,y).map(v=>`${v.x.toFixed(1)},${v.y.toFixed(1)}`).join(' '));grid.appendChild(p)}window.MonStudyRoomGrid=Object.freeze({GRID,FLOOR,point,grid,room});window.MonStudyRoomOccupied=new Set();window.MonStudyFurnitureEditing=false})();</script>

<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';import {getAuth} from '../auth-session.js?v=2.3.2';import {enableAppCheck} from '../firebase-security.js?v=2.1.9';
const firebaseConfig={apiKey:'AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ',authDomain:'eiken-retry.firebaseapp.com',projectId:'eiken-retry',storageBucket:'eiken-retry.firebasestorage.app',messagingSenderId:'231308672297',appId:'1:231308672297:web:5e8b8ede3a0246c2318b38'};const actor=document.getElementById('petActor'),visual=document.getElementById('roomPetVisual'),note=document.getElementById('roomNote');const {GRID,FLOOR,point}=window.MonStudyRoomGrid,occupied=window.MonStudyRoomOccupied;let cell={x:2,y:3},screenPos=point(2.5/GRID,3.5/GRID),roamToken=0,hopToken=0;const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches,sleep=ms=>new Promise(r=>setTimeout(r,ms)),key=(x,y)=>`${x},${y}`;
function sanitizePetSvg(){const svg=visual.querySelector(':scope > svg');if(!svg)return;const shadow=svg.querySelector(':scope > .pet-shadow');if(!shadow)return;while(svg.firstElementChild&&svg.firstElementChild!==shadow)svg.firstElementChild.remove();svg.style.background='transparent'}new MutationObserver(()=>queueMicrotask(sanitizePetSvg)).observe(visual,{childList:true,subtree:true});function neighbors(c){return[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>({x:c.x+dx,y:c.y+dy})).filter(n=>n.x>=0&&n.y>=0&&n.x<GRID&&n.y<GRID&&!occupied.has(key(n.x,n.y)))}function pathTo(start,target){const q=[start],from=new Map([[key(start.x,start.y),null]]);while(q.length){const cur=q.shift();if(cur.x===target.x&&cur.y===target.y)break;for(const n of neighbors(cur)){const k=key(n.x,n.y);if(from.has(k))continue;from.set(k,cur);q.push(n)}}if(!from.has(key(target.x,target.y)))return[];const path=[];let cur=target;while(cur&&!(cur.x===start.x&&cur.y===start.y)){path.push(cur);cur=from.get(key(cur.x,cur.y))}return path.reverse()}function randomTarget(){const candidates=[];for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){const d=Math.abs(x-cell.x)+Math.abs(y-cell.y);if(!occupied.has(key(x,y))&&d>=1&&d<=3)candidates.push({x,y})}return candidates[Math.floor(Math.random()*candidates.length)]||cell}function randomPointInCell(c){const inset=.24,span=.52;return point((c.x+inset+Math.random()*span)/GRID,(c.y+inset+Math.random()*span)/GRID)}function depthScale(p){return .9}function setActorPoint(p,ms=0,moving=false){if(p.x<screenPos.x-1)actor.classList.add('face-left');else if(p.x>screenPos.x+1)actor.classList.remove('face-left');actor.classList.toggle('moving',moving&&!reduceMotion);actor.style.setProperty('--move-ms',`${ms}ms`);actor.style.left=`${p.x/10}%`;actor.style.top=`${p.y/10}%`;actor.style.setProperty('--pet-depth',depthScale(p).toFixed(3));actor.style.zIndex=String(100+Math.round(p.y));screenPos=p}async function roam(){const token=++roamToken;if(reduceMotion){setActorPoint(screenPos,0,false);return}while(token===roamToken){if(document.hidden||window.MonStudyFurnitureEditing){actor.classList.remove('moving');await sleep(450);continue}const target=randomTarget(),path=pathTo(cell,target);for(const step of path){if(token!==roamToken||window.MonStudyFurnitureEditing)break;const p=randomPointInCell(step),ms=1450+Math.round(Math.random()*850);setActorPoint(p,ms,true);cell=step;await sleep(ms+80)}actor.classList.remove('moving');await sleep(900+Math.random()*1700)}}async function occasionalHop(){const token=++hopToken;if(reduceMotion)return;while(token===hopToken){await sleep(10000+Math.random()*15000);if(document.hidden||window.MonStudyFurnitureEditing||actor.hidden||actor.classList.contains('moving'))continue;actor.classList.remove('hop');void actor.offsetWidth;actor.classList.add('hop');await sleep(720);actor.classList.remove('hop')}}function cachedWallet(user){const list=[];try{list.push(window.EnglishPlayroomWallet)}catch{}try{if(window.parent&&window.parent!==window)list.push(window.parent.EnglishPlayroomWallet)}catch{}return list.find(v=>v?.uid===user.uid&&v?.data)?.data||null}async function renderRoomPet(appearance,shop,stage){const {renderPetSVG}=await import('../pet-art.js?v=2.1.25-room-isolated');visual.innerHTML=renderPetSVG(appearance,shop||{},stage,{background:false});sanitizePetSvg()}async function demoPet(){await renderRoomPet({species:'cat',bodyColor:'cream',eyes:'round',eyeStyle:'round',feature:'classic',pattern:'none',baseBackground:'ivory'}, {}, 'baby');actor.hidden=false;setActorPoint(screenPos,0,false);roam();occasionalHop()}async function bootPet(){try{const app=getApps().length?getApp():initializeApp(firebaseConfig);enableAppCheck(app);const auth=getAuth(app);await auth.authStateReady();const user=auth.currentUser;if(!user){await demoPet();return}let data=cachedWallet(user);if(!data){const snap=await getDoc(doc(getFirestore(app),'users',user.uid,'apps','english-playroom'));data=snap.exists()?(snap.data()||{}):{}}if(!data?.petHatched){actor.hidden=true;note.textContent='まだペットがいません。孵化すると、この部屋をうろうろするようになります。';return}window.EnglishPlayroomWallet={uid:user.uid,data};const stage=data.petAdult===false?'mystery':'baby';await renderRoomPet(data.petAdult===false?null:data.petAppearance,data.petShop||{},stage);actor.hidden=false;setActorPoint(screenPos,0,false);roam();occasionalHop()}catch(error){console.error('Room pet failed to load',error);await demoPet()}}bootPet();
