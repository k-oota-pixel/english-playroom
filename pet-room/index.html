<!doctype html>
<html lang="ja">
<head>
<style id="monstudy-access-lock">html:before{content:"ログインを確認しています…";position:fixed;inset:0;display:grid;place-content:center;background:#f6f5ef;color:#193d38;font:16px system-ui}body{visibility:hidden!important}</style><script type="module" src="https://k-oota-pixel.github.io/english-playroom/access-gate.js?v=2.3.1"></script>
<script src="../shell-bridge.js?v=2.1.1"></script>

<style>
*{box-sizing:border-box}
:root{
  --ink:#4f4947;--muted:#8a807b;--line:#eadfd9;--paper:#fff5f2;--panel:#fffdfb;
  --green:#6f9a83;--gold:#e8bd68;--rose:#e9a8a9;--shadow:#8d6f6630
}
body{margin:0;background:linear-gradient(#fff7f4,#fff2ee);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP","Segoe UI",sans-serif}
button{font:inherit;touch-action:manipulation}
.page{max-width:1050px;margin:auto;padding:15px 14px 42px}
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:10px}
.eyebrow{font-size:9px;font-weight:900;letter-spacing:.16em;color:#b58c86}
h1{font-size:clamp(24px,5vw,34px);margin:3px 0 4px;line-height:1.2;color:#5a4e4b}
.intro p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.save-area{display:flex;align-items:center;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.status{font-size:9.5px;color:var(--muted);min-height:15px;text-align:right}
.primary,.soft,.tool,.swatch,.stored{
  border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:850;cursor:pointer;
  box-shadow:0 3px 8px #7a5b5210
}
.primary{background:#729b86;border-color:#729b86;color:#fff;padding:9px 14px}
.soft{padding:9px 11px;background:#fffdfb}
.primary:disabled,.tool:disabled{opacity:.4;cursor:default}
.room-shell{background:#fffdfb;border:1px solid #f0ded7;border-radius:22px;padding:10px;box-shadow:0 12px 30px #8e6e6114}
.room{
  --wall-l:#f6dcd6;--wall-r:#efd0cb;--wall-accent:#f3b9b6;
  --floor:#efcfa7;--floor-light:#f7dfbd;--floor-line:#c99f73;
  position:relative;width:100%;aspect-ratio:1000/760;min-height:310px;overflow:hidden;border-radius:18px;
  background:#faeeeb;isolation:isolate;user-select:none;-webkit-user-select:none
}
.room.wall-blue{--wall-l:#dfecef;--wall-r:#d4e4e7;--wall-accent:#afced2}
.room.wall-green{--wall-l:#dfead9;--wall-r:#d4e3cf;--wall-accent:#b4cda9}
.room.wall-rose{--wall-l:#f2d9e1;--wall-r:#ead0d9;--wall-accent:#dda9b8}
.room.floor-dark{--floor:#d8b286;--floor-light:#e6c398;--floor-line:#ae8059}
.room.floor-check{--floor:#f0d4d9;--floor-light:#f7e2e6;--floor-line:#d4a8b2}
.backdrop{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.furniture-layer{position:absolute;inset:0;z-index:20;pointer-events:none}
.furniture{
  position:absolute;border:0;padding:0;background:transparent;transform:translate(-50%,-83%);transform-origin:50% 83%;
  cursor:grab;touch-action:none;pointer-events:auto;outline:none;
  filter:drop-shadow(0 7px 6px #8b6b5a24)
}
.furniture:active{cursor:grabbing}
.furniture svg{display:block;width:100%;height:auto;overflow:visible}
.furniture.selected{filter:drop-shadow(0 0 6px #e8bd68)}
.furniture.selected::after,.furniture:focus-visible::after{
  content:"";position:absolute;inset:-5px;border:3px solid var(--gold);border-radius:14px;pointer-events:none
}
.furniture:focus-visible::after{border-color:#6d9a83}
.pet-in-room{
  position:absolute;left:50%;top:60%;width:12.5%;min-width:54px;max-width:126px;
  transform:translate(-50%,-80%);transform-origin:50% 82%;
  pointer-events:none;filter:drop-shadow(0 8px 6px #876a5b28);will-change:left,top,transform
}
.pet-in-room svg{display:block;width:100%;height:auto;transform:scaleX(var(--pet-face,1));transform-origin:50% 55%}
.pet-placeholder{font-size:48px;text-align:center}
.pet-shadow{
  position:absolute;left:50%;bottom:3%;width:58%;height:12%;border-radius:50%;background:#8d6e6422;
  transform:translateX(-50%);filter:blur(1px);z-index:-1
}
.bottom{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:11px;margin-top:11px}
.panel{background:#fffdfb;border:1px solid var(--line);border-radius:17px;padding:12px;box-shadow:0 7px 18px #7b625610}
.panel h2{font-size:13px;margin:0 0 8px;color:#5c504d}
.note{font-size:9.5px;color:var(--muted);margin:-3px 0 9px;line-height:1.55}
.selected-name{font-size:12px;font-weight:900;min-height:19px;margin-bottom:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{min-height:40px;min-width:44px;padding:7px 10px;background:#fffaf7}
.tool.store{color:#9a6258}
.iso-nudge{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,38px);gap:4px;margin-top:8px}
.iso-nudge .tool{min-height:38px;padding:4px}
.iso-nudge .nw{grid-column:1}.iso-nudge .ne{grid-column:3}.iso-nudge .sw{grid-column:1;grid-row:2}.iso-nudge .se{grid-column:3;grid-row:2}
.storage{margin-top:10px;padding-top:9px;border-top:1px solid #eee3de}
.storage-list{display:flex;gap:6px;flex-wrap:wrap}.stored{padding:7px 9px;font-size:10px;background:#fff9f5}
.empty-storage{font-size:9.5px;color:var(--muted)}
.theme-groups{display:grid;gap:10px}.theme-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.theme-row strong{font-size:10px;min-width:38px}
.swatch{width:42px;height:31px;padding:0;position:relative}
.swatch[aria-pressed="true"]::after{content:"✓";position:absolute;right:2px;bottom:1px;width:16px;height:16px;display:grid;place-items:center;border-radius:50%;background:#fff;font-size:11px;box-shadow:0 1px 4px #0002}
.wall-cream{background:linear-gradient(135deg,#f6dcd6 50%,#efd0cb 50%)}.wall-blue{background:linear-gradient(135deg,#dfecef 50%,#d4e4e7 50%)}
.wall-green{background:linear-gradient(135deg,#dfead9 50%,#d4e3cf 50%)}.wall-rose{background:linear-gradient(135deg,#f2d9e1 50%,#ead0d9 50%)}
.floor-light{background:#efcfa7}.floor-dark{background:#d8b286}.floor-check{background:repeating-conic-gradient(#f0d4d9 0 25%,#f8e6e8 0 50%) 0/14px 14px}
.preview-note{margin:11px 0 0;font-size:9.5px;color:#968781;line-height:1.55;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;z-index:9999;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#6f8277;color:#fff;padding:9px 13px;border-radius:999px;font-size:10.5px;font-weight:800;transition:.18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:700px){
  .page{padding:11px 9px 28px}.intro{align-items:flex-start;flex-direction:column;gap:7px}.save-area{justify-content:flex-start}.status{text-align:left}
  .room-shell{padding:6px;border-radius:15px}.room{min-height:300px;border-radius:12px}.pet-in-room{width:14%}.bottom{grid-template-columns:1fr}.panel{padding:11px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.pet-in-room{will-change:auto}}
</style>
</head>
<body>
<main class="page">
<section class="intro">
  <div>
    <div class="eyebrow">MINIATURE ROOM PREVIEW</div>
    <h1>ペットのおへや</h1>
    <p>かわいいミニチュア風のアイソメ部屋。家具を動かす間も、ペットは部屋の中をのんびり歩きます。</p>
  </div>
  <div>
    <div class="save-area">
      <button class="soft" id="resetBtn" type="button">初期配置</button>
      <button class="primary" id="saveBtn" type="button" disabled>保存</button>

<section class="room-shell">

</svg>

<div class="furniture-layer" id="furnitureLayer"></div>
<div class="pet-in-room" id="petInRoom" aria-label="あなたのペット" style="--pet-face:1">
  <div class="pet-shadow"></div>
  <div class="pet-placeholder">🐾</div>
</div>
</div>
</section>

<section class="bottom">
  <div class="panel">
    <h2>家具を動かす</h2>
    <p class="note">家具をドラッグ。矢印は床の4方向へ少しずつ移動します。</p>
    <div class="selected-name" id="selectedName">家具を選んでください</div>
    <div class="tools">
      <button class="tool" id="rotateBtn" type="button" disabled>↻ 向きを変える</button>
      <button class="tool store" id="storeBtn" type="button" disabled>収納</button>
    </div>
    <div class="iso-nudge">
      <button class="tool nw" data-nudge="-2,0" type="button" disabled aria-label="左奥へ">↖</button>
      <button class="tool ne" data-nudge="0,-2" type="button" disabled aria-label="右奥へ">↗</button>
      <button class="tool sw" data-nudge="0,2" type="button" disabled aria-label="左手前へ">↙</button>
      <button class="tool se" data-nudge="2,0" type="button" disabled aria-label="右手前へ">↘</button>
    </div>
    <div class="storage"><h2>収納</h2><div class="storage-list" id="storageList"></div></div>
  </div>
  <div class="panel">
    <h2>おへやの雰囲気</h2>
    <div class="theme-groups">
      <div class="theme-row" id="wallChoices">
        <strong>かべ</strong>
        <button class="swatch wall-cream" data-wall="wall-cream" type="button" aria-label="ピーチ"></button>
        <button class="swatch wall-blue" data-wall="wall-blue" type="button" aria-label="ミルキーブルー"></button>
        <button class="swatch wall-green" data-wall="wall-green" type="button" aria-label="ミント"></button>
        <button class="swatch wall-rose" data-wall="wall-rose" type="button" aria-label="ローズ"></button>
      </div>
      <div class="theme-row" id="floorChoices">
        <strong>ゆか</strong>
        <button class="swatch floor-light" data-floor="floor-light" type="button" aria-label="メープル"></button>
        <button class="swatch floor-dark" data-floor="floor-dark" type="button" aria-label="ハニー"></button>
        <button class="swatch floor-check" data-floor="floor-check" type="button" aria-label="ピンクタイル"></button>
      </div>
    </div>
    <p class="preview-note">開発中の確認用です。メインページにはまだ入口を出していません。</p>
  </div>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const config={apiKey:'AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ',authDomain:'eiken-retry.firebaseapp.com',projectId:'eiken-retry',storageBucket:'eiken-retry.firebasestorage.app',messagingSenderId:'231308672297',appId:'1:231308672297:web:5e8b8ede3a0246c2318b38'};
const app=getApps().length?getApp():initializeApp(config);enableAppCheck(app);

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

function markDirty(){
  dirty=true;saveBtn.disabled=!user;

function toast(text){
  const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');

function project(item){
  const sum=item.u+item.v;
  return {
    x:50+(item.u-item.v)*.40,
    y:(290+2*sum)/760*100,
    scale:.78+sum*.0019,
    z:100+Math.round(sum*10)
  };
}

  if(type==='chair')s=swap?`

  `:`

    <polygon points="60,28 18,48 18,70 60,50" fill="#f4c9c7" stroke="${outline}" stroke-width="3"/>
    <path d="M27 72v25M93 72v25" stroke="${outline}" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="44" cy="52" rx="15" ry="10" fill="#ffe6e1"/><ellipse cx="75" cy="52" rx="15" ry="10" fill="#f7d3dd"/>
  `;
  if(type==='shelf')s=`
    <polygon points="60,18 97,36 60,55 23,36" fill="#efbc83" stroke="${outline}" stroke-width="3"/>
    <polygon points="23,36 60,55 60,111 23,92" fill="#e1ab75" stroke="${outline}" stroke-width="3"/>
    <polygon points="97,36 60,55 60,111 97,92" fill="#c98e63" stroke="${outline}" stroke-width="3"/>
    <path d="M28 56L59 71L92 55M28 75L59 90L92 74" fill="none" stroke="#fff0da" stroke-width="4"/>
    <path d="M34 60l10 5v13l-10-5zM76 61l10-5v13l-10 5z" fill="${mint}"/>
    <path d="M47 81l10 5v13l-10-5zM68 83l11-5v13l-11 5z" fill="${pink}"/>
  `;
  if(type==='plant')s=`
    <ellipse cx="60" cy="88" rx="21" ry="10" fill="#c9896b"/>
    <path d="M43 87l6 25h22l6-25" fill="#e0a17f" stroke="${outline}" stroke-width="3"/>
    <g fill="${mint}" stroke="#71917b" stroke-width="2">
      <ellipse cx="49" cy="57" rx="12" ry="29" transform="rotate(-29 49 57)"/>
      <ellipse cx="71" cy="55" rx="12" ry="30" transform="rotate(29 71 55)"/>
      <ellipse cx="60" cy="47" rx="11" ry="32"/>
    </g>
  `;
  if(type==='lamp')s=`
    <ellipse cx="60" cy="105" rx="19" ry="8" fill="#b38a72"/>
    <path d="M60 42v64" stroke="#9c765e" stroke-width="6" stroke-linecap="round"/>
    <path d="M34 54L47 26h26l13 28Z" fill="#ffe3a5" stroke="${outline}" stroke-width="3"/>
    <circle cx="60" cy="39" r="8" fill="${gold}"/>
  `;
  if(type==='bed')s=swap?`
    <polygon points="60,42 110,67 60,107 10,82" fill="${cream}" stroke="${outline}" stroke-width="3"/>
    <polygon points="60,52 96,70 60,98 24,80" fill="#f3b9ba"/>
    <polygon points="60,42 110,67 110,79 60,54" fill="#d99f7d"/>
    <path d="M15 82v21M105 68v21" stroke="${outline}" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="72" cy="61" rx="14" ry="8" fill="#fff7ef"/><ellipse cx="49" cy="57" rx="12" ry="7" fill="#f6d3dc"/>
  `:`
    <polygon points="60,39 102,60 60,111 18,90" fill="${cream}" stroke="${outline}" stroke-width="3"/>
    <polygon points="60,50 92,66 60,100 28,84" fill="#f3b9ba"/>
    <polygon points="60,39 102,60 102,72 60,51" fill="#d99f7d"/>
    <path d="M23 90v20M97 61v20" stroke="${outline}" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="73" cy="58" rx="13" ry="7" fill="#fff7ef"/><ellipse cx="53" cy="54" rx="11" ry="6" fill="#f6d3dc"/>
  `;
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><g${flip}>${s}</g></svg>`;
}

function renderFurniture(){
  layer.textContent='';
  for(const item of state.furniture){
    const meta=CATALOG[item.type];if(!meta)continue;
    const p=project(item),b=document.createElement('button');
    b.type='button';b.className='furniture'+(item.id===selectedId?' selected':'');b.dataset.id=item.id;
    b.setAttribute('aria-label',meta.label+'を選択');
    b.style.left=p.x+'%';b.style.top=p.y+'%';b.style.width=(meta.w*p.scale)+'%';
    b.style.zIndex=meta.kind==='low'?20:String(p.z);
    b.innerHTML=art(item.type,item.dir||0);
    installDrag(b,item);layer.appendChild(b);
  }
  renderStorage();syncControls();
}
function installDrag(el,item){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    select(item.id);
    const r=room.getBoundingClientRect();
    drag={id:item.id,x:e.clientX,y:e.clientY,u:item.u,v:item.v,w:r.width,h:r.height};
    el.setPointerCapture(e.pointerId);e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(!drag||drag.id!==item.id)return;
    const dx=(e.clientX-drag.x)/drag.w*100,dy=(e.clientY-drag.y)/drag.h*100;
    const A=dx/.40,B=dy/(200/760);
    item.u=clamp(drag.u+(A+B)/2,7,93);
    item.v=clamp(drag.v+(B-A)/2,7,93);
    const p=project(item);
    el.style.left=p.x+'%';el.style.top=p.y+'%';el.style.zIndex=CATALOG[item.type].kind==='low'?20:String(p.z);
    markDirty();
  });
  el.addEventListener('pointerup',()=>drag=null);
  el.addEventListener('pointercancel',()=>drag=null);
  el.addEventListener('click',()=>select(item.id));
}
function select(id){selectedId=id;renderFurniture();}
function selected(){return state.furniture.find(x=>x.id===selectedId)||null;}
function syncControls(){
  const item=selected(),on=!!item;rotateBtn.disabled=!on;storeBtn.disabled=!on;
  document.querySelectorAll('[data-nudge]').forEach(b=>b.disabled=!on);
  selectedName.textContent=on?CATALOG[item.type]?.label||'家具':'家具を選んでください';
}
function renderStorage(){
  const placed=new Set(state.furniture.map(x=>x.id)),stored=DEFAULTS.filter(x=>!placed.has(x.id));
  storageList.textContent='';
  if(!stored.length){const p=document.createElement('span');p.className='empty-storage';p.textContent='収納中の家具はありません';storageList.append(p);return;}
  for(const item of stored){
    const b=document.createElement('button');b.type='button';b.className='stored';b.textContent='＋ '+CATALOG[item.type].label;
    b.onclick=()=>{state.furniture.push({...item,u:50,v:50});selectedId=item.id;markDirty();renderFurniture();};
    storageList.append(b);
  }
}
function applyTheme(){
  room.className='room '+state.wall+' '+state.floor;
  document.querySelectorAll('[data-wall]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.wall===state.wall)));
  document.querySelectorAll('[data-floor]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.floor===state.floor)));
}
function hydratePet(){
  try{
    const source=parent.document.querySelector('#petVisual svg,.pet-visual svg,[data-pet-visual] svg');
    if(!source)return;
    const svg=source.cloneNode(true),shadow=svg.querySelector('.pet-shadow');
    if(shadow){let n=svg.firstChild;while(n&&n!==shadow){const next=n.nextSibling;n.remove();n=next;}}
    pet.querySelectorAll('svg,.pet-placeholder').forEach(n=>n.remove());
    pet.append(svg);
  }catch{}
}

rotateBtn.onclick=()=>{const item=selected();if(!item)return;item.dir=((item.dir||0)+1)%4;markDirty();renderFurniture();};
storeBtn.onclick=()=>{if(!selectedId)return;state.furniture=state.furniture.filter(x=>x.id!==selectedId);selectedId='';markDirty();renderFurniture();};
document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>{
  const item=selected();if(!item)return;const [du,dv]=b.dataset.nudge.split(',').map(Number);
  item.u=clamp(item.u+du,7,93);item.v=clamp(item.v+dv,7,93);markDirty();renderFurniture();
});
document.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{state.wall=b.dataset.wall;applyTheme();markDirty();});
document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{state.floor=b.dataset.floor;applyTheme();markDirty();});
document.getElementById('resetBtn').onclick=()=>{
  state={schemaVersion:3,wall:'wall-cream',floor:'floor-light',furniture:structuredClone(DEFAULTS)};
  selectedId='';applyTheme();renderFurniture();markDirty();toast('初期配置に戻しました');
};

function normalize(data){
  if(!data||![2,3].includes(Number(data.schemaVersion)))return {schemaVersion:3,wall:'wall-cream',floor:'floor-light',furniture:structuredClone(DEFAULTS)};
  const wall=['wall-cream','wall-blue','wall-green','wall-rose'].includes(data.wall)?data.wall:'wall-cream';
  const floor=['floor-light','floor-dark','floor-check'].includes(data.floor)?data.floor:'floor-light';
  const seen=new Set(),f=[];
  for(const raw of Array.isArray(data.furniture)?data.furniture:[]){
    if(!raw||seen.has(raw.id)||!CATALOG[raw.type])continue;
    seen.add(raw.id);
    f.push({id:String(raw.id).slice(0,40),type:raw.type,u:clamp(Number(raw.u)||50,7,93),v:clamp(Number(raw.v)||50,7,93),dir:Math.abs(Math.floor(Number(raw.dir)||0))%4});
  }
  return {schemaVersion:3,wall,floor,furniture:f};
}
async function load(u){
  statusEl.textContent='おへやを読み込み中…';
  try{
    const snap=await getDoc(roomRef(u));
    state=snap.exists()?normalize(snap.data()):{schemaVersion:3,wall:'wall-cream',floor:'floor-light',furniture:structuredClone(DEFAULTS)};
    dirty=false;saveBtn.disabled=false;
    statusEl.textContent=snap.exists()?'保存したおへやを読み込みました。':'まだ保存されていません。初期のおへやです。';
    applyTheme();renderFurniture();setTimeout(hydratePet,100);
  }catch(e){
    console.error(e);statusEl.textContent='おへやを読み込めませんでした。';saveBtn.disabled=true;
  }
}
saveBtn.onclick=async()=>{
  if(!user)return;saveBtn.disabled=true;statusEl.textContent='保存中…';
  try{
    await setDoc(roomRef(user),{
      schemaVersion:3,wall:state.wall,floor:state.floor,
      furniture:state.furniture.map(({id,type,u,v,dir})=>({id,type,u:Number(u.toFixed(2)),v:Number(v.toFixed(2)),dir})),
      updatedAt:serverTimestamp()
    });
    dirty=false;window.MonstudyMaterial?.setActivityGuard(()=>false);
    statusEl.textContent='保存しました。';toast('おへやを保存しました');
  }catch(e){
    console.error(e);statusEl.textContent='保存できませんでした。もう一度お試しください。';
  }finally{saveBtn.disabled=!user;}
};

/* pet wandering */
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const petMotion={u:53,v:50,fromU:53,fromV:50,toU:53,toV:50,start:0,duration:0,pauseUntil:0,lastX:50,running:true};

function obstacleRadius(item){
  const w=CATALOG[item.type]?.w||10;
  if(item.type==='rug')return 0;
  if(item.type==='bed'||item.type==='sofa'||item.type==='shelf')return 11;
  if(item.type==='table')return 9;
  return Math.max(6,w*.55);
}
function pointSegmentDistance(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,len=dx*dx+dy*dy;
  if(!len)return Math.hypot(px-ax,py-ay);
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/len,0,1);
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function pathClear(aU,aV,bU,bV){
  for(const item of state.furniture){
    const r=obstacleRadius(item);if(!r)continue;
    if(pointSegmentDistance(item.u,item.v,aU,aV,bU,bV)<r)return false;
  }
  return true;
}
function pickPetTarget(){
  for(let i=0;i<30;i++){
    const u=18+Math.random()*64,v=18+Math.random()*64;
    if(Math.hypot(u-petMotion.u,v-petMotion.v)<15)continue;
    if(pathClear(petMotion.u,petMotion.v,u,v))return {u,v};
  }
  return {u:clamp(petMotion.u+(Math.random()-.5)*18,18,82),v:clamp(petMotion.v+(Math.random()-.5)*18,18,82)};
}
function setPetVisual(u,v,walking=false,now=0){
  const p=project({u,v}),face=p.x>=petMotion.lastX?1:-1;
  petMotion.lastX=p.x;
  pet.style.left=p.x+'%';pet.style.top=p.y+'%';pet.style.zIndex=String(p.z+30);pet.style.setProperty('--pet-face',face);
  const bob=walking?Math.sin(now/110)*2.1:0;
  pet.style.transform=`translate(-50%,-80%) translateY(${bob}px) scale(${(.90+p.scale*.10).toFixed(3)})`;
}
function startPetLeg(now){
  const t=pickPetTarget();
  petMotion.fromU=petMotion.u;petMotion.fromV=petMotion.v;petMotion.toU=t.u;petMotion.toV=t.v;petMotion.start=now;
  const dist=Math.hypot(t.u-petMotion.u,t.v-petMotion.v);
  petMotion.duration=2200+dist*55;
}
function petLoop(now){
  if(!petMotion.running)return;
  if(reduceMotion.matches){setPetVisual(52,52,false,now);requestAnimationFrame(petLoop);return;}
  if(document.hidden){requestAnimationFrame(petLoop);return;}
  if(petMotion.pauseUntil){
    setPetVisual(petMotion.u,petMotion.v,false,now);
    if(now>=petMotion.pauseUntil){petMotion.pauseUntil=0;startPetLeg(now);}
    requestAnimationFrame(petLoop);return;
  }
  if(!petMotion.duration){startPetLeg(now);}
  const t=clamp((now-petMotion.start)/petMotion.duration,0,1);
  const eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  petMotion.u=petMotion.fromU+(petMotion.toU-petMotion.fromU)*eased;
  petMotion.v=petMotion.fromV+(petMotion.toV-petMotion.fromV)*eased;
  setPetVisual(petMotion.u,petMotion.v,true,now);
  if(t>=1){petMotion.u=petMotion.toU;petMotion.v=petMotion.toV;petMotion.duration=0;petMotion.pauseUntil=now+900+Math.random()*2600;}
  requestAnimationFrame(petLoop);
}
requestAnimationFrame(petLoop);

onAuthStateChanged(auth,u=>{
  user=u;
  if(!u){
    statusEl.textContent='ログインするとおへやを保存できます。';saveBtn.disabled=true;
    state={schemaVersion:3,wall:'wall-cream',floor:'floor-light',furniture:structuredClone(DEFAULTS)};
    applyTheme();renderFurniture();setTimeout(hydratePet,100);return;
  }
  void load(u);
});
applyTheme();renderFurniture();setTimeout(hydratePet,140);
</script>
