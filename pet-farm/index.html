<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dff2de">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>もんすたふぁーむ｜開発中プレビュー</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=13">
<style id="monstudy-access-lock">html:before{content:"ログインを確認しています…";position:fixed;inset:0;z-index:99999;display:grid;place-content:center;background:#edf6ed;color:#315f4d;font:16px system-ui}body{visibility:hidden!important}</style>
<script type="module" src="../access-gate.js?v=2.3.15"></script>
</head>
<body>
<div id="previewGate" role="status" aria-live="polite">管理者確認中…</div>
<div class="game-shell">
 <main class="farm-stage" aria-label="もんすたふぁーむ">
  <div class="viewport" id="viewport" tabindex="0" aria-label="画面をドラッグして見渡せる農園">
   <div id="sceneSize"><div id="world">
    <div id="scenery" aria-hidden="true"></div>
    <div id="roadsLayer" aria-label="配置した道路"></div>
    <div id="plotLayer"></div>
    <div id="placementLayer" hidden aria-label="農園の配置マスを選択"></div>
    <button id="house" class="building-hit home-hit" type="button" aria-label="ペットのおうち。おへやモードは準備中"></button>
    <button id="shopBuilding" class="building-hit shop-hit" type="button" aria-label="ショップへ行く"></button>
    <div id="petWalker" aria-label="あなたのペット"><span>🥚</span></div>
    <div id="effect" aria-hidden="true"></div>
   </div></div>
  </div>
  <header class="game-hud">
   <div class="hud-title"><span class="sprig" aria-hidden="true">🌱</span><span>もんすたふぁーむ</span></div>
   <div class="hud-actions">
    <div class="coin-chip">🪙 <strong id="coins">—</strong> C</div>
    <button id="itemsBtn" class="hud-btn" type="button">🎒 アイテム</button>
    <button id="saveBtn" class="hud-btn" type="button" disabled>💾 保存</button>
    <a class="hud-btn hud-home" href="../index.html">← もんすたでぃに戻る</a>
   </div>
  </header>
  <div class="game-status" id="status" role="status" aria-live="polite">ログインと農園データを確認しています…</div>
  <div class="game-tools">
   <button id="homeBtn" type="button" title="おうちに移動">🏡 おうち</button>
   <button id="centerBtn" type="button" title="第1農園に移動">🌱 畑</button>
   <button id="zoomOut" type="button" aria-label="縮小">−</button>
   <span id="zoomLabel">100%</span>
   <button id="zoomIn" type="button" aria-label="拡大">＋</button>
  </div>
  <div class="farm-hint">ショップで圃場・道路を手に入れて、好きな場所に配置しよう</div>
  <div class="placement-bar" id="placementBar" hidden>
   <span id="placementHint">配置する場所をタップしてください</span>
   <button type="button" id="placementCancel">配置を終了</button>
  </div>
 </main>
</div>
 <dialog id="actionDialog" class="farm-dialog" aria-labelledby="selectionTitle">
   <div class="modal-head"><div><div class="panel-kicker">FARM ACTION</div><h2 id="selectionTitle">畑を選んでください</h2></div><button type="button" class="modal-close" data-close-dialog="actionDialog" aria-label="閉じる">✕</button></div>
   <div id="selectionDetail" class="subtext"></div><div id="actionControls"></div>
 </dialog>
 <dialog id="shopDialog" class="farm-dialog" aria-labelledby="shopTitle">
  <div class="modal-head"><div><div class="panel-kicker">FARM SHOP</div><h2 id="shopTitle">🏪 タネと道具のおみせ</h2></div><button type="button" class="modal-close" data-close-dialog="shopDialog" aria-label="閉じる">✕</button></div>
  <p class="subtext">欲しいものをタップして、購入を確定しよう。<strong>🪙 <span id="shopBalance">—</span>C</strong></p>
  <div class="shop-tabs"><button type="button" class="tab active" data-shop="field">圃場</button><button type="button" class="tab" data-shop="road">道路</button><button type="button" class="tab" data-shop="seed">タネ</button><button type="button" class="tab" data-shop="supply">水・肥料</button></div>
  <div id="shopList" class="shop-list"></div><div id="shopConfirmation" class="modal-confirm"></div>
 </dialog>
 <dialog id="itemsDialog" class="farm-dialog" aria-labelledby="itemsTitle">
  <div class="modal-head"><div><div class="panel-kicker">MY ITEMS</div><h2 id="itemsTitle">🎒 アイテム</h2></div><button type="button" class="modal-close" data-close-dialog="itemsDialog" aria-label="閉じる">✕</button></div>
  <div id="inventory" class="inventory"></div><div id="storageConfirmation" class="modal-confirm"></div>
  <p class="tiny">圃場・道路はここから配置できます。作物は将来メインページのFEEDで使える予定です。</p>
 </dialog>
 <dialog id="manageDialog" class="farm-dialog" aria-labelledby="manageTitle">
  <div class="modal-head"><div><div class="panel-kicker">FIELD SETTINGS</div><h2 id="manageTitle">圃場の管理</h2></div><button type="button" class="modal-close" data-close-dialog="manageDialog" aria-label="閉じる">✕</button></div>
  <div id="manageControls"></div>
 </dialog>
 <dialog id="fieldNameDialog" class="farm-dialog" aria-labelledby="fieldNameTitle">
  <div class="modal-head"><div><div class="panel-kicker">NAME YOUR FIELD</div><h2 id="fieldNameTitle">圃場の名前をつける</h2></div><button type="button" class="modal-close" data-close-dialog="fieldNameDialog" aria-label="閉じる">✕</button></div>
  <label for="fieldNameInput" class="field-name-label">圃場の名前（16文字以内）</label>
  <input id="fieldNameInput" type="text" maxlength="16" placeholder="例：わたしの畑" autocomplete="off">
  <div class="modal-actions"><button id="confirmFieldName" class="action-btn gold" type="button">決定する</button><button class="action-btn secondary" type="button" data-close-dialog="fieldNameDialog">やめる</button></div>
 </dialog>
 </div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
/* Independent watchdog: a failed module import would otherwise leave the static
   "管理者確認中…" overlay on screen forever, before app.js could run. */
(function(){
 const gate=document.getElementById('previewGate');
 if(!gate)return;
 function recovery(message){
  if(gate.hidden||gate.querySelector('.preview-gate-actions'))return;
  gate.replaceChildren();
  const label=document.createElement('div');
  label.className='preview-gate-label';
  label.textContent=message;
  const actions=document.createElement('div');
  actions.className='preview-gate-actions';
  const retry=document.createElement('button');
  retry.type='button';retry.className='preview-retry';
  retry.textContent='もう一度読み込む';
  retry.addEventListener('click',()=>location.reload());
  const home=document.createElement('a');
  home.className='preview-back';home.href='../index.html';
  home.textContent='もんすたでぃへ戻る';
  actions.append(retry,home);gate.append(label,actions);
 }
 window.addEventListener('error',event=>{
  if(gate.hidden)return;
  const isModule=event.target?.tagName==='SCRIPT';
  const description=event.message||'通信エラーが発生しました。';
  if(isModule||event.error)recovery('農園の読み込みに失敗しました。'+(isModule?'更新して再試行してください。':description));
 },true);
 window.addEventListener('unhandledrejection',event=>{
  if(!gate.hidden)recovery('農園の読み込みに失敗しました。'+(event.reason?.message||'再試行してください。'));
 });
 setTimeout(()=>recovery('読み込みに時間がかかっています。再試行するか、もんすたでぃへ戻ってください。'),16000);
})();
</script>
<script type="module" src="./app.js?v=15"></script>
</body>
</html>
