<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>パスワードの再設定｜もんすたでぃ</title>
<style>
:root{--ink:#193d38;--green:#246a57;--muted:#6d7c75;--line:#dce5da;--error:#9b453b;--ok:#2f6f50}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f5ef;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:18px}main{width:min(480px,100%)}section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 12px 36px #193d3810}h1{font-size:24px;margin:0 0 8px}.note{color:var(--muted);font-size:13px;margin:0 0 18px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800}.field input{width:100%;border:1px solid #cbd8cf;border-radius:11px;padding:11px 12px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:12px;background:var(--green);color:white;font:inherit;font-weight:850;cursor:pointer}.btn:disabled{opacity:.5}.status{min-height:1.5em;margin:12px 0;color:var(--error);font-size:12px}.status.ok{color:var(--ok)}a{color:#55786d}.hidden{display:none}
</style>
</head>
<body>
<main><section>
<div class="note">もんすたでぃ</div>
<h1>新しいパスワードを設定</h1>
<p class="note">管理者によるリセット後のため、利用を続ける前にご自身の新しいパスワードを設定してください。6文字以上で、仮パスワードとは異なるものにしてください。</p>
<form id="form">
<div class="field"><label for="password">新しいパスワード</label><input id="password" type="password" autocomplete="new-password" minlength="6" required></div>
<div class="field"><label for="confirm">新しいパスワード（確認）</label><input id="confirm" type="password" autocomplete="new-password" minlength="6" required></div>
<button id="submit" class="btn" type="submit">新しいパスワードを保存</button>
</form>
<div id="status" class="status" role="status" aria-live="polite"></div>
<a id="login" href="./login.html" class="hidden">ログイン画面へ戻る</a>
</section></main>
<script type="module" src="./password-reset-required.js?v=1.0.1"></script>
</body>
</html>
