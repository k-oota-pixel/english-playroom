<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f7ed"><meta name="robots" content="noindex,nofollow,noarchive">
<script src="../shell-bridge.js?v=2.3.41"></script><link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>ポテトマンを収穫せよ | もんすたでぃ</title>
<style>
:root{color-scheme:light;--ink:#243b30;--muted:#68796b;--line:#d9e3d3}
*{box-sizing:border-box}body{margin:0;background:#f4f7ed;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,a{font:inherit}
.app{width:min(100%,1050px);margin:auto;padding:14px 16px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:10px;font-weight:950;letter-spacing:.12em;color:#64816b}.back{border:1px solid #d8e2d3;background:#fff;border-radius:999px;padding:8px 12px;color:#45654d;text-decoration:none;font-size:11px;font-weight:850}
.hero{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:14px 0 12px}.eyebrow{font-size:9px;letter-spacing:.17em;font-weight:950;color:#758b69}h1{margin:2px 0 5px;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:-.04em}.lead{margin:0;color:#657267;font-size:12px;line-height:1.6}.pill{flex:none;border-radius:999px;padding:8px 12px;background:#e1efd8;color:#426440;font-size:10px;font-weight:900}
.panel{border:1px solid var(--line);background:#fffdf8;border-radius:20px;box-shadow:0 8px 26px #2b4e2c12;padding:16px}.setup{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section-title{margin:0 0 9px;font-size:13px;font-weight:950}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pick,.level{border:1px solid #d7e2d4;border-radius:13px;background:#fff;color:#344b38;text-align:left;padding:10px 11px;font-size:12px;font-weight:850;cursor:pointer}.pick small,.level small{display:block;color:#829084;font-size:9px;font-weight:700;margin-top:4px;line-height:1.4}.pick[aria-pressed=true]{background:#edf7e9;border:2px solid #72a85e;padding:9px 10px}.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.level[aria-pressed=true]{border:2px solid #e5b82a;background:#fff9df;padding:9px 10px}.level strong{display:block;font-size:12px}
.start-row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #e7ecdf;padding-top:14px}.hint{font-size:10px;color:#718071;line-height:1.5}.primary,.secondary,.choice,.answer-next{border:0;border-radius:12px;cursor:pointer;font-weight:900}.primary{background:#397b3d;color:#fff;padding:12px 18px;box-shadow:0 4px 0 #23592f}.primary:disabled{opacity:.5;cursor:not-allowed}.game{display:none}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:8px 11px}.stat span{display:block;font-size:8px;letter-spacing:.1em;color:#879184;font-weight:900}.stat strong{display:block;margin-top:3px;font-size:17px}
.scene{border:6px solid #fff;border-radius:19px;overflow:hidden;background:#dbefd3;box-shadow:0 5px 20px #32552b15}.scene svg{display:block;width:100%;height:auto}.field-crops{transition:opacity .25s ease}.grow{animation:pop .55s ease}@keyframes pop{0%{opacity:.45;transform:scale(.98);transform-origin:center}100%{opacity:1;transform:scale(1);transform-origin:center}}
.gamebar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:11px 0;color:#5f725d;font-size:10px;font-weight:850}.gamebar button{border:1px solid #d4dfd0;background:#fff;border-radius:999px;padding:7px 10px;color:#526c53;cursor:pointer;font-size:10px;font-weight:850}.question{margin-top:10px}.question-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.question-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,29%);align-items:center;gap:14px;min-height:76px}.question-copy{min-width:0}.tag{border-radius:999px;background:#eef4e9;color:#657d60;padding:5px 8px;font-size:9px;font-weight:900}.timer{font-weight:1000;font-size:13px;color:#cb513d}.jp{font-size:clamp(15px,3vw,19px);font-weight:850;margin:10px 0 4px}.en{font:700 clamp(17px,3.3vw,22px)/1.45 Georgia,serif;color:#243d2e;overflow-wrap:anywhere}.options{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:13px 0 3px}.choice{min-height:43px;border:1px solid #d4dfd0;background:#fff;color:#354c39;font-size:12px;padding:8px 4px}.choice:hover:not(:disabled){border-color:#8bab7d;background:#f4faef}.choice:disabled{cursor:default;opacity:.8}.choice.correct{background:#e1f4dc;border-color:#6ea55c;color:#245c2d}.choice.wrong{background:#ffebe7;border-color:#d77e6b;color:#953c30}
.feedback{display:none;align-self:center;padding:12px 14px;border-radius:13px;background:#eff7e9;color:#2f6136;font-size:12px;line-height:1.5;min-width:0}.feedback.good,.feedback.bad{display:flex;flex-direction:column;gap:3px}.feedback.bad{background:#fff0e9;color:#8e4738}.feedback-label{font-size:10px;font-weight:850;opacity:.75}.feedback strong{font-size:19px}.feedback-answer{font-weight:700;overflow-wrap:anywhere}.result{display:none;margin-top:12px;border-radius:16px;padding:14px;background:#f3f7eb;border:1px solid #dae7ce}.result h2{margin:0 0 5px;font-size:20px}.result p{margin:0;color:#627261;font-size:12px;line-height:1.5}.result-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.secondary{background:#fff;border:1px solid #d4dfd0;color:#49614d;padding:10px 14px}
@media(max-width:650px){.app{padding:10px 10px 22px}.hero{align-items:start;flex-direction:column;gap:7px}.setup{grid-template-columns:1fr;gap:14px}.start-row{grid-column:auto;align-items:start;flex-direction:column}.hud{grid-template-columns:repeat(2,minmax(0,1fr))}.options{grid-template-columns:repeat(3,minmax(0,1fr))}.question-body{grid-template-columns:minmax(0,1fr) minmax(105px,32%);gap:8px}.feedback{padding:8px}.feedback strong{font-size:15px}.feedback-answer{font-size:11px}.panel{padding:12px}.scene{border-width:4px}}@media(max-width:380px){.question-body{grid-template-columns:1fr;gap:6px}.feedback.good,.feedback.bad{max-width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand">MONSTUDY · FARM QUEST</div><a class="back" href="../">← もんすたでぃに戻る</a></header>
<section class="hero"><div><div class="eyebrow">ENGLISH GRAMMAR GAME</div><h1>ポテトマンを収穫せよ</h1><p class="lead">文法問題に答えて畑を育てよう。正解を重ねると収穫が進み、ミスが続くとポテトマンが逃げてしまいます。</p></div><div class="pill">4分野 · 473問</div></section>
<section id="setup" class="panel setup"><div><h2 class="section-title">1. 文法分野を選ぶ</h2><div id="groupChoices" class="choice-grid"></div></div><div><h2 class="section-title">2. 難易度を選ぶ</h2><div id="levelChoices" class="levels"></div></div><div class="start-row"><div class="hint">正解すると作物が育ちます。英文と日本語訳を見ながら、空所に入る形を選んでください。<br>クリアすると1コイン獲得。</div><button id="startBtn" class="primary" type="button" disabled>畑に入る</button></div></section>
<section id="game" class="panel game" aria-label="ゲーム">
<div class="hud"><div class="stat"><span>収穫まで</span><strong id="score">0 / 21</strong></div><div class="stat"><span>ミス</span><strong id="misses">0 / 6</strong></div><div class="stat"><span>分野</span><strong id="groupLabel">—</strong></div><div class="stat"><span>難易度</span><strong id="levelLabel">—</strong></div></div>
<div class="scene" role="img" aria-label="育っていく畑"><svg viewBox="0 0 840 360" xmlns="http://www.w3.org/2000/svg" aria-labelledby="fieldTitle">
<title id="fieldTitle">ポテトマンの畑</title><rect width="840" height="360" fill="#dff2f4"/><circle cx="712" cy="58" r="24" fill="#ffd951"/>
<path d="M0 137 Q120 73 264 130 T530 121 T840 125 V211 H0Z" fill="#9bc43e"/><path d="M0 149 Q115 71 277 143 Q180 111 108 180 H0Z" fill="#00964d"/><path d="M352 142 Q514 43 622 126 Q551 99 493 183Z" fill="#7fb540"/><path d="M0 159 Q132 124 255 158 T482 156 T840 152 V222 H0Z" fill="#299d43"/><path d="M0 179 Q120 153 233 185 T464 180 T840 177" fill="none" stroke="#fffdf3" stroke-width="8"/><rect y="199" width="840" height="18" fill="#f4c02e"/>
<path d="M0 217 H840 V235 Q628 217 416 236 Q203 251 0 237Z" fill="#f4be81"/><path d="M0 237 Q225 218 450 239 T840 238 V360 H0Z" fill="#eab478"/><path d="M604 237 H840 V360 H730 Q690 294 604 237Z" fill="#9fdde1"/><path d="M0 237 Q26 241 32 272 V360 H0Z" fill="#259a47"/><path d="M98 249 Q265 236 434 250 T710 247 L781 349 Q574 329 383 347 T129 349Z" fill="#f5c28d" stroke="#fffdf4" stroke-width="8"/><g id="cropLayer"></g><g opacity=".35"><path d="M112 245 L142 351 M268 243 L300 350 M425 244 L455 350 M585 244 L615 350" stroke="#fff9e9" stroke-width="3"/></g></svg></div>
<div class="gamebar"><span id="stageLabel">畑の準備</span><span id="clock" class="timer"></span><button id="quitBtn" type="button">メニューに戻る</button></div>
<div id="questionCard" class="question"><div class="question-top"><span id="questionCount" class="tag">問題 1</span><span id="timerWrap" hidden>回答時間 <b id="timer">5</b> 秒</span></div><div class="question-body"><div class="question-copy"><div id="japanese" class="jp"></div><div id="english" class="en"></div></div><div id="feedback" class="feedback" aria-live="polite" aria-atomic="true"></div></div><div id="options" class="options"></div></div>
<div id="result" class="result" aria-live="polite"><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-actions"><button id="againBtn" class="primary" type="button">もう一度遊ぶ</button><button id="menuBtn" class="secondary" type="button">分野・難易度を選び直す</button></div></div></section></main>
<script type="module">
import {QUESTION_GROUPS} from './questions.js?v=2.3.41';
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from '../auth-session.js?v=2.4.37';
import {getFirestore,doc,updateDoc,increment,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {enableAppCheck} from '../firebase-security.js?v=2.1.9';
const cfg={apiKey:'AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ',authDomain:'eiken-retry.firebaseapp.com',storageBucket:'eiken-retry.firebasestorage.app',messagingSenderId:'231308672297',appId:'1:231308672297:web:5e8b8ede3a0246c2318b38',projectId:'eiken-retry'};
const app=getApps().length?getApp():initializeApp(cfg);enableAppCheck(app);const auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let player=null,selectedGroup=null,selectedLevel='easy',run=null,timerId=null,lastAnswerAt=0,locked=false,order=[],at=0,current=null,awardClaimed=false;
const LEVELS=[
{id:'easy',name:'EASY',detail:'21問正解 · 5回までミスOK',milestones:[3,6,9,12,15,18,21],missLimit:5,seconds:0},
{id:'normal',name:'NORMAL',detail:'35問正解 · 3回までミスOK',milestones:[5,10,15,20,25,30,35],missLimit:3,seconds:0},
{id:'hard',name:'HARD',detail:'65問正解 · 1回のミスで終了',milestones:[5,15,25,35,45,55,65],missLimit:0,seconds:0},
{id:'hell',name:'EX-HARD',detail:'65問正解 · 1ミス・各問5秒',milestones:[5,15,25,35,45,55,65],missLimit:0,seconds:5}
];
function shuffled(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'" :'&#39;'}[ch]))}
function renderSetup(){const g=$('groupChoices');g.replaceChildren();QUESTION_GROUPS.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='pick';b.setAttribute('aria-pressed',String(selectedGroup===item.id));b.innerHTML=esc(item.title)+'<small>'+item.questions.length+'問 · ランダム出題</small>';b.onclick=()=>{selectedGroup=item.id;renderSetup();$('startBtn').disabled=!selectedGroup};g.append(b)});
const l=$('levelChoices');l.replaceChildren();LEVELS.forEach(level=>{const b=document.createElement('button');b.type='button';b.className='level';b.setAttribute('aria-pressed',String(selectedLevel===level.id));b.innerHTML='<strong>'+level.name+'</strong><small>'+esc(level.detail)+'</small>';b.onclick=()=>{selectedLevel=level.id;renderSetup()};l.append(b)})}
function plant(x,y,stage){const h=stage===1?12:stage===2?23:stage===3?24:17,leaf=stage===4?'#899749':'#43a83f',stem=stage===4?'#8f8951':'#547d37';let p='<g transform="translate('+x+' '+y+')"><path d="M0 0 Q-1 -'+(h*.55)+' 0 -'+h+'" stroke="'+stem+'" stroke-width="3" fill="none"/>';if(stage<4){p+='<path d="M0 -'+(h*.55)+' q-12 -12 -17 -2 q6 9 17 7 M0 -'+(h*.62)+' q12 -13 18 -4 q-6 10 -18 9 M0 -'+(h*.9)+' q-9 -10 -13 -3 q5 8 13 7 M0 -'+(h*.95)+' q9 -10 14 -3 q-4 7 -14 6" fill="'+leaf+'"/>';if(stage===3)p+='<g fill="#fff7e4" stroke="#e6b24a" stroke-width="1"><circle cx="-5" cy="-'+(h+1)+'" r="3"/><circle cx="4" cy="-'+(h+3)+'" r="3"/><circle cx="0" cy="-'+(h+7)+'" r="3"/></g>'}else p+='<path d="M0 -9 q-11 -11 -15 -4 q4 8 14 7 M0 -10 q10 -11 15 -4 q-5 8 -15 7" fill="'+leaf+'"/>';return p+'<ellipse cx="0" cy="2" rx="6" ry="2.5" fill="#d0a371"/></g>'}
function potato(x,y){return '<g transform="translate('+x+' '+y+') scale(.58)"><ellipse cx="0" cy="-18" rx="17" ry="23" fill="#f1dfa7" stroke="#755f38" stroke-width="2"/><circle cx="-5" cy="-22" r="1.6" fill="#473b2a"/><circle cx="5" cy="-22" r="1.6" fill="#473b2a"/><path d="M-5 -15 Q0 -10 5 -15 M-16 -8 Q-25 -15 -22 -22 M16 -8 Q24 -17 22 -23 M-8 4 l-5 8 m13 -8 5 8" fill="none" stroke="#755f38" stroke-width="2.5" stroke-linecap="round"/></g>'}
function drawField(stage){const parts=[],spots=[];for(let r=0;r<4;r++)for(let c=0;c<8;c++)spots.push([145+c*76+(r%2)*4,265+r*21]);spots.forEach((pt,i)=>{const x=pt[0],y=pt[1];if(!stage)return;if(stage<5){if(!(stage===4&&i%3===0))parts.push(plant(x,y,stage))}else if(stage===5?i%3===0:stage===6?i%2===0:true)parts.push(potato(x,y));else parts.push(plant(x,y,4))});if(stage>=5)parts.push('<text x="690" y="232" font-size="39">🚜</text>');if(stage===7)for(let i=0;i<5;i++)parts.push('<text x="'+(140+i*76)+'" y="235" font-size="15">✨</text>');const el=$('cropLayer');el.innerHTML=parts.join('');el.classList.remove('grow');void el.getBoundingClientRect();el.classList.add('grow');$('stageLabel').textContent=['畑の準備','芽が出た！','葉が広がる！','花が咲いた！','収穫どき！','収穫開始！','あと少し！','収穫完了！'][stage]}
function stageFor(score){let n=0;run.level.milestones.forEach((v,i)=>{if(score>=v)n=i+1});return Math.min(7,n)}
function clearTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function clearFeedback(){const el=$('feedback');el.className='feedback';el.replaceChildren()}
function showFeedback(good,timeout,correctAnswer){clearFeedback();const el=$('feedback');el.className='feedback '+(good?'good':'bad');const label=document.createElement('span'),heading=document.createElement('strong'),detail=document.createElement('span');label.className='feedback-label';label.textContent='直前の解答';heading.textContent=good?'✓ 正解！':timeout?'⌛ 時間切れ！':'✕ 不正解';detail.className='feedback-answer';detail.textContent=good?String(correctAnswer):'正解：'+String(correctAnswer);el.append(label,heading,detail)}
function begin(){const group=QUESTION_GROUPS.find(g=>g.id===selectedGroup),level=LEVELS.find(l=>l.id===selectedLevel);if(!group||!level)return;run={group,level,correct:0,misses:0};order=shuffled(group.questions.map((_,i)=>i));at=0;awardClaimed=false;lastAnswerAt=0;locked=false;clearFeedback();$('setup').style.display='none';$('game').style.display='block';$('result').style.display='none';$('questionCard').style.display='block';$('timerWrap').hidden=!level.seconds;drawField(0);showQuestion();updateHud()}
function updateHud(){if(!run)return;$('score').textContent=run.correct+' / '+run.level.milestones[run.level.milestones.length-1];$('misses').textContent=run.misses+' / '+(run.level.missLimit+1);$('groupLabel').textContent=run.group.title;$('levelLabel').textContent=run.level.name}
function showQuestion(){clearTimer();locked=false;if(at>=order.length){order=shuffled(run.group.questions.map((_,i)=>i));at=0}current=run.group.questions[order[at++]];$('questionCount').textContent='問題 '+(run.correct+run.misses+1);$('japanese').textContent=current.japanese;$('english').textContent=current.english;$('options').replaceChildren();$('clock').textContent='';run.group.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=ch.text;b.dataset.choice=String(ch.id);b.onclick=()=>answer(ch.id);$('options').append(b)});if(run.level.seconds){let left=run.level.seconds;$('timer').textContent=left;$('clock').textContent='⏱ '+left+'秒';timerId=setInterval(()=>{left--;if(left<=0){$('clock').textContent='⏱ 0秒';clearTimer();answer(null,true)}else{$('timer').textContent=left;$('clock').textContent='⏱ '+left+'秒'}},1000)}}
function answer(id,timeout=false){if(locked||!run||(!timeout&&Date.now()-lastAnswerAt<220))return;locked=true;clearTimer();const answered=current;const good=!timeout&&Number(id)===Number(answered.correctId);lastAnswerAt=Date.now();if(good){run.correct++;drawField(stageFor(run.correct))}else{run.misses++}updateHud();if(run.correct>=run.level.milestones[run.level.milestones.length-1]){finish(true);return}if(run.misses>run.level.missLimit){finish(false);return}showQuestion();showFeedback(good,timeout,answered.answer)}
async function awardCoin(){if(awardClaimed||!player)return false;awardClaimed=true;await updateDoc(doc(db,'users',player.uid,'apps','english-playroom'),{coins:increment(1),potatoHarvestLastPlayedAt:serverTimestamp()});return true}
async function finish(won){clearTimer();clearFeedback();locked=true;$('questionCard').style.display='none';$('result').style.display='block';if(won){$('resultTitle').textContent='収穫完了！';let coin=false;try{coin=await awardCoin()}catch(e){console.error('Potato harvest coin award failed',e)}$('resultText').textContent=coin?'畑いっぱいのポテトマンを収穫しました。クリア報酬として1コインを獲得！':'畑いっぱいのポテトマンを収穫しました。'}else{$('resultTitle').textContent='ポテトマンが逃げた！';$('resultText').textContent=run.correct+'問正解。最後の問題：'+current.japanese+' / '+current.english+' 正解：'+current.answer+'。もう一度挑戦しよう。'}updateHud();$('againBtn').onclick=begin;$('menuBtn').onclick=menu}
function menu(){clearTimer();clearFeedback();run=null;$('game').style.display='none';$('setup').style.display='grid';$('result').style.display='none';renderSetup();$('startBtn').disabled=!selectedGroup}
$('startBtn').onclick=begin;$('quitBtn').onclick=()=>{if(confirm('プレイを終了して分野選択に戻りますか？'))menu()};
$('againBtn').onclick=begin;$('menuBtn').onclick=menu;
onAuthStateChanged(auth,u=>{player=u||null});
renderSetup();
</script></body></html>
