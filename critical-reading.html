<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>もんすたでぃ | Critical Reading Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2b;color:#eaf4f5;font:16px system-ui,sans-serif;line-height:1.6}main{max-width:760px;margin:auto;padding:24px 16px}small{color:#91c9ca;letter-spacing:.12em}h1{font-size:clamp(26px,5vw,40px);line-height:1.2;margin:8px 0}h2{font-size:20px}p{margin:12px 0}.panel{background:#192b3d;border:1px solid #365063;border-radius:20px;padding:22px;margin-top:20px}button,select{font:inherit;color:inherit;border:1px solid #587887;background:#233e50;border-radius:12px;padding:12px 16px;cursor:pointer}button:hover{background:#31596a}button:focus-visible,select:focus-visible{outline:3px solid #f3c66b}button:disabled{cursor:default;opacity:.85}.primary{background:#187e79;border-color:#52c9b1;font-weight:bold}#options button{display:block;width:100%;text-align:left;margin:10px 0}.good{background:#185d48!important;border-color:#70e1ad!important}.bad{background:#74394a!important;border-color:#f5a1a1!important}.passage{font-size:21px;white-space:pre-line;background:#102031;padding:18px;border-radius:12px}.line{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}progress{width:100%;accent-color:#67dbc3;height:12px}#feedback{border-top:1px solid #365063;margin-top:18px;padding-top:12px} .muted{color:#a9c0ce;font-size:14px} label{display:block;margin:12px 0}select{width:100%}[hidden]{display:none!important}</style></head><body><main><small>MONSTUDY / THINK IN ENGLISH</small><h1>Critical Reading Lab</h1><p>英語で読む。根拠を考える。自分で判断する。</p><section id="home" class="panel"><h2>批判的読解トレーニング</h2><p>英検4級程度の英文・6つの方略・全12問の試作教材</p><label>練習する方略<select id="category"><option value="all">全方略ミックス</option></select></label><label>学習モード<select id="mode"><option value="guided">方略を確認して読む</option><option value="mixed">方略を伏せて読む</option></select></label><label>時間設定<select id="duration"><option value="30">30秒</option><option value="20">20秒</option><option value="40">40秒</option><option value="0">時間制限なし</option></select></label><button class="primary" id="start">トレーニング開始</button><p class="muted">試作版：コイン・ログイン・サーバーへの学習記録なし。⑤の方略名は暫定です。</p></section><section class="panel" id="game" hidden><div style="margin-bottom:12px"><button id="back" style="padding:6px 12px;font-size:14px">← 設定に戻る</button></div><div class="line"><span id="count"></span><strong id="clock" role="timer"></strong></div><progress id="progress"></progress><p id="hint" class="muted"></p><div id="passage" class="passage" lang="en"></div><h2 id="question" lang="en"></h2><div id="options"></div><div id="feedback" hidden aria-live="polite"><h2 id="result"></h2><p id="translation"></p><p id="explanation"></p><p id="strategy"></p><button class="primary" id="next">次の問題</button></div></section><section id="end" class="panel" hidden><h2>トレーニング完了</h2><h1 id="score"></h1><div id="stats"></div><p class="muted">方略別の正答数は今回の練習結果であり、読解能力の診断値ではありません。</p><button id="again" class="primary">もう一度</button></section></main><script>
const data=[[0,"Tom walks to school to stay healthy. Lisa walks to school to save money.","What do they agree on?",["Walking to school is a good idea.","Walking saves money.","Walking helps their health."],0,"トムは健康のため、リサは節約のために歩いて登校します。","理由は違っても、歩いて登校することは共通しています。"],[0,"Ken likes the library because it is quiet. Mei likes it because it has many books.","What is true for both?",["They like quiet rooms.","They like the library.","They like many books."],1,"ケンは静かだから、メイは本が多いから図書館が好きです。","理由と共通する評価を分けましょう。"],[1,"A: School should start at eight. B: School should start at nine.","What do they disagree on?",["Where to study.","How long to study.","When school should start."],2,"Aは8時、Bは9時に学校が始まるべきだと言います。","対立している点は始業時刻です。"],[1,"A: We need more trees in the park. B: We need more places to play soccer there.","What is different?",["Their ideas about how to use the park.","The name of the park.","The day they go there."],0,"Aは公園に木を増やしたい、Bはサッカーをする場所を増やしたいと言います。","同じ公園について、望む使い方が違います。"],[2,"A: Ten students came. B: Only ten students came.","What does 'only' tell us?",["The number is different.","The writer makes ten sound small.","The students came late."],1,"A：10人の生徒が来ました。B：たった10人の生徒しか来ませんでした。","only は同じ数字を少なく感じさせます。"],[2,"A: The bag costs 1,000 yen. B: The bag costs just 1,000 yen.","How does B make the price sound?",["Very high.","Unknown.","Low."],2,"A：バッグは1000円です。B：バッグはたった1000円です。","just によって安いという印象が加わります。"],[3,"A bike shop says, 'Our bikes are the best.'","What should you check?",["What other people say about the bikes.","The shop's name.","The color of the shop."],0,"自転車屋が「うちの自転車が一番です」と言います。","売り手には商品をよく見せる理由があります。第三者の評価も確認しましょう。"],[3,"A message says, 'There is no school tomorrow.' You do not know who wrote it.","What should you do first?",["Tell all your friends.","Check the school's website.","Stay home tomorrow."],1,"誰が書いたか分からないメッセージに「明日は学校がありません」とあります。","公式の情報源を確認しましょう。"],[4,"Tom has two cats. Both like fish. He thinks all cats like fish.","What is the problem?",["Tom has no cats.","Fish are always bad for cats.","Two cats cannot tell us about all cats."],2,"トムの猫2匹は魚が好きです。彼はすべての猫が魚好きだと思います。","少数の例だけで全体を判断できません。"],[4,"Ken got a new pen. The next day, he did well on a test. He thinks the pen helped him.","What else may have helped him?",["He studied hard.","The pen was new.","The test was on the next day."],0,"ケンは新しいペンを手に入れ、翌日のテストでよい成績を取りました。ペンのおかげだと思っています。","時間的な前後関係だけで原因を決めず、別の原因を考えましょう。"],[5,"You think all homework is good. A friend says he is too tired to study after doing a lot of homework.","What should you do?",["Stop listening to him.","Think again about your idea.","Say all homework is bad."],1,"あなたは宿題はすべてよいと思っています。友達は宿題が多すぎて疲れて勉強できないと言います。","自分の考えと異なる情報を受け止め、条件によって見直しましょう。"],[5,"You think buses are always better than cars. You read that some towns have no buses at night.","What should you think about?",["Cars are always bad.","The writer must be wrong.","When buses are a good choice."],2,"あなたはバスが車より常によいと思います。夜にバスがない町もあると読みました。","自分の意見を新しい情報と照らし合わせ、成り立つ条件を考えましょう。"]], names=['共通点で整理','対立点に注目','表現形式に注目','出所情報利用','論証を吟味する（暫定）','自分の意見を基準に'], tips=['同じ主張や特徴を探そう。','何について意見が違うのか探そう。','言葉によって印象が変わらないか考えよう。','誰が何のために発信したか考えよう。','根拠から結論が言えるか考えよう。','自分の考えを新しい情報と照らし合わせよう。'];
const $=id=>document.getElementById(id);names.forEach((n,i)=>$('category').add(new Option(n,i)));let queue=[],i=0,score=0,stats=[],timer,done=false,limit=30,deadline;function shuffle(a){a=[...a];for(let j=a.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[a[j],a[k]]=[a[k],a[j]]}return a}
function show(id){['home','game','end'].forEach(x=>$(x).hidden=x!==id)}
$('start').onclick=()=>{queue=shuffle(data.filter(q=>$('category').value==='all'||q[0]===Number($('category').value)));i=0;score=0;stats=names.map(()=>[0,0]);limit=Number($('duration').value);show('game');render()};
function render(){clearInterval(timer);done=false;let q=queue[i];$('count').textContent=(i+1)+' / '+queue.length;$('progress').max=queue.length;$('progress').value=i;$('hint').textContent=$('mode').value==='guided'?names[q[0]]+' ｜ '+tips[q[0]]:'英文を読み、最も適切な答えを選ぼう。';$('passage').textContent=q[1];$('question').textContent=q[2];$('feedback').hidden=true;$('options').replaceChildren();shuffle(q[3].map((s,k)=>[s,k])).forEach(([s,k])=>{let b=document.createElement('button');b.textContent=s;b.lang='en';b.dataset.k=k;b.onclick=()=>answer(k);$('options').append(b)});$('clock').textContent=limit?limit+'秒':'制限なし';if(limit){deadline=Date.now()+limit*1000;timer=setInterval(()=>{let left=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('clock').textContent=left+'秒';if(!left)answer(-1)},100)}}
function answer(k){if(done)return;if(limit&&Date.now()>=deadline)k=-1;done=true;clearInterval(timer);let q=queue[i],ok=k===q[4];stats[q[0]][1]++;if(ok){score++;stats[q[0]][0]++}for(let b of $('options').children){b.disabled=true;if(Number(b.dataset.k)===q[4])b.classList.add('good');else if(Number(b.dataset.k)===k)b.classList.add('bad')}$('result').textContent=ok?'正解！':k===-1?'時間切れ':'もう一度考えてみよう';$('translation').textContent='本文和訳：'+q[5];$('explanation').textContent='解説：'+q[6];$('strategy').textContent='今回の方略：'+names[q[0]]+' ｜ '+tips[q[0]];$('feedback').hidden=false;$('next').textContent=i===queue.length-1?'結果を見る':'次の問題'}
$('next').onclick=()=>{if(!done)return;i++;if(i<queue.length){render();return}show('end');$('score').textContent=score+' / '+queue.length+' 正解';$('stats').replaceChildren();stats.forEach(([a,b],k)=>{if(!b)return;let p=document.createElement('p');p.textContent=names[k]+'：'+a+' / '+b;$('stats').append(p)})};$('again').onclick=()=>show('home');$('back').onclick=()=>{if(!confirm('トレーニングを終了して設定に戻りますか？ 今回の解答結果は保存されません。'))return;clearInterval(timer);done=true;show('home');};
</script></body></html>
