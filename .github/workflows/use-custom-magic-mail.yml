name: Use custom magic-link email
on:
  push:
    paths:
      - '.github/workflows/use-custom-magic-mail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('login.html')
          s=p.read_text()
          old="""    await sendSignInLinkToEmail(auth,email,{url:actionUrl(),handleCodeInApp:true});\n    localStorage.setItem('emailForSignIn',email);"""
          new="""    const response=await fetch('https://task-quest.onrender.com/api/auth/magic-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,continueUrl:actionUrl()})});\n    if(!response.ok){\n      let body={};try{body=await response.json();}catch{}\n      if(response.status===503&&body.code==='MAIL_NOT_CONFIGURED'){\n        await sendSignInLinkToEmail(auth,email,{url:actionUrl(),handleCodeInApp:true});\n      }else{\n        const err=new Error(body.error||'ログインメールを送信できませんでした。');err.code='custom/mail';throw err;\n      }\n    }\n    localStorage.setItem('emailForSignIn',email);"""
          if old not in s:
              raise SystemExit('send anchor not found')
          s=s.replace(old,new,1)
          old2="""  if(c==='auth/account-exists-with-different-credential')return 'このメールは別のログイン方法ですでに登録されています。Googleで登録した場合はGoogleログインを使ってください。';\n  return 'ログイン処理に失敗しました。もう一度お試しください。';"""
          new2="""  if(c==='auth/account-exists-with-different-credential')return 'このメールは別のログイン方法ですでに登録されています。Googleで登録した場合はGoogleログインを使ってください。';\n  if(c==='custom/mail')return e?.message||'ログインメールを送信できませんでした。';\n  return 'ログイン処理に失敗しました。もう一度お試しください。';"""
          if old2 not in s:
              raise SystemExit('error anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit change and remove workflow
        run: |
          rm .github/workflows/use-custom-magic-mail.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add login.html .github/workflows/use-custom-magic-mail.yml
          git commit -m 'Use branded magic-link email service'
          git push
