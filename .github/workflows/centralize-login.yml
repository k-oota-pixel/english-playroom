name: Centralize login page

on:
  push:
    paths:
      - '.github/workflows/centralize-login.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point portal login button to central login page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'''loginBtn\.addEventListener\("click",async\(\)=>\{.*?\n\}\);\n\nlogoutBtn\.addEventListener'''
          replacement='''loginBtn.addEventListener("click",()=>{\n  const back=encodeURIComponent(location.href);\n  location.href=`./login.html?return=${back}`;\n});\n\nlogoutBtn.addEventListener'''
          s2,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'login handler replacement count={n}')
          replacements={
            'Googleログインすると、各教材のクラウド記録をまとめて表示します。':'ログインすると、各教材のクラウド記録をまとめて表示します。',
            'setAuthUI("","Googleログイン","端末保存");':'setAuthUI("","ログイン","端末保存");',
            'renderPet({},"Googleログインすると、たまごの育成が始まります。");':'renderPet({},"ログインすると、たまごの育成が始まります。");'
          }
          for old,new in replacements.items():
              if old not in s2:
                  raise SystemExit(f'missing target: {old}')
              s2=s2.replace(old,new,1)
          p.write_text(s2,encoding='utf-8')
          PY
      - name: Commit portal change and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/centralize-login.yml
          git add index.html .github/workflows/centralize-login.yml
          git commit -m "Use central login page"
          git push
