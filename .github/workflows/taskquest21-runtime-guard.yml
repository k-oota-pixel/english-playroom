name: Guard Task Quest 21 panda display

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/taskquest21-runtime-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Task Quest 21 runtime guard
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app-shell.js')
          s = p.read_text(encoding='utf-8')

          old = "window.MonstudyShell={canOpen,navigate,owns:win=>win===frame.contentWindow,materialReady(win){if(win!==frame.contentWindow)return;status.hidden=true;syncPause();}};"
          new = """function guardTaskQuest21(win){\n    try{\n      if(!win.location.pathname.startsWith('/task-quest/'))return;\n      const doc=win.document;\n      const apply=()=>{\n        doc.querySelectorAll('.taskbtn').forEach(button=>{\n          if(button.querySelector('.num')?.textContent.trim()==='21'){\n            const taskTitle=button.querySelector('.title');\n            if(taskTitle&&taskTitle.textContent!=='パンダの場所')taskTitle.textContent='パンダの場所';\n          }\n        });\n        if(/QUEST\\s+21\\s*\\/\\s*50/i.test(doc.querySelector('#questnum')?.textContent||'')){\n          const titleEl=doc.querySelector('#title');\n          const jaTask=doc.querySelector('#jaTask');\n          if(titleEl&&titleEl.textContent!=='パンダの場所')titleEl.textContent='パンダの場所';\n          if(jaTask&&jaTask.textContent!=='パンダがどこにいるか尋ねよう。')jaTask.textContent='パンダがどこにいるか尋ねよう。';\n        }\n      };\n      apply();\n      if(!win.__monstudyTaskQuest21Guard){\n        const observer=new win.MutationObserver(apply);\n        observer.observe(doc.body,{subtree:true,childList:true,characterData:true});\n        win.__monstudyTaskQuest21Guard=observer;\n      }\n    }catch{}\n  }\n  window.MonstudyShell={canOpen,navigate,owns:win=>win===frame.contentWindow,materialReady(win){if(win!==frame.contentWindow)return;status.hidden=true;guardTaskQuest21(win);syncPause();}};"""
          if old not in s:
              raise SystemExit('MonstudyShell materialReady marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './app-shell.js?v=2.1.11'
          new = './app-shell.js?v=2.1.12'
          if old not in s:
              raise SystemExit('app-shell cache key 2.1.11 not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.js index.html
          git commit -m "Guard Task Quest 21 panda display"
          git push
