name: Polish developer contact header UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-developer-contact-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header UI safely
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('developer-contact.js')
          s=p.read_text()
          s=s.replace("  accountLink.textContent='コード登録';","  if(accountLink.textContent!=='コード登録')accountLink.textContent='コード登録';")
          s=s.replace("  const authSub=area.querySelector('#authSub');if(authSub)authSub.hidden=true;","  const authSub=area.querySelector('#authSub');if(authSub&&!authSub.hidden)authSub.hidden=true;")
          p.write_text(s)

          p=Path('version-badge-v176.js')
          s=p.read_text()
          s=s.replace("import './developer-contact.js?v=2.3.15';","import './developer-contact.js?v=2.3.16';")
          s=s.replace("const APP_VERSION='2.3.15';","const APP_VERSION='2.3.16';")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('>登録コードの紐づけ・パスワード変更</a>','>コード登録</a>')
          s=s.replace('<span id="authSub" class="auth-sub">Firebase接続中</span>','<span id="authSub" class="auth-sub" hidden></span>')
          s=s.replace("src='./version-badge-v176.js?v=2.3.15'","src='./version-badge-v176.js?v=2.3.16'")
          s=s.replace('aria-label="version 2.3.15">ver2.3.15','aria-label="version 2.3.16">ver2.3.16')
          s=s.replace("const version = '2.3.15';","const version = '2.3.16';")
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add developer-contact.js version-badge-v176.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish developer contact header UI"
          git push
