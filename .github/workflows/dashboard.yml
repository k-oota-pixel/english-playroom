name: Homepage and daily coin board
on:
  push:
    paths:
      - 'index.html'
      - 'dashboard-extra.js'
      - 'learning-dashboard.js'
      - 'tests/learning-dashboard*'
      - 'admin-content-model.js'
      - 'coin-reward.js'
      - 'tests/home-page*'
      - 'tests/coin-reward*'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch:
jobs:
  homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/home-page-browser.cjs
      - run: node tests/learning-dashboard-browser.cjs
