name: Patch built-in pet chat

on:
  push:
    paths:
      - '.github/workflows/patch-built-in-pet-chat.yml'
      - '.github/patch-built-in-pet-chat.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch built-in chat
        run: python .github/patch-built-in-pet-chat.py
      - name: Validate module syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script type="module">')+len('<script type="module">')
          end=s.index('</script>',start)
          Path('/tmp/index.mjs').write_text(s[start:end],encoding='utf-8')
          assert 'petChatButton' not in s
          assert 'showPetChatBuiltIn' in s
          assert 'position:fixed;inset:0;z-index:10000' not in s
          PY
          node --check /tmp/index.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Embed pet chat in top page"
          git push
