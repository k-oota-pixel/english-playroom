name: Brand cold-start auth loader
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/brand-cold-start-loader.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch initial auth splash
        env:
          OLD_B64: 
          NEW_B64: 
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=base64.b64decode(os.environ['OLD_B64']).decode('utf-8')
          new=base64.b64decode(os.environ['NEW_B64']).decode('utf-8')
          if old not in s:
              raise SystemExit('expected cold-start lock block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Brand cold-start authentication splash"
          git push
