name: Eigo Dungeons regression
# Final 1.10.22 coverage: battle timing, MP, magic, items, checkpoints, rankings, release wiring, automatic transitions, and fake-clock browser checks.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pet-adventure.yml', 'pet-adventure/**', 'pet-play*.js', 'pet-art.js', 'pet-strength.js', 'pet-strength.css', 'pet-strength-model.js', 'pet-dungeons-model.js', 'pet-dungeons-shop.js', 'version-badge-v176.js', 'index.html', 'tests/pet-strength.test.js', 'tests/release-version.test.js', 'tests/pet-battle-art.test.js', 'tests/pet-realtime.test.js', 'tests/adventure-selection-browser.cjs', 'tests/adventure-rankings-browser.cjs', 'tests/adventure-checkpoints-browser.cjs', 'tests/pet-adventure.test.js']
  pull_request:
    paths: ['.github/workflows/pet-adventure.yml', 'pet-adventure/**', 'pet-play*.js', 'pet-art.js', 'pet-strength.js', 'pet-strength.css', 'pet-strength-model.js', 'pet-dungeons-model.js', 'pet-dungeons-shop.js', 'version-badge-v176.js', 'index.html', 'tests/pet-strength.test.js', 'tests/release-version.test.js', 'tests/pet-battle-art.test.js', 'tests/pet-realtime.test.js', 'tests/adventure-selection-browser.cjs', 'tests/adventure-rankings-browser.cjs', 'tests/adventure-checkpoints-browser.cjs', 'tests/pet-adventure.test.js']
permissions:
  contents: read
jobs:
  adventure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/pet-realtime.test.js tests/pet-battle-art.test.js tests/pet-adventure.test.js tests/pet-strength.test.js tests/release-version.test.js
      - run: node tests/adventure-selection-browser.cjs
      - run: node tests/adventure-rankings-browser.cjs
      - run: node tests/adventure-checkpoints-browser.cjs
