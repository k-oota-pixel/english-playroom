name: Update answer auto advance test
on:
  push:
    paths:
      - '.github/workflows/update-auto-answer-test.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale manual next click
        run: sed -i '171d' tests/adventure-selection-browser.cjs
      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/adventure-selection-browser.cjs
          git commit -m "Test automatic advance after answered question"
          git push
