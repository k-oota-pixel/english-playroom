name: Pixel room regression
on:
  pull_request:
    paths:
      - 'pet-room/room-pixel*'
      - 'tests/pet-room-pixel*'
      - '.github/workflows/pixel-room.yml'
  push:
    branches: [main]
    paths:
      - 'pet-room/room-pixel*'
      - 'tests/pet-room-pixel*'
      - '.github/workflows/pixel-room.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-room:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: node --test tests/pet-room-pixel.test.js
      - run: npx playwright install --with-deps chromium
      - run: node tests/pet-room-pixel-browser.cjs
      - name: Keep review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixel-room-browser-screenshots
          path: pixel-room-*.png
          if-no-files-found: ignore
