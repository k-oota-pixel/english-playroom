name: Fix pet shop scroll layout

on:
  push:
    paths:
      - '.github/workflows/fix-shop-scroll.yml'
      - '.github/scripts/fix-shop-scroll.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch shop layout
        run: |
          python .github/scripts/fix-shop-scroll.py
          node --check pet-shop.js
      - name: Commit change and remove one-off files
        run: |
          rm .github/workflows/fix-shop-scroll.yml
          rm .github/scripts/fix-shop-scroll.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-shop.js .github/workflows/fix-shop-scroll.yml .github/scripts/fix-shop-scroll.py
          git commit -m 'Keep pet preview fixed while catalog scrolls'
          git push
