name: Fix built-in chat ARIA

on:
  push:
    paths:
      - '.github/workflows/fix-built-in-chat-aria.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix embedded chat semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<section id="petChatModal" class="pet-chat-modal" hidden role="dialog" aria-modal="true" aria-labelledby="petChatTitle">'
          new='<section id="petChatModal" class="pet-chat-modal" hidden aria-labelledby="petChatTitle">'
          if old not in s: raise SystemExit('chat section tag not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix embedded chat accessibility semantics"
          git push
