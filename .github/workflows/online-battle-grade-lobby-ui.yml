name: Online battle grade lobby UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/online-battle-grade-lobby-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python .github/scripts/online_battle_grade_lobby_ui.py
      - run: node --check pet-adventure/online-battle.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pet-adventure/online-battle.html pet-adventure/online-battle.js pet-adventure/online-battle.css version-badge-v176.js index.html
          git diff --cached --check
          git commit -m "Simplify online battle grade lobbies"
          git push
