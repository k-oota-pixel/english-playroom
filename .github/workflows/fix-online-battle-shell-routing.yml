name: Fix online battle shell routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-online-battle-shell-routing.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch shell routing and release version
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'app-shell.js',
              "const MATERIAL_RELEASE='2.1.32';",
              "const MATERIAL_RELEASE='2.1.33';"
          )
          replace_once(
              'app-shell.js',
              "    {name:'魔物の巣窟',url:new URL('pet-adventure/?mode=dungeon',root)}\n  ]});",
              "    {name:'魔物の巣窟',url:new URL('pet-adventure/?mode=dungeon',root)},\n    {name:'オンライン対戦',url:new URL('pet-adventure/online-battle.html',root)}\n  ]});"
          )

          replace_once(
              'pet-adventure/online-battle.html',
              '<script type="module" src="https://k-oota-pixel.github.io/english-playroom/access-gate.js?v=2.3.14"></script>\n<script type="module" src="./online-battle.js?v=2.2.0"></script>',
              '<script type="module" src="https://k-oota-pixel.github.io/english-playroom/access-gate.js?v=2.3.14"></script>\n<script src="../shell-bridge.js?v=2.1.1"></script>\n<script type="module" src="./online-battle.js?v=2.2.0"></script>'
          )

          replace_once(
              'version-badge-v176.js',
              "const APP_VERSION='2.3.42';",
              "const APP_VERSION='2.3.43';"
          )

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if '2.3.42' not in text:
              raise SystemExit('Current visible version 2.3.42 not found in index.html')
          text = text.replace('2.3.42', '2.3.43')
          if './app-shell.js?v=2.3.13' not in text:
              raise SystemExit('Expected app-shell cache query not found in index.html')
          text = text.replace('./app-shell.js?v=2.3.13', './app-shell.js?v=2.3.43', 1)
          index.write_text(text, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.js pet-adventure/online-battle.html version-badge-v176.js index.html
          git diff --cached --check
          git commit -m "Register online battle with shared shell"
          git push
