name: Sync release 1.10.22
on:
  push:
    paths:
      - '.github/workflows/release-1-10-22.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync root release markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            './pet-strength.css?v=1.10.21':'./pet-strength.css?v=1.10.22',
            './pet-strength.js?v=1.10.21':'./pet-strength.js?v=1.10.22',
            'version-badge-v176.js?v=1.10.21':'version-badge-v176.js?v=1.10.22',
            'aria-label="version 1.10.21"':'aria-label="version 1.10.22"',
            '>ver1.10.21<':'>ver1.10.22<',
            "const version = '1.10.21'":"const version = '1.10.22'",
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing release marker: {old}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit synchronized release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bump visible release to 1.10.22"
          git push
