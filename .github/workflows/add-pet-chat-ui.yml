name: Add pet chat UI

on:
  push:
    paths:
      - '.github/workflows/add-pet-chat-ui.yml'
      - '.github/add-pet-chat-ui.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch top page
        run: python .github/add-pet-chat-ui.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add pet English chat UI"
          git push
