name: WORD BREAKER records
on:
  push:
    paths:
      - 'word-breaker*'
      - 'tests/word-breaker-records-browser.cjs'
      - '.github/workflows/word-breaker-records.yml'
  workflow_dispatch:
jobs:
  records-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/word-breaker-records-browser.cjs
        env:
          SCREENSHOT_PATH: records-mobile.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: word-breaker-records-mobile
          path: records-mobile.png
