name: Rebrand to Ootamagotchi

on:
  push:
    paths:
      - '.github/workflows/rebrand-ootamago.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace visible English Playroom branding
        run: |
          python - <<'PY'
          from pathlib import Path
          exts={'.html','.js','.css','.md','.json','.yml','.yaml'}
          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() not in exts:
                  continue
              if '.git' in p.parts or p.as_posix()=='.github/workflows/rebrand-ootamago.yml':
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              ns=s.replace('ENGLISH PLAYROOM','おおたまごっち').replace('English Playroom','おおたまごっち')
              if ns!=s:
                  p.write_text(ns,encoding='utf-8')
                  changed.append(str(p))
          print('changed:', changed)
          PY
      - name: Commit rebrand and remove one-time workflow
        run: |
          git rm .github/workflows/rebrand-ootamago.yml
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand site to おおたまごっち"
          git push
