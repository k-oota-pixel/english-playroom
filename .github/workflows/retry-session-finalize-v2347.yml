name: Apply retry session finalize and ranking wiring

on:
  push:
    paths:
      - '.github/workflows/retry-session-finalize-v2347.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python .github/scripts/retry-session-finalize-patch.py
      - name: Validate
        run: |
          node --check coin-reward.js
          node --check admin-retry-stats.js
          grep -q 'async function recordRetrySession' coin-reward.js
          grep -q 'function flushRetryAttempts(force=false)' coin-reward.js
          grep -q 'admin-retry-stats.js?v=2.3.47' admin.html
          grep -q "APP_VERSION='2.3.47'" version-badge-v176.js
          grep -q "const version = '2.3.47'" index.html
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coin-reward.js admin.html version-badge-v176.js index.html
          git commit -m 'Finalize retry sessions and add difficulty ranking'
          git push
