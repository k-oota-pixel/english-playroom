name: Bump material cache to 2.1.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-material-cache-2-1-11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump material cache key
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app-shell.js')
          s = p.read_text(encoding='utf-8')
          old = "entry.searchParams.set('monstudy-release','2.1.10')"
          new = "entry.searchParams.set('monstudy-release','2.1.11')"
          if old not in s:
              raise SystemExit('app-shell material cache key 2.1.10 not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = './app-shell.js?v=2.1.10'
          new = './app-shell.js?v=2.1.11'
          if old not in s:
              raise SystemExit('index app-shell cache key 2.1.10 not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.js index.html
          git commit -m "Refresh embedded Task Quest cache"
          git push
