name: Switch online battle vocabulary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-online-battle-eiken-vocab.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/switch-online-battle-eiken.mjs
      - run: node --check pet-adventure/online-battle.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-adventure/online-battle.js pet-adventure/online-battle.html version-badge-v176.js index.html
          git commit -m 'Switch online battle to Eiken vocabulary master'
          git push
