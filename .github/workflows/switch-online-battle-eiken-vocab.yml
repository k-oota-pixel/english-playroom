name: Switch online battle to Eiken vocabulary master

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-online-battle-eiken-vocab.yml'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch online battle vocabulary source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path=Path('pet-adventure/online-battle.js')
          js=js_path.read_text(encoding='utf-8')
          old_map="function gradeLevel(grade){return ({'4級':'junior1','3級':'junior2','準2級':'junior3','2級':'high1'})[grade]||'junior1';}"
          new_map="function gradeLevel(grade){return ({'4級':'4','3級':'3','準2級':'pre2','2級':'2'})[grade]||'4';}"
          if old_map not in js:
              raise SystemExit('gradeLevel mapping not found')
          js=js.replace(old_map,new_map,1)

          new_loader=r'''async function loadQuestionPool(){
 try{
  const response=await fetch('https://k-oota-pixel.github.io/word-breaker/eiken_vocab_master.json?v=1.0.0',{cache:'force-cache'}),payload=await response.json(),source=payload?.grades||{},rows=[];
  for(const grade of ['4','3','pre2','2']){
   const items=source?.[grade]?.words||[];
   for(const [i,item] of items.entries()){
    const word=String(item?.word||'').trim(),meaning=(Array.isArray(item?.answers)?item.answers:[]).find(v=>typeof v==='string'&&v.trim())?.trim()||String(item?.meaning||'').trim();
    if(word&&meaning)rows.push({id:grade+'-'+(item.id||i),level:grade,word,meaning});
   }
  }
  if(!['4','3','pre2','2'].every(grade=>rows.filter(q=>q.level===grade).length>=4))throw new Error('級別語彙データが不足しています。');
  questionPool=rows;
 }catch(e){
  console.warn('online battle question load failed',e);
  questionPool=[
   {id:'f4-1',level:'4',word:'apple',meaning:'りんご'},{id:'f4-2',level:'4',word:'book',meaning:'本'},{id:'f4-3',level:'4',word:'water',meaning:'水'},{id:'f4-4',level:'4',word:'school',meaning:'学校'},
   {id:'f3-1',level:'3',word:'outside',meaning:'外で'},{id:'f3-2',level:'3',word:'realize',meaning:'気づく'},{id:'f3-3',level:'3',word:'exercise',meaning:'運動'},{id:'f3-4',level:'3',word:'visitor',meaning:'訪問者'},
   {id:'fp2-1',level:'pre2',word:'include',meaning:'含む'},{id:'fp2-2',level:'pre2',word:'achieve',meaning:'達成する'},{id:'fp2-3',level:'pre2',word:'maintain',meaning:'維持する'},{id:'fp2-4',level:'pre2',word:'audience',meaning:'観客'},
   {id:'f2-1',level:'2',word:'potential',meaning:'可能性'},{id:'f2-2',level:'2',word:'threaten',meaning:'脅かす'},{id:'f2-3',level:'2',word:'quantity',meaning:'量'},{id:'f2-4',level:'2',word:'accomplish',meaning:'成し遂げる'}
  ];
 }
}'''
          pattern=r"async function loadQuestionPool\(\)\{.*?\n\}\n\n\$\('refreshBtn'\)"
          replacement=new_loader+"\n\n$('refreshBtn')"
          js2,count=re.subn(pattern,replacement,js,count=1,flags=re.S)
          if count!=1:
              raise SystemExit(f'loadQuestionPool replacement count={count}')
          js_path.write_text(js2,encoding='utf-8')

          html_path=Path('pet-adventure/online-battle.html')
          html=html_path.read_text(encoding='utf-8')
          if './online-battle.js?v=2.3.46' not in html:
              raise SystemExit('online battle cache query not found')
          html=html.replace('./online-battle.js?v=2.3.46','./online-battle.js?v=2.3.46-eiken1',1)
          html_path.write_text(html,encoding='utf-8')

          vb_path=Path('version-badge-v176.js')
          vb=vb_path.read_text(encoding='utf-8')
          if "const APP_VERSION='2.3.45';" not in vb:
              raise SystemExit('APP_VERSION 2.3.45 not found')
          vb=vb.replace("const APP_VERSION='2.3.45';","const APP_VERSION='2.3.46';",1)
          vb_path.write_text(vb,encoding='utf-8')

          index_path=Path('index.html')
          index=index_path.read_text(encoding='utf-8')
          if "version-badge-v176.js?v=2.3.45" not in index or "const version = '2.3.45';" not in index:
              raise SystemExit('index version markers not found')
          index=index.replace('version-badge-v176.js?v=2.3.45','version-badge-v176.js?v=2.3.46',1)
          index=index.replace("const version = '2.3.45';","const version = '2.3.46';",1)
          index_path.write_text(index,encoding='utf-8')
          PY
          node --check pet-adventure/online-battle.js
      - name: Commit switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-adventure/online-battle.js pet-adventure/online-battle.html version-badge-v176.js index.html
          git commit -m 'Switch online battle to Eiken vocabulary master'
          git push
