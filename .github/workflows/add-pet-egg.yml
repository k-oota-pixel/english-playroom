name: Add pet egg feature

on:
  push:
    paths:
      - '.github/workflows/add-pet-egg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add pet egg and 3-login hatch logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          css_anchor='''.grow-bar>i{display:block;height:100%;background:#78a96f;border-radius:99px}\n'''
          css_add='''\n.pet-card{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;background:linear-gradient(135deg,#fffaf0,#fff);border:1px solid #eadfc7;border-radius:16px;box-shadow:0 3px 12px #5b472007}\n.pet-visual-wrap{width:92px;height:92px;flex:0 0 92px;display:grid;place-items:center;border-radius:18px;background:#fff7df;border:1px solid #f0e1b7}\n.pet-visual{font-size:58px;line-height:1;filter:drop-shadow(0 5px 7px #5b472018);transform-origin:50% 85%}\n.pet-visual.egg{animation:eggWiggle 2.8s ease-in-out infinite}\n.pet-visual.hatched{animation:petPop .55s ease-out both}\n.pet-info{min-width:0;flex:1}\n.pet-eyebrow{font-size:9px;letter-spacing:.12em;color:#9a7830;font-weight:800}\n.pet-title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}\n.pet-title strong{font-size:18px}\n.pet-days{font-size:12px;color:#9a7830;font-weight:800}\n.pet-status{font-size:11.5px;color:#6f6654;line-height:1.45;margin-top:3px}\n.pet-bar{height:6px;background:#f5eedc;border-radius:99px;overflow:hidden;margin-top:8px;max-width:360px}\n.pet-bar>i{display:block;height:100%;background:#e3b74f;border-radius:99px;transition:width .35s ease}\n@keyframes eggWiggle{0%,82%,100%{transform:rotate(0)}86%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}94%{transform:rotate(-3deg)}98%{transform:rotate(3deg)}}\n@keyframes petPop{0%{transform:scale(.65);opacity:.4}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}\n'''
          if '.pet-card{' not in s:
              if css_anchor not in s: raise SystemExit('CSS anchor not found')
              s=s.replace(css_anchor,css_anchor+css_add,1)

          mobile_anchor='''@media(max-width:560px){.home{padding:16px 14px 22px}.label{margin-top:12px}h1{font-size:28px}.grow-card{gap:10px;padding:8px 10px;margin-top:12px}.grow-img-wrap{width:76px;height:76px;flex-basis:76px}.grow-img{max-width:76px;max-height:76px}.grow-title strong{font-size:16px}.grow-days{font-size:11px}.grow-status{font-size:10.5px}.cards{grid-template-columns:1fr;gap:10px;margin-top:14px}.card{padding:14px}.desc{min-height:0}.title{font-size:19px}}'''
          mobile_new='''@media(max-width:560px){.home{padding:16px 14px 22px}.label{margin-top:12px}h1{font-size:28px}.pet-card,.grow-card{gap:10px;padding:8px 10px;margin-top:12px}.pet-visual-wrap,.grow-img-wrap{width:76px;height:76px;flex-basis:76px}.pet-visual{font-size:48px}.grow-img{max-width:76px;max-height:76px}.pet-title strong,.grow-title strong{font-size:16px}.pet-days,.grow-days{font-size:11px}.pet-status,.grow-status{font-size:10.5px}.cards{grid-template-columns:1fr;gap:10px;margin-top:14px}.card{padding:14px}.desc{min-height:0}.title{font-size:19px}}'''
          if mobile_anchor in s:
              s=s.replace(mobile_anchor,mobile_new,1)

          html_anchor='''  <p class="intro">単語・語順・英作文・読解。今日は何にチャレンジする？<br>好きなゲームを選んで始めよう。</p>\n\n'''
          html_add='''  <section class="pet-card" aria-label="ペット育成">\n    <div class="pet-visual-wrap">\n      <div id="petVisual" class="pet-visual egg" role="img" aria-label="ふしぎなたまご">🥚</div>\n    </div>\n    <div class="pet-info">\n      <div class="pet-eyebrow">MY PET</div>\n      <div class="pet-title">\n        <strong id="petTitle">ふしぎなたまご</strong>\n        <span id="petDays" class="pet-days">ログイン 0 / 3日</span>\n      </div>\n      <div id="petStatus" class="pet-status">ログイン状態を確認しています…</div>\n      <div class="pet-bar" aria-hidden="true"><i id="petBar" style="width:0%"></i></div>\n    </div>\n  </section>\n\n'''
          if 'id="petVisual"' not in s:
              if html_anchor not in s: raise SystemExit('HTML anchor not found')
              s=s.replace(html_anchor,html_anchor+html_add,1)

          refs_anchor='''const glory=window.morningGloryApp;\nconst dashRefresh=document.getElementById("dashRefresh");'''
          refs_new='''const glory=window.morningGloryApp;\nconst petVisual=document.getElementById("petVisual");\nconst petTitle=document.getElementById("petTitle");\nconst petDays=document.getElementById("petDays");\nconst petStatus=document.getElementById("petStatus");\nconst petBar=document.getElementById("petBar");\nconst dashRefresh=document.getElementById("dashRefresh");'''
          if refs_anchor in s and 'const petVisual=' not in s:
              s=s.replace(refs_anchor,refs_new,1)

          sync_anchor='''  setAuthUI("ok",shortName(user),"クラウド同期済み");\n}\n\n\nfunction dateKeyFromMs(ms){'''
          pet_code='''  setAuthUI("ok",shortName(user),"クラウド同期済み");\n}\n\nfunction renderPet(days,hatched,message=""){\n  days=Math.max(0,Number(days)||0);\n  const shown=Math.min(3,days);\n  petDays.textContent=hatched?"誕生しました！":`ログイン ${shown} / 3日`;\n  petBar.style.width=`${Math.min(100,(shown/3)*100)}%`;\n  petVisual.classList.toggle("egg",!hatched);\n  petVisual.classList.toggle("hatched",hatched);\n  if(hatched){\n    petVisual.textContent="🐣";\n    petVisual.setAttribute("aria-label","生まれたばかりのペット");\n    petTitle.textContent="ペットが生まれた！";\n    petStatus.textContent=message||"3日ログイン達成！ これから一緒に育てていこう。";\n  }else{\n    petVisual.textContent="🥚";\n    petVisual.setAttribute("aria-label","ふしぎなたまご");\n    petTitle.textContent="ふしぎなたまご";\n    const remain=Math.max(0,3-days);\n    petStatus.textContent=message||(days?`あと${remain}日ログインすると、たまごがかえります。`:"Googleログインすると、たまごの育成が始まります。");\n  }\n}\n\nasync function syncPet(user){\n  const today=glory.localDateKey();\n  const ref=growthRef(user);\n  const snap=await getDoc(ref);\n  const data=snap.exists()?(snap.data()||{}):{};\n  let days=Math.max(0,Number(data.petLoginDays)||0);\n  let last=typeof data.petLastLoginDate==="string"?data.petLastLoginDate:"";\n  const wasHatched=!!data.petHatched||days>=3;\n  let hatched=wasHatched;\n  let changed=false;\n\n  if(last!==today){\n    days+=1;\n    last=today;\n    changed=true;\n  }\n  if(days>=3)hatched=true;\n\n  renderPet(days,hatched);\n\n  if(changed||hatched!==wasHatched){\n    const payload={\n      petLoginDays:days,\n      petLastLoginDate:last,\n      petHatched:hatched,\n      petUpdatedAt:serverTimestamp()\n    };\n    if(hatched&&!wasHatched)payload.petHatchedAt=serverTimestamp();\n    await setDoc(ref,payload,{merge:true});\n  }\n}\n\n\nfunction dateKeyFromMs(ms){'''
          if 'async function syncPet(user)' not in s:
              if sync_anchor not in s: raise SystemExit('sync anchor not found')
              s=s.replace(sync_anchor,pet_code,1)

          logout_anchor='''    glory.render(local.days,"この端末に保存中。Googleログインすると端末間で同期できます。");\n    resetDashboard();'''
          logout_new='''    glory.render(local.days,"この端末に保存中。Googleログインすると端末間で同期できます。");\n    renderPet(0,false,"Googleログインすると、たまごの育成が始まります。");\n    resetDashboard();'''
          if logout_anchor in s and 'renderPet(0,false,"Googleログインすると、たまごの育成が始まります。")' not in s:
              s=s.replace(logout_anchor,logout_new,1)

          login_anchor='''    await syncGrowth(user);\n    await refreshDashboard(user);'''
          login_new='''    await syncGrowth(user);\n    await syncPet(user);\n    await refreshDashboard(user);'''
          if login_anchor in s and 'await syncPet(user);' not in s:
              s=s.replace(login_anchor,login_new,1)

          catch_anchor='''    console.error("Morning glory sync failed",err);'''
          if catch_anchor in s:
              s=s.replace(catch_anchor,'    console.error("English Playroom sync failed",err);',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add pet egg that hatches after 3 login days"
          git push
