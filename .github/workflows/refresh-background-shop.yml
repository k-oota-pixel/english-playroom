name: Refresh pet shop backgrounds
on:
  push:
    paths:
      - '.github/workflows/refresh-background-shop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh background art and add Halloween
        run: |
          python .github/scripts/refresh-background-shop.py
          node --check pet-model.js
          node --check pet-shop.js
      - name: Commit change and remove one-off files
        run: |
          rm .github/scripts/refresh-background-shop.py .github/workflows/refresh-background-shop.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pet-model.js pet-shop.js .github/scripts/refresh-background-shop.py .github/workflows/refresh-background-shop.yml
          git commit -m "Refresh pet shop backgrounds and add Halloween"
          git push
# retry after fixing the patch script
