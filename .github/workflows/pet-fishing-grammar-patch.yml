name: PET Fishing grammar patch
on:
  push:
    paths:
      - 'scripts/apply-pet-fishing-grammar.mjs'
      - '.github/workflows/pet-fishing-grammar-patch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply grammar mode
        run: node scripts/apply-pet-fishing-grammar.mjs
      - name: Validate module syntax
        run: |
          node --check pet-fishing/grammar-mode.js
          node --check pet-fishing/data/eigojun-grammar-1.js
          node --check pet-fishing/data/eigojun-grammar-2.js
          node --check pet-fishing/data/eigojun-grammar-3.js
          node --check pet-fishing/data/eigojun-grammar-4.js
      - name: Commit PET FISHING update
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-fishing/index.html
          git commit -m 'Add EigoJun grammar mode to PET FISHING'
          git push
