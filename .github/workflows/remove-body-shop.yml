name: Remove body shop tab

on:
  push:
    paths:
      - '.github/workflows/remove-body-shop.yml'
      - '.github/scripts/remove-body-shop.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove body shop content
        run: |
          python .github/scripts/remove-body-shop.py
          node --check pet-shop.js
          node --check pet-model.js
      - name: Commit change and remove one-off files
        run: |
          rm .github/workflows/remove-body-shop.yml
          rm .github/scripts/remove-body-shop.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-shop.js pet-model.js .github/workflows/remove-body-shop.yml .github/scripts/remove-body-shop.py
          git commit -m 'Remove body shop tab and body items'
          git push
