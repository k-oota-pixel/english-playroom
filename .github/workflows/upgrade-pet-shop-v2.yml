name: Upgrade pet shop v2

on:
  push:
    paths:
      - '.github/workflows/upgrade-pet-shop-v2.yml'
      - '.github/scripts/upgrade-pet-shop-v2.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and validate upgraded pet shop
        run: |
          python .github/scripts/upgrade-pet-shop-v2.py
          node --check pet-shop.js
          node --check pet-model.js
          node --check pet-art.js
          node --input-type=module <<'NODE'
          import {OPTIONS, DEFAULT_APPEARANCE, validAppearance, equippedLayers} from './pet-model.js';
          if (!validAppearance(DEFAULT_APPEARANCE)) throw new Error('Default appearance invalid');
          if (OPTIONS.species.length !== 10) throw new Error('Species list changed unexpectedly');
          const layers=equippedLayers({ownedItems:['red-ribbon','sunglasses','red-bowtie','star-shirt'],equipped:{head:'red-ribbon',face:'sunglasses',neck:'red-bowtie',body:'star-shirt'}});
          if (!layers.accessories.includes('#e55f72') || !layers.accessories.includes('#344b58') || !layers.accessories.includes('#fff4cf')) throw new Error('Accessory slots did not combine');
          console.log('Pet model checks passed');
          NODE
      - name: Commit upgrade and remove one-off files
        run: |
          rm .github/workflows/upgrade-pet-shop-v2.yml
          rm .github/scripts/upgrade-pet-shop-v2.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-shop.js pet-model.js pet-art.js tests/pet-model.test.js .github/workflows/upgrade-pet-shop-v2.yml .github/scripts/upgrade-pet-shop-v2.py
          git commit -m 'Upgrade pet shop with live preview and full customization'
          git push
