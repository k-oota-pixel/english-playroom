name: Patch retry all-mode session finalization

on:
  push:
    paths:
      - '.github/workflows/retry-session-all-mode-v2347.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/retry-session-all-patch.py
      - run: |
          node --check coin-reward.js
          grep -q 'const CHUNK_SIZE=100' coin-reward.js
          grep -q 'attempts:normalized.length' coin-reward.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coin-reward.js
          git commit -m 'Handle retry all-mode after session completion'
          git push
