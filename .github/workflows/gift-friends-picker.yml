name: Gift friend picker checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check pet-gifts.js && node --check pet-friends.js
      - run: node --test tests/gift-friends-picker.test.js tests/release-version.test.js tests/pet-friends-close.test.js
