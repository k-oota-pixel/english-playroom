name: Update answer clock test
on:
  push:
    paths:
      - '.github/workflows/update-answer-clock-test.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Advance fake clock before automatic next attack
        run: sed -i '171i\  await page.clock.runFor(500);' tests/adventure-selection-browser.cjs
      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/adventure-selection-browser.cjs
          git commit -m "Advance browser clock for automatic answer transition"
          git push
