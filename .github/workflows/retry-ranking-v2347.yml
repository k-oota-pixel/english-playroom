name: Implement retry session and admin ranking

on:
  push:
    paths:
      - '.github/workflows/retry-ranking-v2347.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply retry session and admin ranking patch
        run: |
          echo '...truncated...' | base64 -d > /tmp/retry-ranking-patch.py
          python /tmp/retry-ranking-patch.py
      - name: Validate
        run: |
          node --check coin-reward.js
          node --check admin-retry-stats.js
          grep -q 'recordRetrySession' coin-reward.js
          grep -q 'admin-retry-stats.js?v=2.3.47' admin.html
          grep -q "APP_VERSION='2.3.47'" version-badge-v176.js
          grep -q "const version = '2.3.47'" index.html
          grep -q 'coin-reward.js?v=2.3.47' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coin-reward.js admin-retry-stats.js admin.html version-badge-v176.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Batch retry sessions and add difficulty ranking'
          git pull --rebase origin main
          git push origin HEAD:main
