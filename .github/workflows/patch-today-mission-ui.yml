name: Patch TODAY mission UI
on:
  push:
    branches: [feature/today-missions]
    paths:
      - scripts/patch-today-mission-ui.mjs
      - .github/workflows/patch-today-mission-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/today-missions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patch-today-mission-ui.mjs
      - run: |
          node --check today/app.js
          node --test tests/today-daily-update.test.js
          grep -q "TODAY'S MISSION" today/app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today/app.js today/style.css today/index.html
          git commit -m "Show level-aware missions before TODAY articles"
          git push origin HEAD:feature/today-missions
