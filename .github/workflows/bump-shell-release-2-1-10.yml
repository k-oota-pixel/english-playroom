name: Bump shell release to 2.1.10

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-shell-release-2-1-10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump shell cache keys
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app-shell.js')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('もんすたでぃ · ver2.1.9', 'もんすたでぃ · ver2.1.10')
          s2 = s2.replace("entry.searchParams.set('monstudy-release','2.1.9')", "entry.searchParams.set('monstudy-release','2.1.10')")
          if s2 == s:
              raise SystemExit('app-shell.js expected 2.1.9 markers were not found')
          p.write_text(s2, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('./app-shell.css?v=2.1.9', './app-shell.css?v=2.1.10')
          s2 = s2.replace('./app-shell.js?v=2.1.9', './app-shell.js?v=2.1.10')
          if s2 == s:
              raise SystemExit('index.html expected app-shell 2.1.9 markers were not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-shell.js index.html
          git commit -m "Bump shell cache key for Task Quest refresh"
          git push
