name: Install developer contact UI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-developer-contact.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contact UI loader and version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('version-badge-v176.js')
          s=p.read_text()
          anchor="import './material-return.js?v=4.0.0';"
          imp="import './developer-contact.js?v=2.3.15';"
          if imp not in s:
              if anchor not in s: raise SystemExit('version badge anchor missing')
              s=s.replace(anchor,anchor+'\n'+imp,1)
          s=s.replace("const APP_VERSION='2.3.14';","const APP_VERSION='2.3.15';")
          p.write_text(s)

          p=Path('index.html')
          s=p.read_text()
          s=s.replace("src='./version-badge-v176.js?v=2.3.14'","src='./version-badge-v176.js?v=2.3.15'")
          s=s.replace('aria-label="version 2.3.14">ver2.3.14','aria-label="version 2.3.15">ver2.3.15')
          s=s.replace("const version = '2.3.14';","const version = '2.3.15';")
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version-badge-v176.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add developer message form to header"
          git push
