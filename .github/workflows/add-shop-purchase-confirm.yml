name: Add shop purchase confirmation

on:
  push:
    paths:
      - '.github/workflows/add-shop-purchase-confirm.yml'
      - '.github/scripts/add-shop-purchase-confirm.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pet shop
        run: |
          python .github/scripts/add-shop-purchase-confirm.py
          node --check pet-shop.js
      - name: Commit change and clean temporary files
        run: |
          rm .github/workflows/add-shop-purchase-confirm.yml
          rm .github/scripts/add-shop-purchase-confirm.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pet-shop.js .github/workflows/add-shop-purchase-confirm.yml .github/scripts/add-shop-purchase-confirm.py
          git commit -m 'Add shop purchase confirmation dialog'
          git push
