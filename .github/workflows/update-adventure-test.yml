name: Update adventure transition test
on:
  push:
    paths:
      - '.github/workflows/update-adventure-test.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update assertions
        run: |
          sed -i '63c\ await page.clock.runFor(700);' tests/adventure-selection-browser.cjs
          sed -i '64c\ for(const floor of [3,4]){await clearEnemy();await page.clock.runFor(700);}' tests/adventure-selection-browser.cjs
          git diff -- tests/adventure-selection-browser.cjs
      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/adventure-selection-browser.cjs
          git commit -m "Test automatic transition after enemy defeat"
          git push
