name: Pet care reaction regression
on:
  push:
    paths:
      - admin.html
      - admin-ui.js
      - pet-admin-panel.js
      - tests/admin-browser.cjs
      - index.html
      - pet-art.js
      - pet-care-animation.js
      - tests/pet-sync-chat-browser.cjs
      - pet-shop.js
      - pet-sleep-mode.js
      - pet-jump-fix.js
      - tests/pet-care-reaction-browser.cjs
      - .github/workflows/pet-care-reactions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tests/admin-browser.cjs
      - run: node tests/pet-sync-chat-browser.cjs
      - run: node tests/pet-sync-chat-browser.cjs
        env:
          MOBILE: '1'
      - run: node tests/pet-care-reaction-browser.cjs
      - run: node tests/pet-care-reaction-browser.cjs
        env:
          MOBILE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-reaction-screenshots
          path: feed-*.png
