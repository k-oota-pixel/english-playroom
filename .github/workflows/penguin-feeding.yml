name: Penguin feeding
on:
  push:
    paths:
      - pet-art.js
      - pet-care-animation.js
      - tests/pet-penguin-feeding-browser.cjs
      - .github/workflows/penguin-feeding.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feeding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/pet-penguin-feeding-browser.cjs
