name: Remove morning glory and keep pet only

on:
  push:
    paths:
      - '.github/workflows/remove-morning-glory.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove morning glory feature
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove morning-glory CSS.
          s, n = re.subn(r'\n\.grow-card\{.*?\.grow-bar>i\{.*?\}\n', '\n', s, count=1, flags=re.S)
          assert n == 1, 'morning glory CSS block not found'
          s = s.replace('.pet-card,.grow-card{', '.pet-card{')
          s = s.replace('.pet-visual-wrap,.grow-img-wrap{', '.pet-visual-wrap{')
          s = re.sub(r'\.grow-img\{[^}]*\}', '', s)
          s = s.replace('.pet-title strong,.grow-title strong{', '.pet-title strong{')
          s = s.replace('.pet-days,.grow-days{', '.pet-days{')
          s = s.replace('.pet-status,.grow-status{', '.pet-status{')
          s = re.sub(r'\n\.grow-sync\{[^}]*\}', '', s)

          # Remove the morning-glory card.
          s, n = re.subn(r'\n\s*<section class="grow-card".*?</section>\s*', '\n\n', s, count=1, flags=re.S)
          assert n == 1, 'morning glory card not found'

          # Remove the standalone morning-glory local-storage script.
          s, n = re.subn(r'\n<script>\s*\(function\(\)\{.*?window\.morningGloryApp=.*?</script>\s*', '\n', s, count=1, flags=re.S)
          assert n == 1, 'morning glory script not found'

          # Remove morning-glory Firebase wiring and keep a pet-only shared date helper.
          s = s.replace('const glory=window.morningGloryApp;\n', '')
          s = s.replace('function growthRef(user){\n  return doc(db,"users",user.uid,"apps","english-playroom");\n}',
                        'function petRef(user){\n  return doc(db,"users",user.uid,"apps","english-playroom");\n}')
          s, n = re.subn(r'async function syncGrowth\(user\)\{.*?\n\}\n\nfunction renderPet', 'function renderPet', s, count=1, flags=re.S)
          assert n == 1, 'syncGrowth block not found'

          date_helper = '''function localDateKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
'''
          marker = 'function petRef(user){'
          assert marker in s, 'petRef marker not found'
          s = s.replace(marker, date_helper + marker, 1)
          s = s.replace('glory.localDateKey()', 'localDateKey()')
          s = s.replace('const ref=growthRef(user);', 'const ref=petRef(user);')

          # Login/logout errors now report in the pet area.
          s = s.replace('glory.render(glory.readLocal().days||1,loginErrorMessage(err));', 'petStatus.textContent=loginErrorMessage(err);')
          s = s.replace('glory.render(glory.readLocal().days||1,"ログアウトできませんでした。");', 'petStatus.textContent="ログアウトできませんでした。";')

          # Logged-out state no longer maintains a separate plant record.
          s = s.replace('    const local=glory.ensureTodayLocal();\n    glory.render(local.days,"この端末に保存中。Googleログインすると端末間で同期できます。");\n', '')

          # Logged-in state syncs only the pet.
          s = s.replace('    await syncGrowth(user);\n    await syncPet(user);\n    await refreshDashboard(user);',
                        '    setAuthUI("busy",shortName(user),"ペット同期中");\n    await syncPet(user);\n    await refreshDashboard(user);\n    setAuthUI("ok",shortName(user),"クラウド同期済み");')
          s = s.replace('    const local=glory.ensureTodayLocal();\n    glory.render(local.days,"ログイン済みですがクラウド同期に失敗しました。Firestoreのルールを確認してください。");',
                        '    petStatus.textContent="ログイン済みですがクラウド同期に失敗しました。Firestoreのルールを確認してください。";')

          # Guard against leaving plant code/UI behind.
          for token in ['morningGlory', 'morning-glory', 'grow-card', 'アサガオ', 'growthRef', 'syncGrowth']:
              assert token not in s, f'leftover token: {token}'

          p.write_text(s, encoding='utf-8')
          PY
          git rm -f images/morning-glory-*.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove morning glory and focus on pet system"
          git push
