name: Update boss HP MP regression text
on:
  push:
    paths:
      - '.github/workflows/update-boss-heal-test.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update boss recovery assertion
        run: sed -i 's|/HP全回復/|/HP・MP全回復/|' tests/adventure-selection-browser.cjs
      - name: Commit test update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/adventure-selection-browser.cjs
          git commit -m "Test boss HP and MP full recovery"
          git push
