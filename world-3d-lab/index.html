<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MONSTA WORLD LAB | 3D試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142a32;color:#f6f7ed;font:14px system-ui,sans-serif;overflow:hidden}#view{position:absolute;inset:0;touch-action:none}canvas{display:block}header{position:absolute;top:14px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;gap:8px}header>div{background:#193238ed;border:1px solid #fff2;border-radius:16px;padding:10px 16px;box-shadow:0 5px 20px #0003}h1{font-size:19px;letter-spacing:1.5px;margin:0;color:#ffe8ae}small{color:#c1d7cb}#panel{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:#132d32ef;border:1px solid #fff3;border-radius:18px;padding:12px;box-shadow:0 8px 30px #0005}#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}button{font:inherit;color:#fff;background:#365355;border:1px solid #fff2;border-radius:10px;padding:9px 13px;cursor:pointer;touch-action:manipulation;user-select:none}button.active{background:#f0d58d;color:#26392e;border-color:#fff4cc}button:active{transform:scale(.97)}#hint{text-align:center;color:#d0e1d7;font-size:12px;margin-top:9px;min-height:17px}#camera{position:absolute;right:14px;top:87px;display:grid;gap:5px}#camera button{background:#183336e8;min-width:43px;font-size:19px;padding:7px}#dpad{position:absolute;left:14px;bottom:148px;display:grid;grid-template-columns:repeat(3,39px);gap:4px;touch-action:none}#dpad button{padding:8px;background:#173436c9;font-size:17px}#dpad .up{grid-column:2}#dpad .left{grid-column:1}#status{font-size:12px;white-space:nowrap}#err{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:30px;z-index:2}#err[hidden]{display:none}@media(max-width:520px){header>div{padding:8px 10px}h1{font-size:15px}#panel{bottom:10px;padding:8px}button{padding:8px 9px}#dpad{bottom:174px}#status{font-size:10px}#camera{top:78px}#hint{font-size:11px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script></head>
<body><div id="view"></div><header><div><h1>MONSTA WORLD LAB</h1><small>3D ワールド試作 • 30 × 30</small><small id="pet-profile" style="display:block;margin-top:3px">ぺっとを確認中…</small></div><div id="status">読み込み中…</div></header><div id="camera"><button data-cam="-1" aria-label="左回転">↶</button><button data-cam="1" aria-label="右回転">↷</button><button data-zoom="1" aria-label="拡大">＋</button><button data-zoom="-1" aria-label="縮小">−</button><button id="home" aria-label="視点リセット">⌂</button></div>
<div id="dpad"><button class="up" data-key="w">▲</button><button class="left" data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
<div id="panel"><div id="tools"><button data-tool="walk" class="active">🐾 移動</button><button data-tool="house">🏠 家</button><button data-tool="tree">🌳 木</button><button data-tool="road">🟫 道</button><button data-tool="pond">💧 池</button><button data-tool="flower">🌷 花</button><button data-tool="erase">✕ 撤去</button><button id="reset">初期化</button></div><div id="hint">左クリック：移動 / 左ドラッグ：平行移動 / 右ドラッグ：回転 / WASD・矢印キー</div></div><div id="err">3D ワールドを読み込んでいます…</div>
<script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s), N=30, half=N/2, store='monsta-world-lab-v1', scene=new T.Scene();scene.background=new T.Color(0xb7d9e2);scene.fog=new T.Fog(0xb7d9e2,55,110);
let renderer;try{renderer=new T.WebGLRenderer({antialias:true, powerPreference:'low-power'});}catch(e){$('#err').textContent='この端末ではWebGL 3Dを開始できません。';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;$('#view').append(renderer.domElement);
const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,150);camera.position.set(25,28,27);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=.12;controls.minDistance=8;controls.maxDistance=65;controls.maxPolarAngle=Math.PI*.46;controls.minPolarAngle=.2;controls.enablePan=true;controls.screenSpacePanning=false;controls.mouseButtons={LEFT:T.MOUSE.PAN,MIDDLE:T.MOUSE.DOLLY,RIGHT:T.MOUSE.ROTATE};controls.update();renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());
scene.add(new T.HemisphereLight(0xfff8dc,0x59735a,2.1));const sun=new T.DirectionalLight(0xffe6b1,2.5);sun.position.set(-16,30,12);sun.castShadow=true;Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:65});sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0005;scene.add(sun);
const mat=c=>new T.MeshStandardMaterial({color:c,roughness:.9});const mats={grass:mat(0x9cbd71),earth:mat(0x687d44),wood:mat(0x805235),wall:mat(0xffe1aa),roof:mat(0xc46a4d),leaf:mat(0x568b4f),leaf2:mat(0x77a960),road:mat(0xd4bb8b),water:new T.MeshStandardMaterial({color:0x64bfd5,roughness:.3,metalness:.1}),stone:mat(0xb8b6a1),pink:mat(0xee879c),white:mat(0xfff3dc),dark:mat(0x263b3d),blue:mat(0x6196be)};
function mesh(g,m,x=0,y=0,z=0){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;return o}
const box=(w,h,d,m,x=0,y=0,z=0)=>mesh(new T.BoxGeometry(w,h,d),m,x,y,z);
const sphere=(r,m,x,y,z)=>mesh(new T.SphereGeometry(r,12,8),m,x,y,z);
const ground=box(N,.35,N,mats.grass,0,-.19,0);scene.add(ground);const base=box(N+.12,.8,N+.12,mats.earth,0,-.76,0);scene.add(base);
const grid=new T.GridHelper(N,N,0x779454,0x8cab65);grid.position.y=.005;grid.material.transparent=true;grid.material.opacity=.48;scene.add(grid);
const tiles=new Map(), group=new T.Group();scene.add(group);const id=(x,z)=>x+','+z, world=i=>i-half+.5, cell=v=>Math.floor(v+half), inside=(x,z)=>x>=0&&z>=0&&x<N&&z<N;
function model(type){const g=new T.Group();if(type==='house'){
g.add(box(.82,.92,.78,mats.wall,0,.46,0),box(.88,.12,.84,mats.stone,0,.06,0));
const shape=new T.Shape();shape.moveTo(-.53,0);shape.lineTo(.53,0);shape.lineTo(0,.5);shape.closePath();const roof=mesh(new T.ExtrudeGeometry(shape,{depth:1.01,bevelEnabled:false}),mats.roof,0,.91,-.505);g.add(roof,box(.15,.42,.17,mats.stone,.28,1.18,-.22),box(.23,.45,.025,mats.wood,0,.28,.405),box(.19,.21,.035,mats.blue,-.26,.58,.41),box(.19,.21,.035,mats.blue,.26,.58,.41));
}else if(type==='tree'){g.add(mesh(new T.CylinderGeometry(.075,.11,.65,8),mats.wood,0,.32,0),mesh(new T.IcosahedronGeometry(.42,1),mats.leaf,0,.85,0),mesh(new T.IcosahedronGeometry(.29,0),mats.leaf2,.14,1.13,-.07));
}else if(type==='road'){g.add(box(1,.035,1,mats.road,0,.015,0));
}else if(type==='pond'){g.add(box(.98,.04,.98,mats.stone,0,.025,0),box(.88,.045,.88,mats.water,0,.05,0));}
else if(type==='flower'){for(const [x,z] of [[-.22,-.2],[.22,.12],[-.12,.27]]){g.add(box(.035,.19,.035,mats.leaf,x,.095,z),sphere(.09,mats.pink,x,.22,z),sphere(.04,mats.white,x,.28,z));}}
return g}
const solid=t=>['house','tree','pond'].includes(t), blocked=(x,z)=>!inside(x,z)||solid(tiles.get(id(x,z))?.type);
function setTile(x,z,type){const k=id(x,z),old=tiles.get(k);if(old){group.remove(old.obj);old.obj.traverse(o=>{if(o.isMesh)o.geometry.dispose()});tiles.delete(k)}if(type){let obj=model(type);obj.position.set(world(x),0,world(z));group.add(obj);tiles.set(k,{x,z,type,obj})}}
const seed=[['house',12,11],['house',17,11],['house',12,18],['house',17,18],['tree',10,12],['tree',19,12],['tree',10,18],['tree',20,18],['pond',19,15],['pond',20,15],['pond',19,16],['pond',20,16],['flower',13,12],['flower',16,12],['flower',13,18],['flower',16,18]];for(let i=8;i<22;i++){seed.push(['road',i,14],['road',i,15]);if(i!==14&&i!==15){seed.push(['road',14,i],['road',15,i])}}
function initial(){for(const [t,x,z] of seed)setTile(x,z,t)}
try{const saved=JSON.parse(localStorage.getItem(store)||'null');if(Array.isArray(saved)){for(const v of saved){if(inside(v.x,v.z)&&['house','tree','road','pond','flower'].includes(v.type))setTile(v.x,v.z,v.type)}}else initial()}catch{initial()}
function save(){try{localStorage.setItem(store,JSON.stringify([...tiles.values()].map(({x,z,type})=>({x,z,type}))))}catch{}}
const player=new T.Group();scene.add(player);const pet=new T.Group();player.add(pet);
const fur=mat(0xf8d69c),ear=mat(0xe9a56f);pet.add(sphere(.27,fur,0,.32,0),sphere(.23,fur,0,.57,.09));for(const s of [-1,1]){const e=sphere(.11,ear,s*.15,.76,.04);e.scale.set(.65,1.5,.7);pet.add(e,sphere(.043,mats.dark,s*.09,.61,.287),sphere(.09,fur,s*.14,.10,.08))}pet.add(sphere(.042,mats.wood,0,.53,.31));player.position.set(world(15),0,world(15));
if(blocked(15,15)){outer:for(let z=0;z<N;z++)for(let x=0;x<N;x++)if(!blocked(x,z)){player.position.set(world(x),0,world(z));break outer}}
const highlight=mesh(new T.BoxGeometry(.96,.025,.96),new T.MeshBasicMaterial({color:0xffed9b,transparent:true,opacity:.65}),0,.075,0);highlight.castShadow=false;highlight.receiveShadow=false;highlight.visible=false;scene.add(highlight);
const ray=new T.Raycaster(), pt=new T.Vector2(), plane=new T.Plane(new T.Vector3(0,1,0),0);
function hit(e){const r=renderer.domElement.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pt,camera);const p=new T.Vector3();if(!ray.ray.intersectPlane(plane,p))return null;const x=cell(p.x),z=cell(p.z);return inside(x,z)?{x,z}:null}
let tool='walk',path=[],keys=new Set(),message='',msgTime=0;
const hints={walk:'左クリック：移動 / 左ドラッグ：平行移動 / 右ドラッグ：回転 / WASD・矢印キー',house:'空きマスをクリックして家を建てる',tree:'空きマスをクリックして木を植える',road:'空きマスをクリックして道路を敷く',pond:'空きマスをクリックして池をつくる',flower:'空きマスをクリックして花を植える',erase:'設置物をクリックして撤去'};
function notify(s){message=s;msgTime=performance.now()+2200;$('#hint').textContent=s}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));$('#hint').textContent=hints[tool];msgTime=0});
function route(x,z){if(blocked(x,z)){notify('そこには移動できません');return}const sx=cell(player.position.x),sz=cell(player.position.z),start=id(sx,sz),end=id(x,z),q=[[sx,sz]],prev=new Map([[start,null]]);for(let i=0;i<q.length;i++){const [a,b]=q[i];if(id(a,b)===end)break;for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){const c=a+dx,d=b+dz,k=id(c,d);if(!blocked(c,d)&&!prev.has(k)){prev.set(k,id(a,b));q.push([c,d])}}}if(!prev.has(end)){notify('道がつながっていません');return}let list=[],k=end;while(k!==start){const [a,b]=k.split(',').map(Number);list.push(new T.Vector3(world(a),0,world(b)));k=prev.get(k)}path=list.reverse();if(!path.length)path.push(new T.Vector3(world(x),0,world(z)));else if(Math.abs(player.position.x-world(sx))>.07||Math.abs(player.position.z-world(sz))>.07)path.unshift(new T.Vector3(world(sx),0,world(sz)))}
let down=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.button===0)down={x:e.clientX,y:e.clientY,id:e.pointerId,drag:false};else down=null});
renderer.domElement.addEventListener('pointermove',e=>{if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>7)down.drag=true;const p=hit(e);highlight.visible=!!p&&tool!=='walk';if(p){highlight.position.set(world(p.x),.075,world(p.z));highlight.material.color.set(tool==='erase'?0xff8c79:tiles.has(id(p.x,p.z))?0xffa083:0xffed9b)}});
renderer.domElement.addEventListener('pointercancel',()=>down=null);renderer.domElement.addEventListener('pointerleave',()=>highlight.visible=false);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||down.id!==e.pointerId||down.drag||Math.hypot(e.clientX-down.x,e.clientY-down.y)>7){down=null;return}down=null;const p=hit(e);if(!p)return;const {x,z}=p;if(tool==='walk'){route(x,z);return}if(tool==='erase'){if(tiles.has(id(x,z))){setTile(x,z,null);save()}return}if(tiles.has(id(x,z))){notify('先に設置物を撤去してください');return}if(solid(tool)&&(Math.abs(player.position.x-world(x))<.8&&Math.abs(player.position.z-world(z))<.8)){notify('ぺっとから少し離して設置してください');return}setTile(x,z,tool);path=[];save()});
const keymap={arrowup:'w',arrowdown:'s',arrowleft:'a',arrowright:'d'};addEventListener('keydown',e=>{let k=keymap[e.key.toLowerCase()]||e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1){keys.add(k);path=[];e.preventDefault()}});addEventListener('keyup',e=>keys.delete(keymap[e.key.toLowerCase()]||e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k);path=[]};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>keys.delete(k)});
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{const d=camera.position.clone().sub(controls.target);d.applyAxisAngle(new T.Vector3(0,1,0),Number(b.dataset.cam)*Math.PI/6);camera.position.copy(controls.target).add(d);controls.update()});
document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{const d=camera.position.clone().sub(controls.target);d.setLength(T.MathUtils.clamp(d.length()*(b.dataset.zoom==='1'?.78:1.28),8,65));camera.position.copy(controls.target).add(d);controls.update()});
$('#home').onclick=()=>{camera.position.set(25,28,27);controls.target.set(0,0,0);controls.update()};
$('#reset').onclick=()=>{if(!confirm('配置を初期状態に戻しますか？'))return;for(const v of [...tiles.values()])setTile(v.x,v.z,null);initial();path=[];keys.clear();player.position.set(world(15),0,world(15));save()};
function clearAt(x,z){for(const a of [-.19,.19])for(const b of [-.19,.19])if(blocked(cell(x+a),cell(z+b)))return false;return true}
function move(dx,dz){const p=player.position;let moving=false;if(Math.abs(dx)>1e-6&&clearAt(p.x+dx,p.z)){p.x+=dx;moving=true}if(Math.abs(dz)>1e-6&&clearAt(p.x,p.z+dz)){p.z+=dz;moving=true}if(moving)player.rotation.y=Math.atan2(dx,dz);return moving}
let last=performance.now();function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;let moving=false;
if(keys.size){const f=controls.target.clone().sub(camera.position);f.y=0;f.normalize();const r=new T.Vector3(-f.z,0,f.x);const v=new T.Vector3();if(keys.has('w'))v.add(f);if(keys.has('s'))v.sub(f);if(keys.has('d'))v.add(r);if(keys.has('a'))v.sub(r);if(v.lengthSq()){v.normalize().multiplyScalar(3.4*dt);moving=move(v.x,v.z)}}else if(path.length){const target=path[0],d=target.clone().sub(player.position),len=d.length(),step=3.4*dt;if(len<Math.max(step,.015)){if(clearAt(target.x,target.z))player.position.copy(target);path.shift();moving=true}else{d.multiplyScalar(step/len);moving=move(d.x,d.z);if(!moving)path=[]}}
pet.position.y=moving?Math.abs(Math.sin(now*.013))*.065:0;controls.update();renderer.render(scene,camera);$('#status').textContent='設置 '+tiles.size+' ｜ '+(cell(player.position.x)+1)+', '+(cell(player.position.z)+1);if(msgTime&&now>msgTime){$('#hint').textContent=hints[tool];msgTime=0}}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});$('#err').hidden=true;requestAnimationFrame(frame);import('../lab-pet-actor.js?v=1').then(m=>m.loadLabPet(T,pet,s=>{$('#pet-profile').textContent=s})).catch(e=>{console.warn('Lab pet load failed',e);$('#pet-profile').textContent='ぺっと取得失敗｜デモ表示'});
</script></body></html>
