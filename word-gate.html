<!doctype html>
<html lang="ja">
<head>
<style id="monstudy-access-lock">html:before{content:"ログインを確認しています…";position:fixed;inset:0;display:grid;place-content:center;background:#eef5f2;color:#173d35;font:16px system-ui}body{visibility:hidden!important}</style>
<script type="module" src="https://k-oota-pixel.github.io/english-playroom/access-gate.js?v=2.4.37"></script>
<script src="./shell-bridge.js?v=2.1.1"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#142c3b">
<title>WORD GATE | もんすたでぃ</title>
<style>
:root{color-scheme:dark;--ink:#f7fbff;--muted:#b9cad5;--glass:rgba(8,25,38,.78);--line:rgba(255,255,255,.16);--ok:#6cf5aa;--bad:#ff7784;--gold:#ffd65c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#06131c;color:var(--ink);overscroll-behavior:none}button{font:inherit}.app{min-height:100dvh;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 10%,#204d65 0,#0e2433 38%,#06131c 76%)}
.game-shell{width:min(100%,900px);height:min(94dvh,880px);min-height:620px;position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:#102a38;box-shadow:0 28px 80px rgba(0,0,0,.42);isolation:isolate}.game-shell.shake{animation:shake .34s ease}.game-shell.win{box-shadow:0 0 80px rgba(255,214,92,.35),0 28px 80px rgba(0,0,0,.42)}
.scene{position:absolute;inset:0;background:linear-gradient(#3f87a5 0 34%,#6f9b86 34% 47%,#284c3a 47% 100%);overflow:hidden}.scene:before{content:"";position:absolute;left:50%;top:34%;width:132%;height:72%;transform:translateX(-50%);clip-path:polygon(43% 0,57% 0,88% 100%,12% 100%);background:linear-gradient(90deg,#26313a 0 48%,#151d23 48% 52%,#26313a 52% 100%);box-shadow:inset 0 0 0 6px rgba(255,255,255,.08)}
.horizon{position:absolute;left:50%;top:32%;width:120%;height:24%;transform:translateX(-50%);background:repeating-linear-gradient(90deg,transparent 0 12%,rgba(20,48,37,.65) 12% 14%,transparent 14% 25%);opacity:.7;filter:blur(.5px)}
.road-lines{position:absolute;left:50%;top:42%;width:84%;height:64%;transform:translateX(-50%);clip-path:polygon(43% 0,57% 0,95% 100%,5% 100%);background:repeating-linear-gradient(180deg,transparent 0 8%,rgba(255,255,255,.38) 8% 10%,transparent 10% 20%);animation:road 1.05s linear infinite;opacity:.55}.paused .road-lines{animation-play-state:paused}
.cloud{position:absolute;width:95px;height:28px;border-radius:999px;background:rgba(255,255,255,.55);filter:blur(.3px)}.cloud:after,.cloud:before{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:42px;height:42px;left:18px;bottom:3px}.cloud:after{width:54px;height:54px;right:13px;bottom:2px}.cloud.c1{top:12%;left:8%;transform:scale(.8)}.cloud.c2{top:20%;right:6%;transform:scale(.56);opacity:.65}
.hud{position:absolute;z-index:20;left:14px;right:14px;top:14px;display:grid;grid-template-columns:1fr auto;gap:10px;pointer-events:none}.question-card,.power-card{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.18)}.question-card{border-radius:18px;padding:12px 16px}.question-top{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:12px;font-weight:900;letter-spacing:.08em;color:#d8e8ef}.question-top span:last-child{margin-left:auto;color:var(--gold)}#question{font-size:clamp(16px,2.5vw,23px);font-weight:850;line-height:1.32;min-height:2.64em;display:flex;align-items:center}.power-card{min-width:104px;border-radius:18px;padding:11px 14px;text-align:center}.power-card small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:900}.power-card strong{display:block;font-size:25px;color:var(--gold);line-height:1.1}.meter{height:5px;border-radius:999px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#69e7ff,#ffe766);transition:width .35s ease}
.gates{position:absolute;z-index:8;left:50%;top:43%;width:min(74%,650px);transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:16%;perspective:700px}.gate{appearance:none;min-height:128px;border:4px solid rgba(200,241,255,.8);border-radius:18px 18px 8px 8px;background:linear-gradient(180deg,rgba(31,147,199,.66),rgba(4,54,88,.78));color:white;padding:14px 8px;display:grid;place-content:center;text-align:center;font-weight:950;font-size:clamp(15px,2.5vw,24px);line-height:1.15;box-shadow:0 0 28px rgba(77,206,255,.2),inset 0 0 24px rgba(255,255,255,.08);text-shadow:0 2px 5px rgba(0,0,0,.35);cursor:pointer;transform:scale(.82) rotateX(-3deg);transition:transform .2s,filter .2s,background .2s,border-color .2s}.gate:hover,.gate:focus-visible{transform:scale(.87) rotateX(-3deg);filter:brightness(1.12);outline:none}.gate:disabled{cursor:default}.gate.correct{background:rgba(25,166,89,.84);border-color:#a7ffd0;filter:brightness(1.25)}.gate.wrong{background:rgba(180,35,48,.85);border-color:#ffadb4;filter:saturate(.8)}.gate kbd{position:absolute;top:-13px;background:#091c28;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 9px;font-size:10px;color:#cfe0ea}.gate.left kbd{left:8px}.gate.right kbd{right:8px}
.pet-wrap{position:absolute;z-index:12;left:50%;bottom:8%;width:150px;height:150px;transform:translateX(-50%);transition:left .28s cubic-bezier(.2,.8,.2,1),transform .28s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 12px 8px rgba(0,0,0,.3))}.pet-wrap.lane-left{left:31%;transform:translateX(-50%) rotate(-4deg)}.pet-wrap.lane-right{left:69%;transform:translateX(-50%) rotate(4deg)}.pet-visual{width:100%;height:100%;display:grid;place-items:end center;animation:runbob .34s ease-in-out infinite alternate}.pet-visual svg{width:100%!important;height:100%!important;max-width:150px!important;max-height:150px!important}.pet-visual .runner-egg{font-size:74px;line-height:1}.pet-shadow{position:absolute;left:22%;right:22%;bottom:-3px;height:13px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(3px);animation:shadowbob .34s ease-in-out infinite alternate}
.feedback{position:absolute;z-index:18;left:50%;top:64%;transform:translate(-50%,-50%) scale(.8);font-size:clamp(28px,7vw,58px);font-weight:1000;letter-spacing:.04em;text-shadow:0 5px 18px rgba(0,0,0,.45);opacity:0;pointer-events:none}.feedback.show{animation:pop .72s ease}.feedback.ok{color:#a9ffd1}.feedback.bad{color:#ffb0b8}
.boss{position:absolute;z-index:9;left:50%;top:34%;transform:translate(-50%,-50%) scale(.1);opacity:0;text-align:center;pointer-events:none}.boss.show{animation:bossin .75s cubic-bezier(.2,.9,.2,1) forwards}.boss .monster{font-size:clamp(92px,20vw,180px);filter:drop-shadow(0 18px 16px rgba(0,0,0,.38))}.boss .boss-label{font-size:12px;font-weight:1000;letter-spacing:.16em;color:#ffb85c;background:rgba(47,12,8,.76);border:1px solid rgba(255,178,92,.45);border-radius:999px;padding:5px 11px;display:inline-block}.boss-hp{width:min(260px,62vw);height:12px;border-radius:999px;background:#290d11;border:1px solid rgba(255,255,255,.2);overflow:hidden;margin:6px auto}.boss-hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff625f,#ffb359);transition:width .65s ease}.blast{position:absolute;z-index:11;left:50%;top:48%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;background:#fff6a0;box-shadow:0 0 20px #fff,0 0 60px #ffd43b}.blast.fire{animation:blast .75s ease-out forwards}
.overlay{position:absolute;z-index:50;inset:0;display:grid;place-items:center;padding:20px;background:rgba(3,13,20,.74);backdrop-filter:blur(10px)}.overlay[hidden]{display:none}.panel{width:min(100%,560px);max-height:90%;overflow:auto;border:1px solid rgba(255,255,255,.16);border-radius:26px;padding:24px;background:linear-gradient(160deg,rgba(16,48,63,.96),rgba(7,25,36,.97));box-shadow:0 24px 80px rgba(0,0,0,.45)}.kicker{font-size:11px;font-weight:950;letter-spacing:.16em;color:#8bdfff}.panel h1,.panel h2{margin:.25em 0 .4em;line-height:1.1}.panel p{color:#c9d7df;line-height:1.6}.grade-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.grade-btn{border:1px solid rgba(255,255,255,.15);border-radius:13px;background:#14374a;color:#e6f2f8;padding:11px 4px;font-weight:900;cursor:pointer}.grade-btn.selected{background:#e7f8ff;color:#0b3041;border-color:#fff;box-shadow:0 0 0 3px rgba(110,217,255,.18)}.primary{width:100%;border:0;border-radius:16px;padding:14px 16px;background:linear-gradient(135deg,#78e4ff,#8dffb7);color:#072736;font-weight:1000;font-size:17px;cursor:pointer;box-shadow:0 12px 28px rgba(55,218,214,.18)}.primary:disabled{opacity:.45;cursor:wait}.subaction{display:block;margin:14px auto 0;color:#b9d8e7;text-decoration:none;text-align:center;font-size:13px}.status{min-height:1.5em;font-size:13px;color:#a9bac4;text-align:center;margin-top:10px}.result-score{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.result-score div{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;text-align:center}.result-score small{display:block;color:#a7bac5;font-weight:800}.result-score strong{font-size:28px;color:var(--gold)}.misses{display:grid;gap:8px;margin:16px 0}.miss{border-left:4px solid #ff7a86;background:rgba(255,255,255,.05);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45}.miss b{color:#ffd0d4}.help{font-size:12px;color:#a9bac4;text-align:center;margin:10px 0 0}.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:white;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}
@keyframes road{to{background-position:0 105px}}@keyframes runbob{to{transform:translateY(-8px)}}@keyframes shadowbob{to{transform:scale(.8);opacity:.55}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(.9)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes bossin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes blast{0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}45%{opacity:1;transform:translate(-50%,-50%) scale(4)}100%{opacity:0;transform:translate(-50%,-50%) scale(11)}}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:620px){.app{padding:0}.game-shell{height:100dvh;min-height:560px;border-radius:0;border:0}.hud{left:8px;right:8px;top:8px}.question-card{padding:10px 12px}.power-card{min-width:82px;padding:10px 8px}.power-card strong{font-size:21px}.gates{width:86%;gap:9%;top:44%}.gate{min-height:112px;padding:12px 5px}.pet-wrap{width:125px;height:125px;bottom:8%}.grade-grid{grid-template-columns:repeat(3,1fr)}.panel{padding:20px 16px}.cloud{display:none}}
@media(prefers-reduced-motion:reduce){.road-lines,.pet-visual,.pet-shadow{animation:none!important}}
</style>
</head>
<body>
<main class="app">
<section class="game-shell paused" id="gameShell" aria-label="WORD GATE 英検ランナー">
  <div class="scene" aria-hidden="true"><div class="horizon"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="road-lines"></div></div>
  <div class="hud">
    <div class="question-card"><div class="question-top"><span id="gradeLabel">EIKEN</span><span id="progressLabel">0 / 10</span><span id="scoreLabel">0 CORRECT</span></div><div id="question">英検問題を読み込んでいます…</div></div>
    <div class="power-card"><small>POWER</small><strong id="powerLabel">0</strong><div class="meter"><i id="powerMeter"></i></div></div>
  </div>
  <div class="gates" id="gates" hidden>
    <button class="gate left" id="leftGate" type="button"><kbd>←</kbd><span></span></button>
    <button class="gate right" id="rightGate" type="button"><kbd>→</kbd><span></span></button>
  </div>
  <div class="boss" id="boss"><div class="boss-label">FINAL BOSS</div><div class="monster">👹</div><div class="boss-hp"><i id="bossHp"></i></div></div>
  <div class="blast" id="blast"></div>
  <div class="pet-wrap" id="petWrap"><div class="pet-shadow"></div><div class="pet-visual" id="petVisual">🐾</div></div>
  <div class="feedback" id="feedback"></div>

  <div class="overlay" id="startOverlay">
    <section class="panel">
      <span class="kicker">PET × EIKEN RUNNER</span>
      <h1>WORD GATE <small style="font-size:.45em;color:#8bdfff">試作版</small></h1>
      <p>ペットと走って、正しい答えのゲートを突破しよう。10問のPOWERをためて、最後の敵を倒せ！</p>
      <div class="grade-grid" id="gradeGrid" aria-label="英検級を選ぶ"></div>
      <button class="primary" id="startBtn" type="button" disabled><span class="loading"></span>準備中…</button>
      <div class="status" id="loadStatus">ペットと英検問題を読み込んでいます</div>
      <p class="help">スマホ：左右のゲートをタップ ／ PC：← → キー</p>
      <a class="subaction" href="./">← もんすたでぃへ戻る</a>
    </section>
  </div>

  <div class="overlay" id="resultOverlay" hidden>
    <section class="panel">
      <span class="kicker" id="resultKicker">RUN COMPLETE</span><h2 id="resultTitle">結果</h2><p id="resultMessage"></p>
      <div class="result-score"><div><small>CORRECT</small><strong id="resultCorrect">0 / 10</strong></div><div><small>POWER</small><strong id="resultPower">0</strong></div></div>
      <div class="misses" id="misses"></div>
      <button class="primary" id="retryBtn" type="button">もう一度走る</button>
      <a class="subaction" href="./">← もんすたでぃへ戻る</a>
    </section>
  </div>
</section>
</main>
<script type="module">
import {getDoc} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {auth,authReady,walletRef} from './coin-reward.js?v=2.1.11';
import {renderPetSVG} from './pet-art.js?v=2.1.49';
import {validPetName,normalizePetName} from './pet-model.js';

const RETRY_URL='https://k-oota-pixel.github.io/eiken-retry/';
const GRADES=['4級','3級','準2級','2級','準1級'];
const FALLBACK=[
 {id:'wg4',grade:'4級',question:'I (____) tennis every Sunday.',choices:[{number:1,text:'play'},{number:2,text:'plays'},{number:3,text:'playing'},{number:4,text:'played'}],answer_number:1},
 {id:'wg3',grade:'3級',question:'My sister is good (____) cooking.',choices:[{number:1,text:'at'},{number:2,text:'to'},{number:3,text:'for'},{number:4,text:'by'}],answer_number:1},
 {id:'wgp2',grade:'準2級',question:'I was tired, so I decided (____) home early.',choices:[{number:1,text:'go'},{number:2,text:'going'},{number:3,text:'to go'},{number:4,text:'went'}],answer_number:3},
 {id:'wg2',grade:'2級',question:'The new system will (____) us to work more efficiently.',choices:[{number:1,text:'enable'},{number:2,text:'prevent'},{number:3,text:'refuse'},{number:4,text:'avoid'}],answer_number:1},
 {id:'wgp1',grade:'準1級',question:'The committee decided to (____) the proposal until more data became available.',choices:[{number:1,text:'defer'},{number:2,text:'derive'},{number:3,text:'deter'},{number:4,text:'devise'}],answer_number:1}
];
const $=id=>document.getElementById(id);
const els={shell:$('gameShell'),question:$('question'),grade:$('gradeLabel'),progress:$('progressLabel'),score:$('scoreLabel'),power:$('powerLabel'),meter:$('powerMeter'),gates:$('gates'),left:$('leftGate'),right:$('rightGate'),petWrap:$('petWrap'),pet:$('petVisual'),feedback:$('feedback'),boss:$('boss'),bossHp:$('bossHp'),blast:$('blast'),startOverlay:$('startOverlay'),gradeGrid:$('gradeGrid'),startBtn:$('startBtn'),loadStatus:$('loadStatus'),resultOverlay:$('resultOverlay'),resultKicker:$('resultKicker'),resultTitle:$('resultTitle'),resultMessage:$('resultMessage'),resultCorrect:$('resultCorrect'),resultPower:$('resultPower'),misses:$('misses'),retry:$('retryBtn')};
let bank=[],selectedGrade='3級',run=[],index=0,score=0,power=0,misses=[],busy=true,current=null,petName='MY PET';

function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cleanQuestion(value){return escapeHtml(String(value||'').replace(/\(\s*_{2,}\s*\)|_{2,}|\(\s*\.{3,}\s*\)/g,'（　）'));}
function installGrades(){els.gradeGrid.replaceChildren();for(const grade of GRADES){const b=document.createElement('button');b.type='button';b.className='grade-btn'+(grade===selectedGrade?' selected':'');b.textContent=grade;b.addEventListener('click',()=>{selectedGrade=grade;[...els.gradeGrid.children].forEach(x=>x.classList.toggle('selected',x===b));});els.gradeGrid.appendChild(b);}}

async function loadQuestions(){
 try{const response=await fetch(RETRY_URL,{cache:'force-cache'});if(!response.ok)throw Error(`HTTP ${response.status}`);const html=await response.text();const doc=new DOMParser().parseFromString(html,'text/html');const raw=doc.getElementById('question-data')?.textContent;if(!raw)throw Error('question-data not found');const parsed=JSON.parse(raw).filter(q=>q&&q.id&&GRADES.includes(q.grade)&&q.question&&Array.isArray(q.choices)&&q.choices.length>=4&&Number(q.answer_number)>0);if(parsed.length<20)throw Error('question bank too small');bank=parsed;return true;}catch(error){console.warn('WORD GATE question fallback',error);bank=FALLBACK;return false;}
}
function petMarkup(data){if(!data?.petHatched)return '<span class="runner-egg" role="img" aria-label="ふしぎなたまご">🥚</span>';const juvenile=data.petAdult===false||!data.petAppearance;try{return renderPetSVG(juvenile?null:data.petAppearance,{...data.petShop,equipped:{...data.petShop?.equipped,'pet-frame':''}},juvenile?'baby':'adult',{background:false});}catch(error){console.warn('WORD GATE pet fallback',error);return '🐾';}}
async function loadPet(){await authReady;const user=auth.currentUser;if(!user)throw Error('login-required');const snap=await getDoc(walletRef(user));const data=snap.exists()?(snap.data()||{}):{};els.pet.innerHTML=petMarkup(data);const juvenile=data.petAdult===false||!data.petAppearance;petName=!data.petHatched?'ふしぎなたまご':juvenile?'赤ちゃんペット':validPetName(data.petName)?normalizePetName(data.petName):'MY PET';return data;}

function questionForRun(){let pool=shuffle(bank.filter(q=>q.grade===selectedGrade));if(!pool.length)pool=shuffle(bank);const out=[];while(out.length<10){if(!pool.length)pool=shuffle(bank.filter(q=>q.grade===selectedGrade).length?bank.filter(q=>q.grade===selectedGrade):bank);out.push(pool[out.length%pool.length]);if(out.length>=pool.length&&pool.length>=10)break;}return shuffle(out).slice(0,10);}
function twoChoices(q){const correct=q.choices.find(c=>Number(c.number)===Number(q.answer_number))||q.choices[0];const wrongs=q.choices.filter(c=>Number(c.number)!==Number(q.answer_number));const wrong=wrongs[Math.floor(Math.random()*wrongs.length)]||q.choices[1];return shuffle([{text:String(correct.text),correct:true,number:Number(correct.number)},{text:String(wrong.text),correct:false,number:Number(wrong.number)}]);}
function updateHud(){els.grade.textContent=`EIKEN ${selectedGrade}`;els.progress.textContent=`${Math.min(index+1,10)} / 10`;els.score.textContent=`${score} CORRECT`;els.power.textContent=String(power);els.meter.style.width=`${Math.min(100,power)}%`;}
function resetGateState(){for(const gate of [els.left,els.right]){gate.disabled=false;gate.classList.remove('correct','wrong');}els.petWrap.classList.remove('lane-left','lane-right');}
function showQuestion(){busy=false;resetGateState();current=run[index];const choices=twoChoices(current);current._two=choices;els.question.innerHTML=cleanQuestion(current.question);els.left.querySelector('span').textContent=choices[0].text;els.right.querySelector('span').textContent=choices[1].text;els.gates.hidden=false;updateHud();}
function flash(text,ok){els.feedback.textContent=text;els.feedback.className=`feedback ${ok?'ok':'bad'}`;void els.feedback.offsetWidth;els.feedback.classList.add('show');}
function recordMiss(q){const answer=q.choices.find(c=>Number(c.number)===Number(q.answer_number));misses.push({question:String(q.question||''),answer:String(answer?.text||'')});}
function answer(side){if(busy||!current)return;busy=true;const choice=current._two[side];const gates=[els.left,els.right],chosen=gates[side],other=gates[1-side];gates.forEach(g=>g.disabled=true);els.petWrap.classList.add(side===0?'lane-left':'lane-right');if(choice.correct){score++;power=Math.min(100,power+12);chosen.classList.add('correct');flash('CORRECT!',true);}else{power=Math.max(0,power-4);chosen.classList.add('wrong');other.classList.add('correct');recordMiss(current);flash('MISS!',false);els.shell.classList.add('shake');setTimeout(()=>els.shell.classList.remove('shake'),380);}updateHud();setTimeout(()=>{index++;if(index>=run.length)startBoss();else showQuestion();},720);}

function startGame(){run=questionForRun();index=0;score=0;power=0;misses=[];busy=false;current=null;els.startOverlay.hidden=true;els.resultOverlay.hidden=true;els.boss.classList.remove('show');els.bossHp.style.width='100%';els.blast.classList.remove('fire');els.shell.classList.remove('paused','win');els.question.textContent='';showQuestion();}
async function startBoss(){busy=true;els.gates.hidden=true;els.question.textContent='FINAL BOSS！ ためたPOWERを放て！';els.progress.textContent='BOSS';els.petWrap.classList.remove('lane-left','lane-right');els.boss.classList.add('show');await new Promise(r=>setTimeout(r,850));const damage=Math.min(100,20+power);els.blast.classList.remove('fire');void els.blast.offsetWidth;els.blast.classList.add('fire');els.bossHp.style.width=`${100-damage}%`;await new Promise(r=>setTimeout(r,850));const defeated=damage>=100;if(defeated){els.shell.classList.add('win');els.question.textContent=`${petName}の一撃！ ボスを撃破！`;els.boss.style.filter='grayscale(1) brightness(.45)';flash('BOSS CLEAR!',true);}else{els.question.textContent=`あと ${100-damage} POWER分、届かなかった…`;els.shell.classList.add('shake');setTimeout(()=>els.shell.classList.remove('shake'),400);flash('BOSS SURVIVED',false);}await new Promise(r=>setTimeout(r,950));showResult(defeated,damage);}
function showResult(defeated,damage){els.shell.classList.add('paused');els.resultOverlay.hidden=false;els.resultKicker.textContent=defeated?'BOSS DEFEATED':'RUN COMPLETE';els.resultTitle.textContent=defeated?'ボス撃破！':'次はもっとPOWERを！';els.resultMessage.textContent=defeated?`${petName}と10問を走り切り、最後の敵を倒しました。`:`${petName}と10問を完走。ボスに${damage}ダメージ！ 7問以上正解が撃破の目安です。`;els.resultCorrect.textContent=`${score} / 10`;els.resultPower.textContent=String(power);els.misses.replaceChildren();if(!misses.length){const p=document.createElement('p');p.textContent='全問正解！ 間違えた問題はありません。';p.style.color='#a9ffd1';els.misses.appendChild(p);}else{misses.forEach((item,i)=>{const div=document.createElement('div');div.className='miss';div.innerHTML=`<b>${i+1}. ${cleanQuestion(item.question)}</b><br>正解：${escapeHtml(item.answer)}`;els.misses.appendChild(div);});}}

els.left.addEventListener('click',()=>answer(0));els.right.addEventListener('click',()=>answer(1));els.retry.addEventListener('click',()=>{els.boss.style.filter='';startGame();});els.startBtn.addEventListener('click',startGame);window.addEventListener('keydown',event=>{if(event.repeat||busy||els.startOverlay.hidden===false||els.resultOverlay.hidden===false)return;if(event.key==='ArrowLeft'){event.preventDefault();answer(0);}if(event.key==='ArrowRight'){event.preventDefault();answer(1);}});

async function init(){installGrades();const questionPromise=loadQuestions();try{const [dataOk]=await Promise.all([questionPromise,loadPet()]);els.loadStatus.textContent=dataOk?'リトライノートの英検問題DBを使用します':'通信時の予備問題で起動します';els.startBtn.disabled=false;els.startBtn.textContent='RUN START';els.question.textContent='級を選んで RUN START！';}catch(error){console.error(error);els.loadStatus.textContent=error?.message==='login-required'?'ログインが必要です。もんすたでぃのトップからログインしてください。':'ペットデータを読み込めませんでした。';els.startBtn.innerHTML='ログイン後に遊べます';els.question.textContent='ログインを確認してください';}}
init();
</script>
</body>
</html>
