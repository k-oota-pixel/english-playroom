<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>PET FISHING | もんすたでぃ</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}:root{--ink:#193d38;--muted:#71827a;--green:#245f50;--line:#dce6df}
body{margin:0;background:#f5f7f3;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{width:min(940px,100%);margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:10px;font-weight:950;letter-spacing:.14em;color:#58776d}.badge{font-size:9px;font-weight:950;color:#fff;background:#213f39;border-radius:999px;padding:5px 9px}.back{color:#58756c;text-decoration:none;font-size:11px;font-weight:850;background:#fff;border:1px solid #d8e2da;border-radius:999px;padding:7px 10px}.hero{margin:14px 0 8px}.eyebrow{font-size:9px;letter-spacing:.15em;color:#6e857b;font-weight:900}.hero h1{font-size:clamp(32px,7vw,50px);line-height:1;margin:4px 0 7px}.hero p{margin:0;color:#6d7c75;font-size:12px}.status{margin:10px 0;padding:10px 12px;border-radius:12px;background:#eef4f0;color:#526d63;font-size:11px;font-weight:750}.status.error{background:#fff0ed;color:#93463c}.status.ok{background:#e9f6ee;color:#2a6853}.hud{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:10px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 11px}.stat span{display:block;font-size:8px;letter-spacing:.12em;color:#819087;font-weight:900}.stat strong{display:block;font-size:18px;margin-top:2px}.scene{position:relative;height:min(60svh,540px);min-height:430px;border-radius:22px;overflow:hidden;border:9px solid #fff;box-shadow:0 9px 30px #173d3712;background:linear-gradient(#c7edf6 0 44%,#87c985 44% 51%,#62bfd7 51% 69%,#2f91ae 69% 100%)}.scene:before{content:"";position:absolute;left:0;right:0;top:51%;height:10px;background:repeating-linear-gradient(90deg,#e8fdff 0 28px,#bcebf4 28px 56px);opacity:.7;animation:water 5s linear infinite}.sun{position:absolute;right:8%;top:7%;width:58px;height:58px;border-radius:50%;background:#ffe28d;box-shadow:0 0 0 12px #fff8c83b}.hill{position:absolute;left:0;right:0;top:38%;height:14%;background:#78ae6c;clip-path:polygon(0 75%,10% 32%,22% 68%,36% 22%,51% 72%,65% 28%,80% 66%,92% 25%,100% 65%,100% 100%,0 100%)}.pier{position:absolute;z-index:4;left:0;bottom:23%;width:54%;height:20%;background:repeating-linear-gradient(90deg,#b88352 0 46px,#976a43 46px 50px);clip-path:polygon(0 23%,100% 0,100% 100%,0 88%);box-shadow:0 10px 0 #6f4d35}.pet{position:absolute;z-index:7;left:25%;bottom:29%;width:145px;height:145px;transform:translateX(-50%);filter:drop-shadow(0 9px 8px #244b3d30)}.pet svg{width:100%;height:100%;display:block;background:transparent!important}.pet.wait{animation:petWait 1.1s ease-in-out infinite}.pet.pull{animation:petPull .42s ease-in-out 3}.rod{position:absolute;z-index:8;left:31%;bottom:44%;width:180px;height:4px;background:#6a472f;border-radius:999px;transform-origin:left;transform:rotate(-24deg);transition:.3s}.rod.cast{transform:rotate(-10deg)}.rod.pull{transform:rotate(-39deg)}.line{position:absolute;z-index:5;left:calc(31% + 160px);top:42%;height:31%;width:1.5px;background:#efffff}.bob{position:absolute;z-index:6;left:calc(31% + 153px);top:71%;width:15px;height:20px;border-radius:50%;background:linear-gradient(#e94f48 0 45%,#fff 45%);box-shadow:0 2px 5px #15556b55}.bob.wait{animation:bob 1.2s ease-in-out infinite}.bob.bite{animation:bite .23s ease-in-out 5}.message{position:absolute;z-index:10;left:50%;top:14px;transform:translateX(-50%);width:min(88%,480px);background:#fffffff2;border:1px solid #d8e5dd;border-radius:18px;padding:9px 12px;text-align:center;box-shadow:0 6px 20px #183b3815}.message small{display:block;font-size:8px;letter-spacing:.14em;color:#769087;font-weight:950}.message strong{display:block;font-size:14px;margin-top:2px}.catch{position:absolute;z-index:20;left:50%;top:53%;transform:translate(-50%,-50%) scale(.92);width:min(88%,380px);background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;text-align:center;box-shadow:0 18px 55px #123a4542;opacity:0;pointer-events:none}.catch.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto;transition:.25s}.catch-icon{font-size:74px;line-height:1}.new{display:inline-block;margin-top:6px;background:#fff0b9;color:#866210;border-radius:999px;padding:4px 8px;font-size:9px;font-weight:950}.catch-name{font-size:31px;font-weight:1000;line-height:1;margin-top:7px}.catch-ja{font-size:14px;color:#6d7d76;margin-top:4px}.catch-rarity{font-size:9px;letter-spacing:.13em;color:#7d9086;font-weight:950;margin-top:6px}.catch button{margin-top:12px;border:0;border-radius:12px;background:var(--green);color:#fff;padding:9px 17px;font-weight:900}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:10px}.controls button{border:0;border-radius:14px;padding:11px 17px;font-weight:950;cursor:pointer}.fish{background:var(--green);color:#fff;min-width:190px}.bookBtn{background:#edf4ef;color:#355f52;border:1px solid #d3e0d8!important}.controls button:disabled{opacity:.5;cursor:not-allowed}.note{text-align:center;color:#7d8c84;font-size:9px;margin:7px 0 20px}.book{width:min(760px,calc(100% - 22px));border:0;border-radius:22px;padding:0}.book::backdrop{background:#193d3869}.book-inner{padding:18px}.book-head{display:flex;justify-content:space-between;gap:10px}.book h2{margin:3px 0}.book-close{border:1px solid #d6e0da;background:#fff;border-radius:999px;padding:7px 11px;font-size:10px;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.entry{border:1px solid #dfe7e1;background:#fbfdfb;border-radius:15px;padding:10px;text-align:center}.entry.locked{background:#f3f5f2;color:#9ba59f}.entry .icon{font-size:44px}.entry strong{display:block;font-size:13px}.entry .ja{font-size:9px;color:#788780}.entry .count{font-size:10px;font-weight:950;color:#8e6b1d;margin-top:4px}@keyframes water{to{background-position:56px 0}}@keyframes petWait{50%{transform:translateX(-50%) translateY(3px)}}@keyframes petPull{50%{transform:translateX(-50%) translate(-7px,-5px) rotate(-4deg)}}@keyframes bob{50%{transform:translateY(4px)}}@keyframes bite{50%{transform:translateY(14px) scale(.86)}}@media(max-width:620px){.scene{min-height:430px;height:58svh}.pet{left:27%;width:118px;height:118px}.rod{left:33%;width:145px}.line{left:calc(33% + 129px)}.bob{left:calc(33% + 122px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div class="brand">もんすたでぃ · PET PLAY</div><div style="display:flex;gap:7px;align-items:center"><span class="badge">URL PREVIEW</span><a class="back" href="../">← もどる</a></div></div>
  <section class="hero"><div class="eyebrow">HIDDEN PREVIEW</div><h1>PET FISHING</h1><p>URLを知っているログインユーザーだけが試遊できる非掲載ページです。</p></section>
  <div id="status" class="status">ログイン状態とPETデータを確認しています…</div>
  <div class="hud"><div class="stat"><span>COINS</span><strong id="coins">—</strong></div><div class="stat"><span>DISCOVERED</span><strong id="discovered">0 / 11</strong></div><div class="stat"><span>TOTAL CATCH</span><strong id="total">0</strong></div></div>
  <div class="scene"><div class="sun"></div><div class="hill"></div><div class="pier"></div><div class="message"><small id="phaseLabel">PET FISHING</small><strong id="phaseText">ペットと釣りに出かけよう</strong></div><div id="pet" class="pet"></div><div id="rod" class="rod"></div><div class="line"></div><div id="bob" class="bob"></div><div id="catch" class="catch"><div id="catchIcon" class="catch-icon"></div><div id="new" class="new" hidden>NEW DISCOVERY!</div><div id="catchName" class="catch-name"></div><div id="catchJa" class="catch-ja"></div><div id="catchRarity" class="catch-rarity"></div><button id="catchClose" type="button">つづける</button></div></div>
  <div class="controls"><button id="fish" class="fish" type="button" disabled>🎣 つりをする　🪙 1</button><button id="bookOpen" class="bookBtn" type="button" disabled>📖 つり図鑑</button></div><p class="note">1プレイ1コイン。トップページやPET PLAYのメニューには掲載していません。</p>
</main>
<dialog id="book" class="book"><div class="book-inner"><div class="book-head"><div><div class="eyebrow">FISHING COLLECTION</div><h2>つり図鑑</h2></div><button id="bookClose" class="book-close" type="button">閉じる</button></div><div id="grid" class="grid"></div></div></dialog>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://k-oota-pixel.github.io/english-playroom/auth-session.js?v=2.3.8';
import {getFirestore,doc,getDoc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
import {enableAppCheck} from '../firebase-security.js?v=2.1.9';
import {renderPetSVG} from '../pet-art.js?v=2.3.8';
const cfg={apiKey:'AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ',authDomain:'eiken-retry.firebaseapp.com',projectId:'eiken-retry',storageBucket:'eiken-retry.firebasestorage.app',messagingSenderId:'231308672297',appId:'1:231308672297:web:5e8b8ede3a0246c2318b38'};
const app=getApps().length?getApp():initializeApp(cfg);enableAppCheck(app);const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);let player=null,petData={},fishing={collection:{},totalCatches:0},busy=false;
const C=[{id:'salmon',ja:'サケ',icon:'🐟',w:17,r:'COMMON'},{id:'eel',ja:'ウナギ',icon:'〰️',w:14,r:'COMMON'},{id:'crab',ja:'カニ',icon:'🦀',w:13,r:'COMMON'},{id:'shrimp',ja:'エビ',icon:'🦐',w:13,r:'COMMON'},{id:'squid',ja:'イカ',icon:'🦑',w:11,r:'COMMON'},{id:'octopus',ja:'タコ',icon:'🐙',w:9,r:'UNCOMMON'},{id:'oyster',ja:'カキ',icon:'🦪',w:7,r:'UNCOMMON'},{id:'jellyfish',ja:'クラゲ',icon:'🪼',w:6,r:'UNCOMMON'},{id:'shark',ja:'サメ',icon:'🦈',w:4,r:'RARE'},{id:'dolphin',ja:'イルカ',icon:'🐬',w:3,r:'RARE'},{id:'whale',ja:'クジラ',icon:'🐋',w:2,r:'SUPER RARE'}];
function ref(){return doc(db,'users',player.uid,'apps','english-playroom')}
function clean(v){const collection={};for(const c of C)collection[c.id]=Math.max(0,Math.floor(Number(v?.collection?.[c.id])||0));return {collection,totalCatches:Math.max(0,Math.floor(Number(v?.totalCatches)||0)),lastCatch:String(v?.lastCatch||'')}}
function setStatus(t,k=''){const e=$('status');e.textContent=t;e.className='status'+(k?' '+k:'')}
function discovered(){return C.filter(c=>(fishing.collection[c.id]||0)>0).length}
function hud(){$('coins').textContent='🪙 '+Math.max(0,Math.floor(Number(petData.coins)||0)).toLocaleString('ja-JP');$('discovered').textContent=discovered()+' / '+C.length;$('total').textContent=Number(fishing.totalCatches||0).toLocaleString('ja-JP');$('fish').disabled=busy||!player||Number(petData.coins||0)<1;$('bookOpen').disabled=!player}
function renderBook(){const g=$('grid');g.replaceChildren();for(const c of C){const n=fishing.collection[c.id]||0,e=document.createElement('article');e.className='entry'+(n?'':' locked');e.innerHTML=`<div class="icon">${n?c.icon:'❔'}</div><strong>${n?c.id:'?????'}</strong><div class="ja">${n?c.ja:'未発見'}</div><div class="count">${n?'× '+n:'—'}</div>`;g.append(e)}}
function renderPet(){try{$('pet').innerHTML=renderPetSVG(petData.petAppearance,petData.petShop||{},'',{background:false})}catch{$('pet').textContent='🐾'}}
async function load(){const s=await getDoc(ref());if(!s.exists())throw Error('PETデータが見つかりません。');petData=s.data();fishing=clean(petData.petFishing);renderPet();renderBook();hud();setStatus('PET FISHINGを開始できます。','ok')}
onAuthStateChanged(auth,async u=>{player=u||null;if(!player)return;try{await load()}catch(e){setStatus(e.message||'PETデータを読み込めませんでした。','error')}});
function choose(){const t=C.reduce((n,c)=>n+c.w,0);let r=Math.random()*t;for(const c of C){r-=c.w;if(r<0)return c}return C[0]}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function animate(c,isNew){$('catch').classList.remove('show');$('phaseLabel').textContent='CAST';$('phaseText').textContent='えいっ！';$('rod').className='rod cast';await sleep(600);$('phaseLabel').textContent='WAITING';$('phaseText').textContent='じっと待っています…';$('pet').className='pet wait';$('bob').className='bob wait';await sleep(1400+Math.random()*900);$('phaseLabel').textContent='HIT!';$('phaseText').textContent='きた！ ペットががんばってる！';$('pet').className='pet pull';$('rod').className='rod pull';$('bob').className='bob bite';await sleep(950);$('catchIcon').textContent=c.icon;$('new').hidden=!isNew;$('catchName').textContent=c.id;$('catchJa').textContent=c.ja;$('catchRarity').textContent=c.r;$('catch').classList.add('show');$('pet').className='pet';$('rod').className='rod';$('bob').className='bob';$('phaseLabel').textContent='CAUGHT!';$('phaseText').textContent=`${c.id} をつり上げた！`}
$('fish').onclick=async()=>{if(busy||!player)return;const c=choose();busy=true;hud();setStatus('1コインを使って釣りを始めます…');try{let next,coins,isNew=false;await runTransaction(db,async tx=>{const s=await tx.get(ref());if(!s.exists())throw Error('PETデータが見つかりません。');const d=s.data(),current=clean(d.petFishing),now=Math.max(0,Math.floor(Number(d.coins)||0));if(now<1)throw Error('コインが足りません。');const before=current.collection[c.id]||0;isNew=before===0;next={...current,collection:{...current.collection,[c.id]:before+1},totalCatches:current.totalCatches+1,lastCatch:c.id};coins=now-1;tx.update(ref(),{coins,petFishing:next,petFishingUpdatedAt:serverTimestamp()})});petData={...petData,coins};fishing=next;renderBook();hud();setStatus(isNew?`NEW! ${c.id}（${c.ja}）を図鑑に登録しました。`:`${c.id}（${c.ja}）を釣りました。`,'ok');await animate(c,isNew)}catch(e){setStatus(e.message||'釣りを開始できませんでした。','error')}finally{busy=false;hud()}};
$('bookOpen').onclick=()=>{renderBook();$('book').showModal()};$('bookClose').onclick=()=>$('book').close();$('catchClose').onclick=()=>{$('catch').classList.remove('show');$('phaseLabel').textContent='PET FISHING';$('phaseText').textContent='もう一度つってみよう'};
</script>
</body>
</html>
