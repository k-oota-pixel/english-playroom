function pet(now){ctx.save();ctx.translate(p.x,p.y);const bob=moving?Math.sin(now/40)*2:Math.sin(now/350)*.7;ctx.fillStyle='#171a2260';ctx.beginPath();ctx.ellipse(0,13,14,4,0,0,Math.PI*2);ctx.fill();ctx.translate(0,bob);ctx.lineWidth=1.8;ctx.strokeStyle='#61472d';ctx.fillStyle='#f1ad65';ctx.beginPath();ctx.moveTo(-15,-1);ctx.quadraticCurveTo(-18,-16,-13,-18);ctx.lineTo(-5,-12);ctx.quadraticCurveTo(0,-14,5,-12);ctx.lineTo(13,-18);ctx.quadraticCurveTo(18,-16,15,-1);ctx.quadraticCurveTo(19,14,0,14);ctx.quadraticCurveTo(-19,14,-15,-1);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff1ca';ctx.beginPath();ctx.ellipse(0,7,10,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3c3027';let shift=p.dir==='left'?-3:p.dir==='right'?3:0;if(p.dir!=='up'){for(let x of [-6,6]){ctx.beginPath();ctx.ellipse(x+shift,-1,1.8,3,0,0,Math.PI*2);ctx.fill()}ctx.beginPath();ctx.ellipse(shift,5,2,1.7,0,0,Math.PI*2);ctx.fill()}ctx.restore();}
function frame(now){update(now);last=now;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#191c29';ctx.fillRect(0,0,vw,vh);ctx.save();ctx.scale(zoom,zoom);ctx.translate(-camX,-camY);if(bg.complete&&bg.naturalWidth)ctx.drawImage(bg,0,0,W,H);pet(now);ctx.restore();document.querySelector('#pos').textContent=`${p.c+1}, ${p.r+1} / 72 × 48`;const s=nearest();document.querySelector('#hint').textContent=s.d<75?`${s.t} · Enter / 調べる`:'WASD / 矢印キーで移動 · Enterで調べる';requestAnimationFrame(frame)}
window.addEventListener('keydown',e=>{const k=keyMap[e.key]||keyMap[e.key.toLowerCase()];if(k){e.preventDefault();if(!modal&&!keys.has(e.code))keys.set(e.code,k)}else if(e.key==='Enter'&&!e.repeat){e.preventDefault();action()}else if(e.key==='Escape')close()});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!modal)keys.set('p'+e.pointerId,b.dataset.key)};b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>keys.delete('p'+e.pointerId)});document.querySelector('#act').onclick=action;document.querySelector('#close').onclick=close;document.querySelector('#reset').onclick=()=>{moving=null;keys.clear();p.c=spawn.c;p.r=spawn.r;p.x=(p.c+.5)*S;p.y=(p.r+.5)*S;resize();close()};requestAnimationFrame(frame);
})();</script></html>
