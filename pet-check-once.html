<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ペットの動作確認</title><style>body{font-family:system-ui;background:#f6f5ef;color:#193d38;padding:30px;max-width:600px;margin:auto}button{padding:12px;border-radius:10px;background:#286851;color:white;border:0;font:inherit}p{line-height:1.7}</style><h1>ペットの孵化を確認</h1><p id="account">ログイン状態を確認中…</p><p>現在ログイン中のアカウントの、ペット用ログイン日数を3日以上にします。</p><button id="advance" disabled>ペット用ログイン日数を3日にする</button><p id="status" role="status"></p><a href="./">ペットの画面へ戻る</a><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,onAuthStateChanged,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
import {getFirestore,doc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js';
const app=initializeApp({apiKey:"AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ",authDomain:"eiken-retry.firebaseapp.com",projectId:"eiken-retry",appId:"1:231308672297:web:5e8b8ede3a0246c2318b38"});
const auth=getAuth(app),db=getFirestore(app),button=document.getElementById('advance'),status=document.getElementById('status');
await setPersistence(auth,browserLocalPersistence);
onAuthStateChanged(auth,user=>{document.getElementById('account').textContent=user?'対象アカウント：'+user.displayName:'先にメインページでGoogleログインしてください。';button.disabled=!user||Date.now()>Date.parse('2026-10-15T00:00:00Z');});
button.addEventListener('click',async()=>{const user=auth.currentUser;if(!user)return;button.disabled=true;try{await runTransaction(db,async tx=>{const ref=doc(db,'users',user.uid,'apps','english-playroom'),snap=await tx.get(ref),data=snap.exists()?snap.data():{};tx.set(ref,{petLoginDays:Math.max(3,Number(data.petLoginDays)||0),petUpdatedAt:serverTimestamp()},{merge:true});});status.textContent='保存しました。ペット用ログイン日数は3日以上になりました。';}catch(error){status.textContent='保存に失敗しました：'+error.code;button.disabled=false;}});
</script></html>
