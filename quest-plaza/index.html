<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#17273b">
<title>もんすた王国・オンライン広場</title>
<link rel="icon" href="../favicon.svg">
<link rel="stylesheet" href="./style.css?v=2.5.27">
<link rel="stylesheet" href="./battle-quest-theme.css?v=2.5.27">
<script type="module" src="./app.js?v=2.5.27"></script>
</head>
<body>
<header class="bar">
  <div class="identity"><small>MONSTER QUEST</small><h1>もんすた王国 <span>オンライン広場</span></h1></div>
  <div class="bar-actions">
    <span id="connection" class="connection">接続準備中</span>
    <span id="capacity" class="capacity">0 / 40 人</span>
    <button id="formation" class="header-button" type="button">⚔ 編成</button>
  </div>
</header>
<main>
 <div id="notice" role="status" aria-live="polite" class="notice">ログイン情報を確認中…</div>
 <section class="scene" aria-label="もんすた王国の共通広場">
  <div id="viewport" class="viewport" tabindex="0" aria-label="広場。矢印キーかWASD、十字キーで移動。マウスドラッグや指のスワイプでマップを見回せます">
   <div id="world" class="world" aria-label="48マスかける32マスの広場">
    <div class="plaza-floor"></div>
    <div class="fountain"><div class="water">✦</div></div>
    <div id="decorations" aria-hidden="true"></div>
    <div id="players"></div>
   </div>
  </div>
  <button id="recenter-camera" type="button" class="camera-recenter" aria-label="カメラを自分のぺっとの位置に戻す" title="自分の位置へ戻る">◎ 自分の位置</button>
  <div class="scene-bottom">
   <div class="guide"><strong id="nearest">近くのプレイヤーを探そう</strong><span>隣のマスに近づくと対戦を申し込めます</span></div>
   <div class="pad" aria-label="移動">
    <button data-dx="0" data-dy="-1" class="up" aria-label="上に移動">▲</button>
    <button data-dx="-1" data-dy="0" class="left" aria-label="左に移動">◀</button>
    <button data-dx="0" data-dy="1" class="down" aria-label="下に移動">▼</button>
    <button data-dx="1" data-dy="0" class="right" aria-label="右に移動">▶</button>
   </div>
  </div>
 </section>
 <p class="foot">方向キー / WASD / 十字キーで移動・マウスドラッグ / スマホのフリックスワイプで見回す・対戦は相手の承認後に開始</p>
</main>
<div id="modal" class="overlay" hidden>
 <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <h2 id="modal-title"></h2><div id="modal-body"></div><div id="modal-actions" class="modal-actions"></div>
 </section>
</div>
<div id="battle" class="battle-overlay" hidden>
 <div id="battle-panel" class="battle-panel battle-stage" aria-label="もんすたクエスト・リアルタイム対戦">
  <div class="battle-header">
   <strong>⚔ REALTIME BATTLE</strong>
   <span id="battle-grade"></span>
   
   <button id="battle-forfeit" type="button">対戦を終了する</button>
  </div>
  <div id="battle-teams" class="battle-teams"></div>
  <div id="battle-fx" class="battle-fx" aria-hidden="true"></div>
  <div id="battle-log" class="battle-log" aria-live="polite"></div>
  <div id="battle-control" class="battle-control">
   <nav id="battle-tabs" class="battle-main-actions" aria-label="戦闘コマンド">
    <button type="button" data-battle-tab="attack" aria-pressed="true">攻撃</button>
    <button type="button" data-battle-tab="magic" aria-pressed="false">魔法</button>
    <button type="button" data-battle-tab="items" aria-pressed="false">アイテム</button>
   </nav>
   <div id="battle-actions" class="battle-actions"></div>
   <p id="battle-action-hint" class="battle-action-hint">通常攻撃を選択中</p>
   <div id="quiz" class="quiz"></div>
  </div>
  <div id="battle-finished" class="battle-finished" hidden>
   <h2 id="battle-outcome"></h2>
   <button id="back-to-plaza" type="button">広場に戻る</button>
  </div>
 </div>
</div>
<div id="formation-panel" class="formation-overlay" hidden>
 <div class="formation-shell">
  <div class="formation-header"><strong>仲間カードの編成・強化</strong><button id="close-formation" type="button">✕ 広場へ戻る</button></div>
  <iframe id="formation-frame" title="もんすたクエストの編成画面" loading="lazy"></iframe>
 </div>
</div>
</body>
</html>
