<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ログイン｜もんすたでぃ</title>
<style>
:root{--ink:#193d38;--green:#246a57;--muted:#6d7c75;--line:#dce5da;--pale:#f4f8f4;--error:#9b453b;--ok:#2f6f50}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f6f5ef;color:var(--ink);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:22px}
button,input{font:inherit}.shell{width:min(520px,100%)}.brand{font-size:11px;letter-spacing:.15em;font-weight:900;color:#55776e;margin:0 0 8px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 12px 36px #193d3810}h1{font-size:30px;line-height:1.25;margin:0 0 7px}.lead{margin:0 0 23px;color:var(--muted);font-size:13px}.btn{width:100%;border:1px solid #cfdbd2;background:#fff;color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:850;cursor:pointer}.btn:hover{background:#f7faf7}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn:disabled{opacity:.55;cursor:wait}.google{display:flex;align-items:center;justify-content:center;gap:9px}.gmark{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1px solid #d9e0da;font-weight:900;font-size:12px;background:#fff}.divider{display:flex;align-items:center;gap:12px;color:#8b9892;font-size:11px;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:#e2e9e3;flex:1}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f1f5f1;border-radius:12px;padding:4px;margin-bottom:16px}.tab{border:0;background:transparent;color:#718078;border-radius:9px;padding:8px;font-weight:850;cursor:pointer}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px #193d380d}.form{display:grid;gap:10px}.field{display:grid;gap:5px}.label{font-size:11px;font-weight:850}.input{width:100%;border:1px solid #cbd8cf;border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}.input:focus{border-color:#6a9a87;box-shadow:0 0 0 3px #70a28c1c}.hint{font-size:10.5px;color:#7a8982}.mode-note{font-size:10.5px;color:#74827c;margin-top:2px}.status{display:none;margin-top:15px;padding:11px 12px;border-radius:12px;background:#f0f5f1;color:#5c7067;font-size:12px;white-space:pre-wrap}.status.show{display:block}.status.ok{background:#eaf6ee;color:var(--ok)}.status.error{background:#fff0ed;color:var(--error)}.text-btn{appearance:none;border:0;background:none;padding:0;color:#55786d;text-decoration:underline;font-size:11px;cursor:pointer}.help{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:13px;flex-wrap:wrap}.signed{display:none;margin-top:17px;padding:14px;border-radius:14px;background:#edf7f0;border:1px solid #d7eadc}.signed.show{display:block}.signed strong{display:block;font-size:13px}.signed span{display:block;color:#66766f;font-size:11px;overflow-wrap:anywhere;margin-top:2px}.signed-actions{display:flex;gap:8px;margin-top:11px}.signed-actions .btn{padding:9px 11px;font-size:11px}.foot{font-size:10px;text-align:center;color:#84918b;margin-top:12px}.back{display:inline-block;margin-bottom:12px;text-decoration:none;color:#61786f;font-size:11px;font-weight:800}.hidden{display:none!important}@media(max-width:560px){body{padding:12px}.card{padding:21px 17px;border-radius:18px}h1{font-size:25px}}
</style>
</head>
<body>
<main class="shell">
  <a class="back" href="./">← もんすたでぃへ戻る</a>
  <section class="card">
    <div class="brand">もんすたでぃ</div>
    <h1>ログイン</h1>
    <p class="lead">IDとパスワードでログインできます。新規登録には先生から配付された登録コードが必要です。</p>

    <button id="googleBtn" class="btn google" type="button"><span class="gmark">G</span>Googleでログイン（既存の方）</button>

    <div class="divider">または</div>

    <div class="tabs" role="tablist" aria-label="ログインと新規登録">
      <button id="loginTab" class="tab active" type="button" role="tab" aria-selected="true">ログイン</button>
      <button id="registerTab" class="tab" type="button" role="tab" aria-selected="false">新規登録</button>
    </div>

    <form id="emailForm" class="form">
      <div class="field">
        <label class="label" for="email">ログインID</label>
        <input id="email" class="input" type="text" autocomplete="username" maxlength="254" placeholder="設定したID（既存の方はメールアドレスも可）" required>
      </div>
      <div class="field">
        <label class="label" for="password">パスワード</label>
        <input id="password" class="input" type="password" autocomplete="current-password" minlength="6" placeholder="6文字以上" required>
      </div>
      <div id="codeField" class="field hidden"><label class="label" for="registrationCode">登録コード</label><input id="registrationCode" class="input" autocomplete="off" maxlength="32" placeholder="XXXX-XXXX-XXXX-XXXX"><span class="hint">先生から配付されたコードを入力してください。</span></div>
      <div id="confirmField" class="field hidden">
        <label class="label" for="confirmPassword">パスワード（確認）</label>
        <input id="confirmPassword" class="input" type="password" autocomplete="new-password" minlength="6" placeholder="同じパスワードをもう一度">
      </div>
      <button id="emailSubmit" class="btn primary" type="submit">IDでログイン</button>
      <div id="modeNote" class="mode-note">一度ログインすれば、この端末では基本的にログイン状態が保たれます。</div>
    </form>

    <div class="help">
      <button id="resetBtn" class="text-btn" type="button">パスワードを忘れた方はこちら</button>
      <button id="modeSwitch" class="text-btn" type="button">初めての方はこちら</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <div id="signed" class="signed">
      <strong>ログイン中</strong><span id="signedEmail"></span>
      <div class="signed-actions"><button id="continueBtn" class="btn primary" type="button">続ける</button><button id="logoutBtn" class="btn" type="button">ログアウト</button></div>
    </div>
  </section>
  <div class="foot">ID・パスワードを忘れたときは先生に申し出てください。</div>
</main>

<script type="module">
import {enableAppCheck} from './firebase-security.js?v=2.1.2';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence,signInWithEmailAndPassword,signInWithCustomToken,accountSession} from './auth-session.js?v=2.3.1';
const app=initializeApp({apiKey:'AIzaSyAllLjPcGhygMSEIORXhKZOaDjYvpSJ4EQ',authDomain:'eiken-retry.firebaseapp.com',projectId:'eiken-retry',storageBucket:'eiken-retry.firebasestorage.app',messagingSenderId:'231308672297',appId:'1:231308672297:web:5e8b8ede3a0246c2318b38'});
enableAppCheck(app);const auth=getAuth(app);await setPersistence(auth,browserLocalPersistence);
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
let mode='login',working=false;
function safeReturn(raw){try{const u=new URL(raw||'./',location.href);return u.origin===location.origin&&!u.pathname.endsWith('/login.html')?u.href:new URL('./',location.href).href;}catch{return new URL('./',location.href).href;}}
const returnUrl=safeReturn(params.get('return'));
function status(text){$('status').textContent=text;$('status').className='status show';}
function busy(value){working=value;for(const button of document.querySelectorAll('button'))button.disabled=value;}
function setMode(value){
 mode=value;const register=mode==='register';
 for(const id of ['confirmField','codeField'])$(id).classList.toggle('hidden',!register);
 $('confirmPassword').required=register;$('registrationCode').required=register;
 $('password').minLength=register?8:6;$('password').placeholder=register?'8文字以上':'パスワード';
 $('password').autocomplete=register?'new-password':'current-password';
 $('emailSubmit').textContent=register?'登録コードで新規登録':'IDでログイン';
 $('modeNote').textContent=register?'メールアドレスは不要です。IDは4〜32文字の英数字・ハイフン・アンダーバーで設定してください。':'既存の方はGoogle、または従来のメールアドレスでもログインできます。';
 for(const [id,selected]of [['loginTab',!register],['registerTab',register]]){$(id).classList.toggle('active',selected);$(id).setAttribute('aria-selected',String(selected));}
 $('modeSwitch').textContent=register?'すでに登録済みの方はこちら':'初めての方はこちら';
 $('status').className='status';
}
async function call(action,body){
 const r=await fetch('https://task-quest.onrender.com/api/account/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)});
 const data=await r.json();if(!r.ok)throw Error(data.error||'処理に失敗しました。');return data;
}
async function proceed(){
 const user=auth.currentUser;if(!user||user.isAnonymous)throw Error('ログインしてください。');
 const session=await accountSession(user);
 location.href=session.resetRequired?'./account.html?mode=password':returnUrl;
}
$('emailForm').addEventListener('submit',async event=>{
 event.preventDefault();if(working)return;busy(true);status('確認しています…');
 try{
 const loginId=$('email').value.trim(),password=$('password').value;
 if(mode==='register'){
  if(password!==$('confirmPassword').value)throw Error('確認用パスワードが一致しません。');
  const data=await call('register',{loginId,password,code:$('registrationCode').value});await signInWithCustomToken(auth,data.token);
 }else if(loginId.includes('@')){await signInWithEmailAndPassword(auth,loginId,password);}
 else{const data=await call('login',{loginId,password});await signInWithCustomToken(auth,data.token);}
 await proceed();
 }catch(error){status(error.message?.startsWith('Firebase:')?'ログインできませんでした。入力内容を確認してください。':error.message);}finally{busy(false);}
});
$('googleBtn').onclick=async()=>{
 if(working)return;busy(true);status('Googleログインを確認しています…');
 try{await signInWithPopup(auth,new GoogleAuthProvider());await proceed();}
 catch(error){status(error.code==='auth/popup-closed-by-user'?'ログインを中止しました。':error.message);}finally{busy(false);}
};
$('resetBtn').onclick=()=>status('ID・パスワードを忘れた場合は先生に申し出てください。先生がIDの確認・仮パスワードの発行を行います。');
$('loginTab').onclick=()=>setMode('login');$('registerTab').onclick=()=>setMode('register');$('modeSwitch').onclick=()=>setMode(mode==='login'?'register':'login');
$('continueBtn').onclick=()=>proceed().catch(error=>status(error.message));$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{$('signed').classList.toggle('show',!!user&&!user.isAnonymous);$('signedEmail').textContent=user?'ログイン済みです':'';});
setMode('login');
</script>
</body></html>
