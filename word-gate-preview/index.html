<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WORD GATE PREVIEW | もんすたでぃ</title>
<style>
:root{--sky:#61afd0;--grass:#6f9b75;--road:#313a41;--road2:#252d32;--ink:#fff;--gold:#ffe177;--ok:#89f5b7;--bad:#ff8e98}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07141d;color:var(--ink)}body{overflow:hidden}.wrap{height:100dvh;display:grid;place-items:center}.game{position:relative;width:min(100vw,820px);height:100dvh;max-height:900px;overflow:hidden;background:linear-gradient(var(--sky) 0 34%,#89b58b 34% 44%,#315f43 44% 100%);isolation:isolate}.game.shake{animation:shake .3s ease}
.scenery{position:absolute;inset:0;overflow:hidden}.hill{position:absolute;top:30%;width:54%;height:18%;background:#4d815a;border-radius:50% 50% 0 0/100% 100% 0 0;opacity:.85}.hill.left{left:-12%}.hill.right{right:-14%;transform:scaleX(1.25)}.cloud{position:absolute;width:90px;height:24px;background:rgba(255,255,255,.55);border-radius:999px}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:38px;height:38px;left:15px;bottom:0}.cloud:after{width:48px;height:48px;right:12px;bottom:0}.cloud.c1{top:12%;left:8%;transform:scale(.72)}.cloud.c2{top:20%;right:7%;transform:scale(.52);opacity:.7}
.base-road{position:absolute;left:50%;top:35%;width:140%;height:72%;transform:translateX(-50%);clip-path:polygon(46% 0,54% 0,88% 100%,12% 100%);background:linear-gradient(90deg,#2b3339 0 49.3%,#1c2429 49.3% 50.7%,#2b3339 50.7% 100%);opacity:.5}.base-road:after{content:"";position:absolute;left:49.6%;top:0;width:.8%;height:100%;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.2));opacity:.35}
.hud{position:absolute;z-index:40;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none}.hud-card{background:rgba(7,25,36,.78);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:11px;font-weight:950;letter-spacing:.05em}.hud-card strong{color:var(--gold);font-size:14px}.hud .grow{flex:1;text-align:center;color:#d9edf5}.hud .power{margin-left:auto}.instruction{position:absolute;z-index:35;top:58px;left:50%;transform:translateX(-50%);background:rgba(7,25,36,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:5px 10px;font-size:10px;font-weight:850;color:#d7e7ee;pointer-events:none;transition:opacity .3s}.instruction.dim{opacity:.35}
.course{position:absolute;z-index:8;inset:0;pointer-events:none;perspective:900px}.packet{position:absolute;left:50%;top:0;width:min(72vw,520px);height:250px;transform-origin:50% 100%;will-change:transform,opacity;pointer-events:none}.packet.active{z-index:20;pointer-events:auto}.packet.next1{z-index:12}.packet.next2{z-index:6}.road-slab{position:absolute;z-index:1;left:50%;top:126px;width:176%;height:145px;transform:translateX(-50%) perspective(360px) rotateX(68deg);transform-origin:50% 0;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);background:linear-gradient(90deg,rgba(49,58,65,.88) 0 49%,rgba(30,38,43,.9) 49% 51%,rgba(49,58,65,.88) 51% 100%);border-top:2px solid rgba(255,255,255,.14);box-shadow:0 14px 18px rgba(0,0,0,.18)}.road-slab:after{content:"";position:absolute;left:49.35%;top:0;width:1.3%;height:100%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.68) 0 15px,transparent 15px 34px);opacity:.7}
.question-board{position:absolute;z-index:5;left:50%;top:-76px;transform:translateX(-50%);width:98%;min-height:78px;display:grid;align-content:center;text-align:center;padding:10px 13px;border-radius:15px;background:rgba(8,31,45,.9);border:2px solid rgba(199,239,255,.78);box-shadow:0 8px 24px rgba(0,0,0,.28);font-weight:950;font-size:clamp(15px,2.6vw,22px);line-height:1.28;text-wrap:balance}.packet:not(.active) .question-board{background:rgba(8,31,45,.75);border-color:rgba(199,239,255,.42)}.question-board small{display:block;font-size:9px;letter-spacing:.12em;color:#9edcf3;margin-bottom:3px}.gates{position:absolute;z-index:4;left:50%;top:92px;width:112%;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:4%}.gate{position:relative;min-height:112px;border:4px solid #c8f4ff;border-radius:16px 16px 7px 7px;background:linear-gradient(rgba(25,161,216,.76),rgba(6,62,95,.92));color:#fff;font-size:clamp(15px,2.7vw,22px);font-weight:1000;padding:10px 8px;box-shadow:0 0 24px rgba(102,220,255,.24),inset 0 0 20px rgba(255,255,255,.06);text-shadow:0 2px 5px rgba(0,0,0,.35);pointer-events:none}.packet.active:not(.judged) .gate{pointer-events:auto;cursor:pointer}.packet.active:not(.judged) .gate:hover{filter:brightness(1.1)}.gate.chosen{box-shadow:0 0 0 5px rgba(255,231,102,.55),0 0 36px rgba(255,221,74,.5);border-color:#fff2a1}.gate.correct{background:rgba(28,168,91,.94);border-color:#b6ffd1}.gate.wrong{background:rgba(191,45,58,.94);border-color:#ffc1c6}.gate kbd{position:absolute;top:-11px;background:#0a202d;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 8px;color:#d9edf5;font-size:9px}.gate.left kbd{left:7px}.gate.right kbd{right:7px}.packet:not(.active) .gate{filter:saturate(.75) brightness(.83)}
.pet{position:absolute;z-index:30;left:50%;bottom:5.5%;transform:translateX(-50%);font-size:96px;filter:drop-shadow(0 12px 6px rgba(0,0,0,.32));transition:left .2s cubic-bezier(.2,.8,.2,1),transform .2s;animation:bob .24s ease-in-out infinite alternate;pointer-events:none}.pet.left{left:31%;transform:translateX(-50%) rotate(-5deg)}.pet.right{left:69%;transform:translateX(-50%) rotate(5deg)}.pet:after{content:"";position:absolute;left:20%;right:20%;bottom:-7px;height:12px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(3px);z-index:-1}.feedback{position:absolute;z-index:45;left:50%;top:56%;transform:translate(-50%,-50%);font-size:clamp(36px,8vw,60px);font-weight:1000;opacity:0;text-shadow:0 5px 18px #000;pointer-events:none}.feedback.show{animation:pop .74s ease}.boss{position:absolute;z-index:18;left:50%;top:35%;transform:translate(-50%,-50%) scale(.15);opacity:0;text-align:center;pointer-events:none}.boss.show{animation:bossin .8s cubic-bezier(.2,.9,.2,1) forwards}.boss .monster{font-size:clamp(120px,24vw,180px);filter:drop-shadow(0 16px 12px rgba(0,0,0,.35))}.boss .bar{width:min(250px,65vw);height:13px;border-radius:999px;background:#3a1115;overflow:hidden;border:1px solid rgba(255,255,255,.3);margin:auto}.boss .bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff5858,#ffb05d);transition:width .7s}.blast{position:absolute;z-index:25;left:50%;top:50%;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;background:#fff6a0;box-shadow:0 0 20px #fff,0 0 60px #ffd43b}.blast.fire{animation:blast .75s ease-out forwards}
.overlay{position:absolute;z-index:60;inset:0;display:grid;place-items:center;background:rgba(2,12,18,.78);backdrop-filter:blur(9px);padding:18px}.overlay[hidden]{display:none}.panel{width:min(100%,520px);background:#0c2735;border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.panel h1,.panel h2{margin:.2em 0}.panel p{color:#c9dae2;line-height:1.55}.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.grades button,.primary{border:0;border-radius:13px;padding:11px 6px;font-weight:900;cursor:pointer}.grades button{background:#173f54;color:#e9f7ff}.grades button.sel{background:#e8f9ff;color:#0b3041}.primary{width:100%;background:linear-gradient(135deg,#7ce7ff,#8cffb6);color:#082b37;font-size:16px}.status{min-height:1.5em;text-align:center;font-size:12px;color:#a9c1cc;margin-top:9px}.misses{display:grid;gap:7px;max-height:210px;overflow:auto;margin:12px 0}.miss{background:rgba(255,255,255,.06);border-left:4px solid #ff7b85;border-radius:9px;padding:8px 10px;font-size:13px}.note{font-size:12px;color:#9fb4be;text-align:center;margin-top:10px}
@keyframes bob{to{margin-bottom:7px}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}24%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}78%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes bossin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes blast{0%{opacity:1;transform:translate(-50%,-50%) scale(.1)}45%{opacity:1;transform:translate(-50%,-50%) scale(4)}100%{opacity:0;transform:translate(-50%,-50%) scale(12)}}
@media(max-width:620px){.packet{width:76vw;height:230px}.question-board{top:-68px;min-height:70px;padding:8px 10px}.gates{top:82px;width:118%;gap:4%}.gate{min-height:100px;padding:8px 5px}.road-slab{top:112px;height:132px}.pet{font-size:82px}.grades{grid-template-columns:repeat(3,1fr)}.hud-card{padding:7px 9px;font-size:10px}.instruction{top:54px}.cloud{display:none}}
@media(prefers-reduced-motion:reduce){.pet{animation:none}}
</style>
</head>
<body>
<div class="wrap"><main class="game" id="game">
<div class="scenery"><div class="hill left"></div><div class="hill right"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="base-road"></div></div>
<div class="hud"><div class="hud-card" id="gradeHud">EIKEN</div><div class="hud-card grow" id="progressHud">0 / 10</div><div class="hud-card power">POWER <strong id="powerHud">0</strong></div></div>
<div class="instruction" id="instruction">迫ってくる壁の正解側へ！　← → / タップ</div>
<div class="course" id="course"></div>
<div class="pet" id="pet">🐶</div>
<div class="feedback" id="feedback"></div>
<div class="boss" id="boss"><div style="font-size:11px;font-weight:1000;letter-spacing:.12em;color:#ffc16b">FINAL BOSS</div><div class="monster">👹</div><div class="bar"><i id="bossHp"></i></div></div>
<div class="blast" id="blast"></div>
<section class="overlay" id="start"><div class="panel"><div style="font-size:11px;font-weight:900;letter-spacing:.14em;color:#87ddff">REAL-TIME PREVIEW</div><h1>WORD GATE</h1><p>問題と左右の壁が、道路ごと奥から迫ってきます。正しい側へペットを移動させ、10問でPOWERをためてボスを倒そう。</p><div class="grades" id="grades"></div><button class="primary" id="startBtn">この級でスタート</button><div class="status" id="status">公開プレビュー版・ログイン不要</div></div></section>
<section class="overlay" id="result" hidden><div class="panel"><div style="font-size:11px;font-weight:900;color:#8bddff">RUN COMPLETE</div><h2 id="resultTitle">結果</h2><p id="resultText"></p><div class="misses" id="misses"></div><button class="primary" id="retry">もう一度</button><div class="note">問題セットは常に3つ先まで見えるリアルタイム方式です。</div></div></section>
</main></div>
<script>
const RETRY='https://k-oota-pixel.github.io/eiken-retry/';
const GRADES=['4級','3級','準2級','2級','準1級'];
const QUESTION_COUNT=10,PASS_MS=1200;
const ANSWER_MS_BY_GRADE={'4級':12000,'3級':15000,'準2級':18000,'2級':20000,'準1級':25000};
const FALLBACK=[
{id:'a',grade:'4級',question:'I (____) tennis every Sunday.',choices:[{number:1,text:'play'},{number:2,text:'plays'},{number:3,text:'playing'},{number:4,text:'played'}],answer_number:1},
{id:'b',grade:'3級',question:'My sister is good (____) cooking.',choices:[{number:1,text:'at'},{number:2,text:'to'},{number:3,text:'for'},{number:4,text:'by'}],answer_number:1},
{id:'c',grade:'準2級',question:'I decided (____) home early.',choices:[{number:1,text:'go'},{number:2,text:'going'},{number:3,text:'to go'},{number:4,text:'went'}],answer_number:3},
{id:'d',grade:'2級',question:'The new system will (____) us to work faster.',choices:[{number:1,text:'enable'},{number:2,text:'prevent'},{number:3,text:'refuse'},{number:4,text:'avoid'}],answer_number:1},
{id:'e',grade:'準1級',question:'The committee decided to (____) the proposal.',choices:[{number:1,text:'defer'},{number:2,text:'derive'},{number:3,text:'deter'},{number:4,text:'devise'}],answer_number:1}
];
const $=id=>document.getElementById(id);
let bank=[],grade='準2級',run=[],index=0,correct=0,power=0,miss=[],running=false,phaseStart=0,raf=0,judged=false,answerMs=18000,cycleMs=19200;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function clean(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
function renderGrades(){const box=$('grades');box.innerHTML='';GRADES.forEach(g=>{const b=document.createElement('button');b.textContent=g;b.className=g===grade?'sel':'';b.onclick=()=>{grade=g;renderGrades()};box.appendChild(b)})}
async function load(){try{const r=await fetch(RETRY,{cache:'no-store'});if(!r.ok)throw 0;const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const raw=doc.getElementById('question-data')?.textContent;if(!raw)throw 0;bank=JSON.parse(raw).filter(q=>q?.grade&&q?.question&&Array.isArray(q.choices)&&q.choices.length>=4)}catch{bank=FALLBACK}$('status').textContent=bank.length>20?'英検問題DBを読み込みました':'予備問題で起動します'}
function makeTwo(q){const ans=Number(q.answer_number),right=q.choices.find(c=>Number(c.number)===ans)||q.choices[0],wrongs=q.choices.filter(c=>Number(c.number)!==ans),wrong=wrongs[Math.floor(Math.random()*wrongs.length)]||q.choices[1];return shuffle([{text:String(right.text),ok:true},{text:String(wrong.text),ok:false}])}
function pickRun(){const pool=shuffle(bank.filter(q=>q.grade===grade));const src=pool.length?pool:FALLBACK.filter(q=>q.grade===grade);run=[];for(let n=0;n<QUESTION_COUNT;n++){const q=src[n%src.length];run.push({q,two:makeTwo(q),chosen:null,resolved:false})}}
function packetMarkup(item,offset){return `<div class="question-board"><small>${offset===0?'NOW':'NEXT '+offset}</small>${escapeHtml(clean(item.q.question))}</div><div class="road-slab"></div><div class="gates"><button class="gate left" data-lane="0"><kbd>←</kbd>${escapeHtml(item.two[0].text)}</button><button class="gate right" data-lane="1">${escapeHtml(item.two[1].text)}<kbd>→</kbd></button></div>`}
function escapeHtml(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rebuildPackets(){const course=$('course');course.innerHTML='';for(let offset=0;offset<3;offset++){const item=run[index+offset];if(!item)continue;const el=document.createElement('div');el.className='packet '+(offset===0?'active':offset===1?'next1':'next2');el.dataset.offset=offset;el.innerHTML=packetMarkup(item,offset);if(offset===0){el.querySelectorAll('.gate').forEach(b=>b.onclick=()=>choose(Number(b.dataset.lane)));if(item.chosen!==null)el.querySelector(`[data-lane="${item.chosen}"]`)?.classList.add('chosen')}course.appendChild(el)}updateHud()}
function updateHud(){$('gradeHud').textContent=grade;$('progressHud').textContent=`${Math.min(index+1,QUESTION_COUNT)} / ${QUESTION_COUNT} · ${correct} CORRECT`;$('powerHud').textContent=power}
function depthStyle(depth){const e=Math.exp(-.7*depth),y=60-38*(1-Math.exp(-depth)),scale=Math.min(1.45,.13+1.14*e),opacity=Math.max(.22,Math.min(1,1-depth*.16));return {y,scale,opacity}}
function draw(now){if(!running)return;const phase=(now-phaseStart)/cycleMs,hitPhase=answerMs/cycleMs;document.querySelectorAll('.packet').forEach(el=>{const offset=Number(el.dataset.offset)||0,depth=offset+1-phase,{y,scale,opacity}=depthStyle(depth);el.style.transform=`translate(-50%, ${y}vh) scale(${scale})`;el.style.opacity=opacity});if(phase>=hitPhase&&!judged)resolveActive();if(phase>=1){advance();return}raf=requestAnimationFrame(draw)}
function choose(lane){if(!running||judged)return;const item=run[index],packet=document.querySelector('.packet.active');if(!item||!packet)return;item.chosen=lane;$('pet').className='pet '+(lane===0?'left':'right');packet.querySelectorAll('.gate').forEach(g=>g.classList.remove('chosen'));packet.querySelector(`[data-lane="${lane}"]`)?.classList.add('chosen');$('instruction').classList.add('dim')}
function resolveActive(){const item=run[index];if(!item||judged)return;judged=true;item.resolved=true;const packet=document.querySelector('.packet.active');packet?.classList.add('judged');const gates=packet?[...packet.querySelectorAll('.gate')]:[];const correctLane=item.two.findIndex(x=>x.ok),chosen=item.chosen,ok=chosen===correctLane;if(ok){correct++;power++;if(gates[chosen])gates[chosen].classList.add('correct');flash('GOOD!','#b6ffd2')}else{if(chosen!==null&&gates[chosen])gates[chosen].classList.add('wrong');if(gates[correctLane])gates[correctLane].classList.add('correct');miss.push({q:clean(item.q.question),a:item.two[correctLane]?.text||''});flash(chosen===null?'TIME UP!':'MISS','#ffb3bb');shake()}updateHud()}
function advance(){index++;judged=false;$('pet').className='pet';$('instruction').classList.remove('dim');if(index>=run.length){running=false;cancelAnimationFrame(raf);startBoss();return}rebuildPackets();phaseStart+=cycleMs;cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
function flash(t,c){const f=$('feedback');f.textContent=t;f.style.color=c;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function shake(){const g=$('game');g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
function startBoss(){$('course').innerHTML='';$('progressHud').textContent=`10 / 10 · ${correct} CORRECT`;$('boss').classList.add('show');setTimeout(()=>{const hp=Math.max(0,10-power);$('bossHp').style.width=`${hp*10}%`;$('blast').classList.remove('fire');void $('blast').offsetWidth;$('blast').classList.add('fire');flash(`POWER ${power}!`,'#ffe480');setTimeout(()=>finish(hp===0),1000)},900)}
function finish(win){$('resultTitle').textContent=win?'BOSS CLEAR!':'BOSS SURVIVED…';$('resultText').textContent=`${correct}/10 正解・POWER ${power}。${win?'ボスを倒しました！':'あと少し。もう一度挑戦！'}`;const box=$('misses');box.innerHTML='';if(!miss.length)box.innerHTML='<div class="miss">全問正解！</div>';else miss.forEach(x=>{const d=document.createElement('div');d.className='miss';d.innerHTML=`${escapeHtml(x.q)}<br><b>正解: ${escapeHtml(x.a)}</b>`;box.appendChild(d)});$('result').hidden=false}
function start(){pickRun();index=0;correct=0;power=0;miss=[];running=true;judged=false;answerMs=ANSWER_MS_BY_GRADE[grade]||18000;cycleMs=answerMs+PASS_MS;$('powerHud').textContent='0';$('boss').classList.remove('show');$('bossHp').style.width='100%';$('start').hidden=true;$('result').hidden=true;$('pet').className='pet';rebuildPackets();phaseStart=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
$('startBtn').onclick=start;$('retry').onclick=()=>{$('result').hidden=true;$('start').hidden=false};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')choose(0);if(e.key==='ArrowRight')choose(1)});renderGrades();load();
</script>
</body>
</html>
