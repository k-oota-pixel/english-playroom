<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>WORD GATE PREVIEW | もんすたでぃ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07141d;color:#fff}body{overflow:hidden}.wrap{height:100dvh;display:grid;place-items:center;padding:0}.game{position:relative;width:min(100vw,820px);height:100dvh;max-height:900px;overflow:hidden;background:linear-gradient(#58a7ca 0 34%,#78a883 34% 45%,#1f3a30 45% 100%)}.road{position:absolute;left:50%;top:34%;width:150%;height:75%;transform:translateX(-50%);clip-path:polygon(45% 0,55% 0,88% 100%,12% 100%);background:repeating-linear-gradient(180deg,#39434b 0 48px,#2b3339 48px 96px);animation:road .7s linear infinite}.road:after{content:"";position:absolute;left:49%;top:0;width:2%;height:100%;background:repeating-linear-gradient(180deg,#fff 0 24px,transparent 24px 52px);opacity:.65}.hud{position:absolute;z-index:10;top:10px;left:10px;right:10px;display:grid;grid-template-columns:1fr auto;gap:8px}.qbox,.power{background:rgba(7,25,36,.82);border:1px solid rgba(255,255,255,.2);border-radius:16px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.2)}.qbox{padding:10px 13px}.meta{display:flex;gap:10px;font-size:11px;font-weight:900;color:#cde9f4;letter-spacing:.06em}.meta span:last-child{margin-left:auto;color:#ffe07c}.question{font-weight:900;font-size:clamp(16px,2.8vw,22px);line-height:1.3;margin-top:5px}.power{min-width:86px;padding:9px 12px;text-align:center}.power small{display:block;font-size:10px;color:#bcd1dc}.power strong{font-size:24px;color:#ffe07c}.gates{position:absolute;z-index:5;top:43%;left:50%;width:76%;transform:translateX(-50%);display:grid;grid-template-columns:1fr 1fr;gap:15%}.gate{min-height:120px;border:4px solid #c8f4ff;border-radius:18px;background:linear-gradient(rgba(22,160,215,.7),rgba(5,63,96,.88));color:#fff;font-size:clamp(16px,3vw,23px);font-weight:1000;padding:12px;box-shadow:0 0 24px rgba(102,220,255,.25);cursor:pointer}.gate.correct{background:rgba(35,165,90,.9);border-color:#afffd0}.gate.wrong{background:rgba(190,48,60,.9);border-color:#ffc0c5}.pet{position:absolute;z-index:8;left:50%;bottom:8%;transform:translateX(-50%);font-size:96px;filter:drop-shadow(0 12px 6px rgba(0,0,0,.3));transition:left .25s ease;animation:bob .25s ease-in-out infinite alternate}.pet.left{left:31%}.pet.right{left:69%}.feedback{position:absolute;z-index:12;left:50%;top:65%;transform:translate(-50%,-50%);font-size:44px;font-weight:1000;opacity:0;text-shadow:0 5px 18px #000}.feedback.show{animation:pop .7s ease}.boss{position:absolute;z-index:7;left:50%;top:33%;transform:translate(-50%,-50%) scale(.1);opacity:0;text-align:center}.boss.show{animation:boss .7s ease forwards}.boss .monster{font-size:150px}.boss .bar{width:230px;height:12px;border-radius:999px;background:#3a1115;overflow:hidden;border:1px solid rgba(255,255,255,.3)}.boss .bar i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#ff5858,#ffb05d);transition:width .6s}.overlay{position:absolute;z-index:30;inset:0;display:grid;place-items:center;background:rgba(2,12,18,.78);backdrop-filter:blur(9px);padding:18px}.overlay[hidden]{display:none}.panel{width:min(100%,520px);background:#0c2735;border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.45)}.panel h1,.panel h2{margin:.2em 0}.panel p{color:#c9dae2;line-height:1.55}.grades{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:16px 0}.grades button,.primary{border:0;border-radius:13px;padding:11px 6px;font-weight:900;cursor:pointer}.grades button{background:#173f54;color:#e9f7ff}.grades button.sel{background:#e8f9ff;color:#0b3041}.primary{width:100%;background:linear-gradient(135deg,#7ce7ff,#8cffb6);color:#082b37;font-size:16px}.status{min-height:1.5em;text-align:center;font-size:12px;color:#a9c1cc;margin-top:9px}.misses{display:grid;gap:7px;max-height:210px;overflow:auto;margin:12px 0}.miss{background:rgba(255,255,255,.06);border-left:4px solid #ff7b85;border-radius:9px;padding:8px 10px;font-size:13px}.note{font-size:12px;color:#9fb4be;text-align:center;margin-top:10px}@keyframes road{to{background-position:0 96px}}@keyframes bob{to{transform:translateX(-50%) translateY(-8px)}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-70%) scale(.9)}}@keyframes boss{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@media(max-width:620px){.gates{width:88%;gap:8%}.gate{min-height:108px}.pet{font-size:82px}.grades{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="wrap"><main class="game" id="game">
<div class="road"></div>
<div class="hud"><div class="qbox"><div class="meta"><span id="grade">EIKEN</span><span id="progress">0 / 10</span><span id="score">0 CORRECT</span></div><div class="question" id="question">問題を読み込んでいます…</div></div><div class="power"><small>POWER</small><strong id="power">0</strong></div></div>
<div class="gates"><button class="gate" id="left"></button><button class="gate" id="right"></button></div>
<div class="pet" id="pet">🐶</div><div class="feedback" id="feedback"></div>
<div class="boss" id="boss"><div style="font-size:11px;font-weight:1000;letter-spacing:.12em;color:#ffc16b">FINAL BOSS</div><div class="monster">👹</div><div class="bar"><i id="bossHp"></i></div></div>
<section class="overlay" id="start"><div class="panel"><div style="font-size:11px;font-weight:900;letter-spacing:.14em;color:#87ddff">EXPERIMENTAL</div><h1>WORD GATE</h1><p>左右のゲートから正解を選び、10問でPOWERをためてボスを倒そう。</p><div class="grades" id="grades"></div><button class="primary" id="startBtn">この級でスタート</button><div class="status" id="status">公開プレビュー版・ログイン不要</div></div></section>
<section class="overlay" id="result" hidden><div class="panel"><div style="font-size:11px;font-weight:900;color:#8bddff">RUN COMPLETE</div><h2 id="resultTitle">結果</h2><p id="resultText"></p><div class="misses" id="misses"></div><button class="primary" id="retry">もう一度</button><div class="note">まずゲーム性確認用の独立プレビューです。</div></div></section>
</main></div>
<script>
const RETRY='https://k-oota-pixel.github.io/eiken-retry/';
const GRADES=['4級','3級','準2級','2級','準1級'];
const FALLBACK=[
{id:'a',grade:'4級',question:'I (____) tennis every Sunday.',choices:[{number:1,text:'play'},{number:2,text:'plays'},{number:3,text:'playing'},{number:4,text:'played'}],answer_number:1},
{id:'b',grade:'3級',question:'My sister is good (____) cooking.',choices:[{number:1,text:'at'},{number:2,text:'to'},{number:3,text:'for'},{number:4,text:'by'}],answer_number:1},
{id:'c',grade:'準2級',question:'I decided (____) home early.',choices:[{number:1,text:'go'},{number:2,text:'going'},{number:3,text:'to go'},{number:4,text:'went'}],answer_number:3},
{id:'d',grade:'2級',question:'The new system will (____) us to work faster.',choices:[{number:1,text:'enable'},{number:2,text:'prevent'},{number:3,text:'refuse'},{number:4,text:'avoid'}],answer_number:1},
{id:'e',grade:'準1級',question:'The committee decided to (____) the proposal.',choices:[{number:1,text:'defer'},{number:2,text:'derive'},{number:3,text:'deter'},{number:4,text:'devise'}],answer_number:1}
];
const $=id=>document.getElementById(id);let bank=[],grade='準2級',run=[],i=0,correct=0,power=0,busy=false,miss=[];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function clean(s){return String(s||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
function renderGrades(){const box=$('grades');box.innerHTML='';GRADES.forEach(g=>{const b=document.createElement('button');b.textContent=g;b.className=g===grade?'sel':'';b.onclick=()=>{grade=g;renderGrades()};box.appendChild(b)})}
async function load(){try{const r=await fetch(RETRY,{cache:'no-store'});if(!r.ok)throw 0;const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const raw=doc.getElementById('question-data')?.textContent;if(!raw)throw 0;bank=JSON.parse(raw).filter(q=>q?.grade&&q?.question&&Array.isArray(q.choices)&&q.choices.length>=4)}catch{bank=FALLBACK} $('status').textContent=bank.length>20?'英検問題DBを読み込みました':'予備問題で起動します'}
function pickRun(){const pool=bank.filter(q=>q.grade===grade);const src=pool.length?pool:FALLBACK.filter(q=>q.grade===grade);run=[];for(let n=0;n<10;n++)run.push(src[n%src.length]);run=shuffle(run)}
function makeTwo(q){const ans=Number(q.answer_number);const right=q.choices.find(c=>Number(c.number)===ans)||q.choices[0];const wrongs=q.choices.filter(c=>Number(c.number)!==ans);const wrong=wrongs[Math.floor(Math.random()*wrongs.length)]||q.choices[1];return shuffle([{text:String(right.text),ok:true},{text:String(wrong.text),ok:false}])}
function showQuestion(){if(i>=run.length){boss();return}const q=run[i],two=makeTwo(q);$('grade').textContent=grade;$('progress').textContent=`${i+1} / 10`;$('score').textContent=`${correct} CORRECT`;$('question').textContent=clean(q.question);['left','right'].forEach((id,n)=>{const b=$(id);b.textContent=two[n].text;b.className='gate';b.disabled=false;b.onclick=()=>answer(n,two,q)});$('pet').className='pet';busy=false}
function answer(n,two,q){if(busy)return;busy=true;const chosen=two[n],other=1-n;$('pet').className='pet '+(n===0?'left':'right');$('left').disabled=$('right').disabled=true;if(chosen.ok){correct++;power++;$(n===0?'left':'right').classList.add('correct');flash('GOOD!','#b6ffd2')}else{$(n===0?'left':'right').classList.add('wrong');$(other===0?'left':'right').classList.add('correct');const right=two.find(x=>x.ok)?.text||'';miss.push({q:clean(q.question),a:right});flash('MISS','#ffb3bb')} $('power').textContent=power;$('score').textContent=`${correct} CORRECT`;setTimeout(()=>{i++;showQuestion()},780)}
function flash(t,c){const f=$('feedback');f.textContent=t;f.style.color=c;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}
function boss(){busy=true;$('left').style.visibility=$('right').style.visibility='hidden';$('question').textContent='FINAL BOSS!';$('progress').textContent='10 / 10';$('boss').classList.add('show');setTimeout(()=>{const hp=Math.max(0,10-power);$('bossHp').style.width=`${hp*10}%`;flash(`POWER ${power}!`,'#ffe480');setTimeout(()=>finish(hp===0),900)},850)}
function finish(win){$('resultTitle').textContent=win?'BOSS CLEAR!':'BOSS SURVIVED…';$('resultText').textContent=`${correct}/10 正解・POWER ${power}。${win?'ボスを倒しました！':'あと少し。もう一度挑戦！'}`;const box=$('misses');box.innerHTML='';if(!miss.length)box.innerHTML='<div class="miss">全問正解！</div>';else miss.forEach(x=>{const d=document.createElement('div');d.className='miss';d.innerHTML=`${x.q}<br><b>正解: ${x.a}</b>`;box.appendChild(d)});$('result').hidden=false}
function start(){pickRun();i=0;correct=0;power=0;miss=[];busy=false;$('power').textContent='0';$('boss').classList.remove('show');$('bossHp').style.width='100%';$('left').style.visibility=$('right').style.visibility='visible';$('start').hidden=true;$('result').hidden=true;showQuestion()}
$('startBtn').onclick=start;$('retry').onclick=()=>{$('result').hidden=true;$('start').hidden=false};addEventListener('keydown',e=>{if(e.key==='ArrowLeft')$('left').click();if(e.key==='ArrowRight')$('right').click()});renderGrades();load();
</script>
</body>
</html>
