<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#f4f7ed">
<title>タイピングディフェンス | もんすたでぃ</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css?v=7">
<script src="../shell-bridge.js?v=2.3.41"></script>
<script type="module" src="./game.js?v=13"></script>
</head>
<body>
<main class="wrap">
 <section class="hero">
  <h1>タイピングディフェンス</h1>
  <p>モードを選んで、お城を守ろう！</p>
 </section>
 <div id="opening" class="card opening mode-chooser">
  <button type="button" id="normalStart" class="mode-choice mode-normal">ノーマルモード</button>
  <button type="button" id="hardStart" class="mode-choice mode-hard">ハードモード</button>
 </div>
 <section class="card game" id="game" hidden>
  <div class="hud">
   <div class="meter"><small>STAGE</small><strong id="stageMeter">1 / 5</strong></div>
   <div class="meter"><small>PHASE</small><strong id="phaseMeter">1 / 5</strong></div>
   <div class="meter"><small>防衛成功</small><strong id="killMeter">0 / 125</strong></div>
   <div class="meter health"><small>お城の耐久力</small><strong id="hpMeter">♥ ♥ ♥ ♥ ♥ ♥</strong></div>
  </div>
  <div class="course-label"><span id="courseName">単語の森</span><span id="phaseName">中学1年</span><span id="waveMeter">0 / 5</span></div>
  <div class="arena" id="arena" aria-label="お城へ迫る魔物を、タイピングで撃退するゲーム">
   <div class="sun"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="far-hills"></div><div class="field"></div><div class="road"></div>
   <div class="castle"><div class="castle-roof"></div><div class="tower tower-a"></div><div class="tower tower-b"></div><div class="castle-door"></div><div class="banner">♥</div></div>
   <div id="pet" class="pet" aria-label="あなたのペット">🐾</div>
   <div id="enemyLayer" class="enemy-layer" aria-hidden="true"></div>
   <div id="effects" class="effects" aria-hidden="true"></div>
   <div id="phaseOverlay" class="overlay" hidden><div class="overlay-card">
    <div class="eyebrow" id="overlayEyebrow">PHASE CLEAR</div>
    <h2 id="overlayHeading">フェーズクリア！</h2>
    <p id="overlayBody">お城を守り切った！</p>
    <p class="reward-status" id="rewardStatus" aria-live="polite"></p>
    <button class="primary" type="button" id="nextPhase">次のフェーズへ</button>
    <button class="retry-reward" type="button" id="retryReward" hidden>コイン獲得を再試行</button>
   </div></div>
  </div>
  <div class="question-panel" aria-live="polite">
    <div class="question-label"><span id="questionType">中学1年</span><span>タイプして魔法を発射！</span></div>
    <div class="japanese" id="wordMeaning" hidden></div>
    <div class="sentence" id="questionTemplate">—</div>
    <div class="word-choices" id="wordChoices" hidden></div>
    <label for="typing" class="typing-label">英文をタイプ（ステージ2以降はスペース不要）</label>
    <input id="typing" type="text" lang="en" spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off" inputmode="text" placeholder="ここに英語をタイプ" maxlength="200">
    <div class="answer-progress"><div id="answerBar"></div></div>
    <p class="feedback" id="feedback" aria-live="polite">先頭の敵をねらってタイプしよう！</p>
  </div>
  <div class="game-actions"><button id="restart" type="button">最初からやり直す</button><a href="../">ゲームを終了する</a></div>
 </section>
</main>
</body>
</html>
