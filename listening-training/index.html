<style>
*{box-sizing:border-box}html{color-scheme:light}body{margin:0;background:#f6f5ef;color:#173f39;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:860px;margin:auto;padding:18px 16px 36px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:#4a746a;text-decoration:none;font-size:12px;font-weight:800}.brand{font-size:11px;letter-spacing:.12em;color:#6e847d;font-weight:800}.hero{margin:22px 0 18px}.eyebrow{font-size:10px;letter-spacing:.14em;color:#668078;font-weight:800}.hero h1{font-size:clamp(30px,6vw,46px);margin:5px 0 8px;line-height:1.08}.hero p{font-size:13px;color:#687a74;line-height:1.65;margin:0;max-width:650px}.panel{background:#fff;border:1px solid #dce5dd;border-radius:20px;box-shadow:0 5px 18px #183b380c;padding:18px}.screen[hidden]{display:none!important}.section-title{font-size:13px;font-weight:900;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.level,.mode,.diff{appearance:none;text-align:left;border:1px solid #d9e4dc;background:#fbfcf9;border-radius:15px;padding:15px;cursor:pointer;color:inherit;font:inherit;transition:.14s}.level:hover,.mode:hover,.diff:hover{transform:translateY(-1px);border-color:#aac7b7;background:#f5faf6}.level strong,.mode strong,.diff strong{display:block;font-size:18px}.level span,.mode span,.diff span{display:block;color:#718079;font-size:11px;margin-top:4px;line-height:1.45}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode .big{font-size:28px;margin-bottom:7px}.diffs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.diff{text-align:center;padding:12px 8px}.diff strong{font-size:13px}.diff span{font-size:9.5px}.mini-back{appearance:none;border:0;background:none;color:#56776d;padding:0;font:inherit;font-size:11px;font-weight:800;cursor:pointer;margin-bottom:12px}.quiz-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.quiz-label{font-size:10px;letter-spacing:.1em;color:#74877f;font-weight:800}.quiz-title{font-size:20px;font-weight:900;margin-top:2px}.queue{font-size:10px;color:#7b8b85;text-align:right}.audio-box{display:flex;align-items:center;gap:10px;background:#edf6f0;border:1px solid #d6e8dc;border-radius:15px;padding:11px 12px;margin:12px 0}.listen-btn{appearance:none;border:0;border-radius:12px;background:#216553;color:#fff;padding:10px 14px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;min-width:112px}.listen-btn.playing{background:#b97922}.audio-note{font-size:10.5px;color:#62786f;line-height:1.45}.ill-wrap{max-width:384px;margin:12px auto;background:#fff;border:1px solid #e0e6df;border-radius:14px;overflow:hidden;aspect-ratio:384/317}.ill-wrap img{display:block;width:100%;height:auto}.question-text{font-size:16px;font-weight:850;line-height:1.5;margin:15px 0 10px}.choices{display:grid;gap:8px}.choice{appearance:none;width:100%;border:1px solid #d7e2da;background:#fff;border-radius:13px;padding:12px 13px;text-align:left;color:inherit;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:10px;align-items:flex-start}.choice .num{display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;border-radius:8px;background:#edf4ef;font-size:11px;font-weight:950}.choices.spoken{grid-template-columns:repeat(3,1fr);max-width:400px;margin:auto}.choices.spoken .choice{justify-content:center;padding:16px}.choices.spoken .choice .num{width:42px;height:42px;flex-basis:42px;font-size:18px}.choice:hover:not(:disabled){border-color:#9cc1ac;background:#f7fbf8}.choice.correct{border-color:#63a77d;background:#edf9f1}.choice.wrong{border-color:#d28775;background:#fff3f0}.choice:disabled{cursor:default}.feedback{margin-top:12px;border-radius:14px;padding:12px 13px;font-size:12px;line-height:1.55}.feedback.ok{background:#edf9f1;color:#215b38}.feedback.ng{background:#fff3f0;color:#7f3f34}.reveal{margin-top:10px;border-top:1px solid #e5ebe6;padding-top:10px;color:#53675f}.reveal .line{font-size:11.5px;margin:3px 0}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}.secondary,.next{appearance:none;border-radius:12px;padding:10px 14px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.secondary{border:1px solid #d5e1d9;background:#fff;color:#315f52}.next{border:0;background:#1e5c4d;color:#fff}.dict-note{font-size:11px;color:#6f817a;background:#f8faf7;border-radius:12px;padding:9px 10px;margin:10px 0}.dictation{line-height:2.35;font-size:15px;background:#fbfcfa;border:1px solid #e1e7e2;border-radius:14px;padding:13px}.turn{margin:5px 0}.speaker{display:inline-block;min-width:24px;font-weight:900;color:#638077}.blank{display:inline-block;width:7.5em;max-width:40vw;border:0;border-bottom:2px solid #86a79a;background:#fff;padding:3px 5px;margin:0 2px;font:inherit;font-size:14px;border-radius:5px 5px 0 0;vertical-align:baseline}.blank.good{background:#eaf8ef;border-color:#4d9c69}.blank.bad{background:#fff0ed;border-color:#c56c59}.full-answer{font-size:11.5px;line-height:1.55;color:#52675f;margin-top:9px;background:#f3f6f3;border-radius:10px;padding:9px}.legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.pill{font-size:9.5px;border-radius:999px;padding:4px 8px;background:#f0f4f1;color:#6d7f78}.statusline{font-size:10px;color:#72837c;margin-top:10px;text-align:center}.error{background:#fff2ef;color:#8b4136;border:1px solid #f0c9c0;border-radius:14px;padding:12px;font-size:12px}.loading{text-align:center;padding:30px;color:#6d8078;font-size:12px}@media(max-width:600px){.app{padding:14px 11px 26px}.panel{padding:14px;border-radius:17px}.hero{margin:16px 2px 14px}.hero h1{font-size:31px}.grid,.mode-grid{grid-template-columns:1fr}.diffs{grid-template-columns:repeat(3,1fr)}.level strong,.mode strong{font-size:17px}.quiz-title{font-size:18px}.audio-box{align-items:flex-start}.listen-btn{min-width:100px}.choice{font-size:12.5px}.dictation{font-size:14px;padding:10px}.blank{width:6.2em}.actions{position:sticky;bottom:8px;background:#ffffffee;padding:8px;border-radius:14px;box-shadow:0 4px 14px #1d3b3614}}
</style>

<body>
<div class="app">
  <div class="top"><a class="back" href="../">← もんすたでぃ</a><div class="brand">LISTENING TRAINING</div></div>
  <div class="hero"><div class="eyebrow">LISTEN · UNDERSTAND · WRITE</div><h1>Listening Training</h1><p>「問題演習」と「ディクテーション」はそれぞれ5問で1セット。5問完了で1コイン獲得できます（回数制限なし）。問題はランダムに出題され、一巡するまで同じ問題が出にくい仕組みです。</p></div>
  <div class="panel">
    <section id="loading" class="loading">教材を読み込んでいます…</section>
    <section id="levelScreen" class="screen" hidden>
      <h2 class="section-title">レベルを選んでください</h2>
      <div class="grid">
        <button class="level" data-level="3"><strong>3級</strong><span>第1部＋第2部 · 100問</span></button>
        <button class="level" data-level="pre2"><strong>準2級</strong><span>第1部＋第2部 · 100問</span></button>
        <button class="level" data-level="2"><strong>2級</strong><span>第1部 · 75問</span></button>
        <button class="level" data-level="pre1"><strong>準1級</strong><span>Part 1 · 60問</span></button>
      </div>
      <div class="statusline">全335問収録</div>
    </section>
    <section id="modeScreen" class="screen" hidden>
      <button id="backLevel" class="mini-back">← レベル選択</button>
      <h2 id="modeHeading" class="section-title"></h2>
      <div class="mode-grid">
        <button class="mode" id="practiceMode"><div class="big">🎧</div><strong>問題演習</strong><span>本番形式で5問に挑戦。5問完了で1コイン。</span></button>
        <button class="mode" id="dictationMode"><div class="big">✍️</div><strong>Dictation</strong><span>同じ会話音声を使って5問に挑戦。5問完了で1コイン。</span></button>
      </div>
      <div id="diffArea" hidden>
        <h3 class="section-title" style="margin-top:16px">難易度を選んでください</h3>
        <div class="diffs">
          <button class="diff" data-diff="easy"><strong>EASY</strong><span>空欄 少なめ</span></button>
          <button class="diff" data-diff="normal"><strong>NORMAL</strong><span>空欄 標準</span></button>
          <button class="diff" data-diff="hard"><strong>HARD</strong><span>空欄 多め</span></button>
        </div>
      </div>
    </section>
    <section id="quizScreen" class="screen" hidden>
      <button id="backMode" class="mini-back">← モード選択</button>
      <div class="quiz-head"><div><div id="quizLabel" class="quiz-label"></div><div id="quizTitle" class="quiz-title"></div></div><div id="queueInfo" class="queue"></div></div>
      <div id="imageHost"></div>
      <div class="audio-box"><button id="listenBtn" class="listen-btn">▶ 音声を聞く</button><div id="audioNote" class="audio-note"></div></div>
      <div id="practiceHost"></div>
      <div id="dictationHost"></div>
      <div id="feedbackHost" aria-live="polite"></div>
      <div id="actionHost" class="actions"></div>
    </section>
    <section id="errorScreen" class="screen" hidden><div id="errorText" class="error"></div></section>
  </div>
</div>
<audio id="player" preload="metadata"></audio>
<script type="module">
import '../coin-reward.js?v=1.10.4';
import {LISTENING_META} from './data.js';
import {validateQuestions} from './loader.js';
import {IMG_2020_2} from './image-2020-2.js';
import {IMG_2020_3} from './image-2020-3.js';
import {IMG_2021_1} from './image-2021-1.js';
import {IMG_2021_2} from './image-2021-2.js';
import {IMG_2021_3} from './image-2021-3.js';
async function unpackQuestions(){
  const response=await fetch('./questions.json');
  if(!response.ok)throw new Error('教材を取得できませんでした。');
  return response.json();
}
let LISTENING_QUESTIONS=[];
const LISTENING_IMAGES={'g3-2020-2':IMG_2020_2,'g3-2020-3':IMG_2020_3,'g3-2021-1':IMG_2021_1,'g3-2021-2':IMG_2021_2,'g3-2021-3':IMG_2021_3};
const $=s=>document.querySelector(s);
const screens=['#levelScreen','#modeScreen','#quizScreen','#errorScreen'];
const labels={'3':'3級','pre2':'準2級','2':'2級','pre1':'準1級'};
const diffLabels={easy:'EASY',normal:'NORMAL',hard:'HARD'};
const SET_TOTAL=5;
let state={level:null,mode:null,diff:null,q:null,answered:false,masked:[],setDone:0,questionCounted:false,rewardHandled:false};
const player=$('#player'); let stopHandler=null; let playbackId=0;
player.addEventListener('ended',()=>stopAudio());
function show(id){screens.forEach(s=>$(s).hidden=s!==id);$('#loading').hidden=true;}
function fail(msg){$('#errorText').textContent=msg;show('#errorScreen');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function eligible(){return LISTENING_QUESTIONS.filter(q=>q.level===state.level)}
function queueKey(){return `monstudy-listening:${state.level}:${state.mode}:queue`}
const memoryQueues=new Map();
function saveQueue(arr){memoryQueues.set(queueKey(),arr.slice());try{localStorage.setItem(queueKey(),JSON.stringify(arr))}catch{}}
function getQueue(){
  const valid=new Set(eligible().map(q=>q.id)); let arr=[];
  if(memoryQueues.has(queueKey()))arr=memoryQueues.get(queueKey()).slice();
  else try{arr=JSON.parse(localStorage.getItem(queueKey())||'[]')}catch{}
  arr=Array.isArray(arr)?[...new Set(arr.filter(id=>valid.has(id)))]:[];
  if(!arr.length){arr=shuffle([...valid]);if(arr.length>1&&arr[0]===state.q?.id)[arr[0],arr[1]]=[arr[1],arr[0]];saveQueue(arr)}
  return arr;
}
function startSet(mode,diff=null){
  state.setId=crypto.randomUUID();state.mode=mode;state.diff=diff;state.setDone=0;state.rewardHandled=false;state.questionCounted=false;nextQuestion();
}
function nextQuestion(){
  const qlist=getQueue(); const id=qlist.shift(); saveQueue(qlist);
  state.q=LISTENING_QUESTIONS.find(q=>q.id===id); state.answered=false; state.masked=[]; state.questionCounted=false;
  renderQuestion();
}
function stopAudio(){playbackId++;if(stopHandler){player.removeEventListener('timeupdate',stopHandler);stopHandler=null}player.pause();$('#listenBtn').classList.remove('playing');$('#listenBtn').textContent='▶ もう一度聞く'}
async function playClip(){
  const q=state.q;if(!q)return;stopAudio();const requestId=playbackId;
  try{
    if(!player.src.endsWith(q.audio)){player.src=q.audio;player.load();await new Promise((res,rej)=>{if(player.readyState>=1)return res();const ok=()=>{cleanup();res()},bad=()=>{cleanup();rej()};const cleanup=()=>{player.removeEventListener('loadedmetadata',ok);player.removeEventListener('error',bad)};player.addEventListener('loadedmetadata',ok);player.addEventListener('error',bad)})}
    if(requestId!==playbackId||state.q!==q)return;player.currentTime=Math.max(0,q.start); stopHandler=()=>{if(player.currentTime>=q.end){stopAudio()}};player.addEventListener('timeupdate',stopHandler);
    await player.play();if(requestId!==playbackId){player.pause();return}$('#listenBtn').classList.add('playing');$('#listenBtn').textContent='■ 再生中';
  }catch(e){if(requestId!==playbackId)return;$('#audioNote').textContent='音声を再生できませんでした。通信状況を確認して、もう一度お試しください。'}
}
$('#listenBtn').addEventListener('click',()=>{if(!player.paused)stopAudio();else playClip()});
function renderImage(q){
 const host=$('#imageHost');host.replaceChildren();if(!q.image)return;
 const wrap=document.createElement('div');wrap.className='ill-wrap';
 const img=document.createElement('img');img.alt='問題のイラスト';
 if(q.image.src){img.src=q.image.src;wrap.style.aspectRatio='auto'}
 else{img.src=LISTENING_IMAGES[q.image.key]||'';img.style.transform=`translateY(-${q.image.index*10}%)`}
 wrap.append(img);host.append(wrap);
}
function revealHTML(q,includeChoices=true){let h='<div class="reveal"><strong>Script</strong>';q.dialogue.forEach((x,i)=>h+=`<div class="line"><b>${i%2?'B':'A'}:</b> ${escapeHTML(x)}</div>`);if(q.question)h+=`<div class="line"><b>Question:</b> ${escapeHTML(q.question)}</div>`;if(includeChoices&&q.choiceMode==='spoken')q.choices.forEach((x,i)=>h+=`<div class="line"><b>${i+1}.</b> ${escapeHTML(x)}</div>`);return h+'</div>'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPractice(q){
 const host=$('#practiceHost');host.replaceChildren();$('#dictationHost').replaceChildren();
 const choices=document.createElement('div');choices.className='choices'+(q.choiceMode==='spoken'?' spoken':'');
 q.choices.forEach((text,i)=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="num">${i+1}</span>${q.choiceMode==='visual'?`<span>${escapeHTML(text)}</span>`:''}`;b.addEventListener('click',()=>answerPractice(i+1,b,choices));choices.append(b)});host.append(choices);
}
function answerPractice(ans,button,choices){if(state.answered)return;state.answered=true;const q=state.q;choices.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i+1===q.answer)b.classList.add('correct')});if(ans!==q.answer)button.classList.add('wrong');const ok=ans===q.answer;$('#feedbackHost').innerHTML=`<div class="feedback ${ok?'ok':'ng'}"><strong>${ok?'✓ Correct!':'✕ Try to catch the key information.'}</strong>${ok?'':'<br>正解は '+q.answer+' です。'}${revealHTML(q,true)}</div>`;registerCompletedQuestion(ok);renderActions(true)}
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function tokenizeLine(line){return line.split(/([A-Za-z]+(?:[’'][A-Za-z]+)?)/g).filter(x=>x!=='')}
function makeMask(q){
 const ratio={easy:.25,normal:.48,hard:.72}[state.diff]||.48;let candidates=[];const toks=q.dialogue.map((line,li)=>tokenizeLine(line));
 toks.forEach((arr,li)=>arr.forEach((t,ti)=>{if(/^[A-Za-z]/.test(t)){const plain=t.replace(/[’']/g,'');if(state.diff==='easy'&&plain.length<4)return;if(state.diff==='normal'&&plain.length<2)return;candidates.push({li,ti,score:hash(q.id+'|'+li+'|'+ti)})}}));
 candidates.sort((a,b)=>a.score-b.score);const count=Math.max(1,Math.round(candidates.length*ratio));const set=new Set(candidates.slice(0,count).map(x=>x.li+':'+x.ti));return {toks,set};
}
function norm(s){return String(s).trim().toLowerCase().replace(/[’]/g,"'").replace(/[^a-z']/g,'')}
function renderDictation(q){
 $('#practiceHost').replaceChildren();const host=$('#dictationHost');host.replaceChildren();
 const note=document.createElement('div');note.className='dict-note';note.textContent='会話部分を書き取ります。Questionや選択肢の音声が続く場合、それらは入力しなくてOKです。';host.append(note);
 const box=document.createElement('div');box.className='dictation';const {toks,set}=makeMask(q);state.masked=[];
 toks.forEach((arr,li)=>{const turn=document.createElement('div');turn.className='turn';const sp=document.createElement('span');sp.className='speaker';sp.textContent=(li%2?'B:':'A:');turn.append(sp);arr.forEach((t,ti)=>{if(set.has(li+':'+ti)){const inp=document.createElement('input');inp.className='blank';inp.autocomplete='off';inp.autocapitalize='none';inp.spellcheck=false;inp.dataset.answer=t;inp.setAttribute('aria-label','dictation blank');inp.style.width=Math.min(10,Math.max(3.2,t.length*.72+1.5))+'em';turn.append(inp);state.masked.push(inp)}else turn.append(document.createTextNode(t))});box.append(turn)});host.append(box);
 const legend=document.createElement('div');legend.className='legend';legend.innerHTML=`<span class="pill">${diffLabels[state.diff]}</span><span class="pill">${state.masked.length} blanks</span>`;host.append(legend);renderActions(false);
}
function checkDictation(){if(state.answered)return;state.answered=true;let good=0;state.masked.forEach(inp=>{const ok=norm(inp.value)===norm(inp.dataset.answer);inp.classList.add(ok?'good':'bad');inp.disabled=true;if(ok)good++});const pct=Math.round(good/state.masked.length*100);const ok=good===state.masked.length;const script=state.q.dialogue.map((x,i)=>`<div><b>${i%2?'B':'A'}:</b> ${escapeHTML(x)}</div>`).join('');$('#feedbackHost').innerHTML=`<div class="feedback ${ok?'ok':'ng'}"><strong>${ok?'✓ Perfect!':`${good} / ${state.masked.length} correct (${pct}%)`}</strong><div class="full-answer">${script}</div></div>`;registerCompletedQuestion(ok);renderActions(true)}
function registerCompletedQuestion(correct){
  if(state.questionCounted)return;state.questionCounted=true;window.EnglishPlayroomCoins?.recordTitleEvent?.('listening-training',{kind:'answer',itemId:state.q.id,grade:state.level,mode:state.mode,correct});window.EnglishPlayroomCoins?.recordLearningActivity?.();state.setDone=Math.min(SET_TOTAL,state.setDone+1);$('#queueInfo').textContent=`${state.setDone} / ${SET_TOTAL} 問完了`;
  if(state.setDone>=SET_TOTAL&&!state.rewardHandled){state.rewardHandled=true;awardSetCoin();}
}
async function awardSetCoin(){
  const api=window.EnglishPlayroomCoins;if(!api?.awardListening)return;
  const setId=state.setId;
  const isPractice=state.mode==='practice';
  const result=await api.awardListening(setId);
  const host=$('#feedbackHost');if(state.setId!==setId||state.setDone<SET_TOTAL)return;
  if(result?.awarded)host.insertAdjacentHTML('beforeend','<div class="feedback ok"><strong>🎉 5問完了！ 🪙 1コインGET！</strong></div>');
  else if(result?.reason==='already-today')host.insertAdjacentHTML('beforeend','<div class="feedback ok"><strong>🎉 5問完了！</strong><br>このセットのコインは獲得済みです。</div>');
}
function renderActions(answered){
 const h=$('#actionHost');h.replaceChildren();
 if(state.mode==='dictation'&&!answered){const c=document.createElement('button');c.className='next';c.textContent='CHECK';c.addEventListener('click',checkDictation);h.append(c);return}
 if(answered){
   const r=document.createElement('button');r.className='secondary';r.textContent='🔊 もう一度聞く';r.addEventListener('click',playClip);
   const n=document.createElement('button');n.className='next';
   if(state.setDone>=SET_TOTAL){n.textContent='5問完了 → モード選択';n.addEventListener('click',()=>{stopAudio();$('#diffArea').hidden=true;show('#modeScreen')});}
   else{n.textContent='次の問題へ →';n.addEventListener('click',()=>{stopAudio();nextQuestion()});}
   h.append(r,n)
 }
}
function renderQuestion(){const q=state.q;show('#quizScreen');$('#feedbackHost').replaceChildren();$('#actionHost').replaceChildren();renderImage(q);$('#quizLabel').textContent=`${labels[state.level]} · ${state.mode==='practice'?'問題演習':'DICTATION '+diffLabels[state.diff]}`;$('#quizTitle').textContent=state.mode==='practice'?'Listening Question':'Dictation';$('#queueInfo').textContent=`第 ${Math.min(state.setDone+1,SET_TOTAL)} / ${SET_TOTAL} 問`;$('#audioNote').textContent=state.mode==='practice'?(q.choiceMode==='spoken'?'選択肢も音声で流れます。番号で答えてください。':'会話とQuestionを聞いて、最も適切な答えを選んでください。'):'会話を聞いて、空欄の英語を入力してください。';$('#listenBtn').textContent='▶ 音声を聞く';$('#listenBtn').classList.remove('playing');state.mode==='practice'?renderPractice(q):renderDictation(q)}
function selectLevel(level){state.level=level;$('#modeHeading').textContent=`${labels[level]} — トレーニングを選択`;$('#diffArea').hidden=true;show('#modeScreen')}
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>selectLevel(b.dataset.level)));
$('#backLevel').addEventListener('click',()=>show('#levelScreen'));$('#backMode').addEventListener('click',()=>{stopAudio();$('#diffArea').hidden=true;show('#modeScreen')});
$('#practiceMode').addEventListener('click',()=>startSet('practice'));
$('#dictationMode').addEventListener('click',()=>{$('#diffArea').hidden=false});
