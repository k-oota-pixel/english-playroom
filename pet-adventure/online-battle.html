<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d35">
<title>オンライン対戦 | もんすたでぃ</title>
<link rel="stylesheet" href="./online-battle.css?v=1.0.0">
<script type="module" src="https://k-oota-pixel.github.io/english-playroom/access-gate.js?v=2.3.14"></script>
<script type="module" src="./online-battle.js?v=1.0.0"></script>
</head>
<body>
<header class="topbar"><a href="./" class="brand">← 魔王の塔へ戻る</a><span class="logo">MONSTUDY · DUEL</span></header>
<main class="wrap">
  <section class="intro">
    <span class="eyebrow">ONLINE PET BATTLE</span>
    <h1>ペット対戦</h1>
    <p>友だちと同じルームに入って、育てたペットで勝負しよう。時間制限はありません。</p>
    <div class="coin-pill">所持コイン <strong id="coinCount">—</strong></div>
  </section>
  <p id="notice" class="notice" role="status">ログイン情報を確認しています…</p>
  <section id="roomList" class="room-list" hidden>
    <div class="section-heading"><h2>対戦ルーム</h2><button id="refreshBtn" class="subtle" type="button">更新</button></div>
    <p class="hint">同じ番号のルームに入ってください。２人が準備完了すると対戦が始まります。</p>
    <div id="rooms" class="rooms"></div>
  </section>
  <section id="roomView" hidden></section>
</main>
<div id="resultFx" class="result-fx" hidden aria-live="assertive">
  <div class="confetti" aria-hidden="true"></div>
  <div class="result-card"><span id="resultMark">🏆</span><p id="resultTitle">VICTORY</p><strong id="resultText">勝利！</strong><small>対戦結果が確定しました</small></div>
</div>
</body>
</html>
