<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173d35">
<title>PET ADVENTURE | もんすたでぃ</title>
<link rel="stylesheet" href="./styles.css?v=1.10.8">
</head>
<body>
<main class="app-shell">
  <header class="topbar">
    <a class="back" href="../" aria-label="もんすたでぃへ戻る">←</a>
    <div>
      <div class="brand">MONSTUDY · PET ADVENTURE</div>
      <h1 id="modeTitle">WORD TOWER</h1>
    </div>
    <button class="sound-chip" id="helpBtn" type="button" aria-label="遊び方">?</button>
  </header>

  <nav class="mode-tabs" aria-label="ゲームモード">
    <a id="towerTab" href="?mode=tower">🗼 WORD TOWER</a>
    <a id="dungeonTab" href="?mode=dungeon">🕳️ EIKEN DUNGEON</a>
  </nav>

  <section class="stage-card" id="stageCard">
    <div class="stage-meta">
      <span id="areaLabel">空へ続く塔</span>
      <strong id="stageLabel">1F</strong>
      <span id="enemyCount">ENEMY 1 / 3</span>
    </div>
    <div class="best-line">BEST <strong id="bestLabel">1F</strong></div>
  </section>

  <section class="battlefield" id="battlefield" aria-label="バトル画面">
    <div class="fighter pet-side">
      <div class="name-line"><strong id="petName">MY PET</strong><span>YOU</span></div>
      <div class="hp"><i id="petHpBar"></i></div>
      <div class="hp-text" id="petHpText">10 / 10</div>
      <div class="pet-visual" id="petVisual" aria-label="ペット">🐾</div>
    </div>

    <div class="versus" aria-hidden="true">VS</div>

    <div class="fighter enemy-side" id="enemySide">
      <div class="name-line"><strong id="enemyName">TOWER BEAST</strong><span id="enemyElement">🔥 FIRE</span></div>
      <div class="hp enemy-hp"><i id="enemyHpBar"></i></div>
      <div class="hp-text" id="enemyHpText">6 / 6</div>
      <div class="enemy-visual" id="enemyVisual" aria-label="敵">👾</div>
    </div>

    <div class="battle-flash" id="battleFlash" aria-live="polite"></div>
  </section>

  <section class="panel" id="attackPanel">
    <div class="panel-head">
      <div>
        <span class="kicker">CHOOSE YOUR ATTACK</span>
        <h2 id="attackHeading">英単語を選ぼう</h2>
      </div>
      <span class="hint" id="attackHint">弱点なら ×2</span>
    </div>
    <div class="attack-grid" id="attackGrid"></div>
  </section>

  <section class="panel quiz-panel" id="quizPanel" hidden>
    <div class="quiz-top">
      <span class="attack-badge" id="attackBadge">💧 WATER</span>
      <span id="attackPower">POWER 20</span>
    </div>
    <div class="question" id="questionText"></div>
    <div class="answer-grid" id="answerGrid"></div>
    <div class="answer-feedback" id="answerFeedback" aria-live="polite"></div>
    <button class="next-btn" id="nextBtn" type="button" hidden>次へ →</button>
  </section>

  <section class="loading-card" id="loadingCard">
    <div class="spinner" aria-hidden="true"></div>
    <strong>冒険の準備中…</strong>
    <span id="loadingText">ペットと教材データを読み込んでいます</span>
  </section>

  <section class="result-card" id="resultCard" hidden>
    <div class="result-icon" id="resultIcon">🏁</div>
    <span class="kicker" id="resultKicker">RUN COMPLETE</span>
    <h2 id="resultTitle">GAME OVER</h2>
    <p id="resultText"></p>
    <div class="result-actions">
      <button class="primary-btn" id="retryBtn" type="button">1Fから再挑戦</button>
      <button class="secondary-btn" id="checkpointBtn" type="button">チェックポイントから</button>
    </div>
  </section>

  <p class="footnote" id="dataNote"></p>
</main>

<dialog id="helpDialog" class="help-dialog">
  <div class="help-inner">
    <button class="dialog-close" id="helpClose" type="button" aria-label="閉じる">×</button>
    <span class="kicker">HOW TO PLAY</span>
    <h2 id="helpTitle">WORD TOWER</h2>
    <div id="helpBody"></div>
  </div>
</dialog>

<script type="module" src="./game.js?v=1.10.8"></script>
</body>
</html>
